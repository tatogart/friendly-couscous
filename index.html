<style>

  #pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;
    align-items:flex-end;pointer-events:none;z-index:5;
    padding:0 max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom))

  .btn.on{background:rgba(255,255,255,.45);transform:scale(.93)}

  body.touch #wrap{padding:0}
  body.touch canvas{border-radius:0;box-shadow:none}

/* ================== СЛУЧАЙНЫЕ УРОВНИ ПО СИДУ ==================
   Генератор строит уровень слева направо вдоль земли, поэтому проход
   есть всегда: ямы не шире 3 клеток, площадки — только на досягаемой
   высоте, перед выходом всегда чистый участок. */
var SEED_ABC = "ACDEFHJKLMNPRTUVWXY3479";
var GEN_NAMES = ["Первый этаж","Раздевалка","Столовая","Актовый зал","Лестница",
                 "Спортзал","Коридор","Библиотека","Кабинет труда","Чердак",
                 "Крыша","Школьный двор","Рекреация","Кабинет химии"];
var GEN_HINTS = ["Этого уровня ещё никто не видел","Сид сгенерил — тебе проходить",
                 "Смотри под ноги","Тут может быть что угодно","Беги, не думай",
                 "Звонок не ждёт"];

function hashSeed(str){
  var h = 2166136261, i;
  str = String(str).toUpperCase();
  for(i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randomSeed(){
  var out = "", i;
  for(i=0;i<5;i++) out += SEED_ABC.charAt(Math.floor(Math.random()*SEED_ABC.length));
  return out;
}
function cleanSeed(str){
  var out = "", i, ch;
  str = String(str || "").toUpperCase();
  for(i=0;i<str.length && out.length<8;i++){
    ch = str.charAt(i);
    if(SEED_ABC.indexOf(ch) >= 0 || /[0-9A-Z]/.test(ch)) out += ch;
  }
  return out;
}
function irnd(rnd, a, b){ return a + Math.floor(rnd()*(b-a+1)); }
function pickOf(rnd, arr){ return arr[Math.floor(rnd()*arr.length)]; }

function genLevel(rnd, idx, name, withKey){
  var W = 40 + idx*2, H = 15, i, x, y;
  var g = [], movers = [], plats = [];
  for(y=0;y<H;y++){ g.push([]); for(x=0;x<W;x++) g[y].push("."); }
  for(x=0;x<W;x++){ g[13][x] = "#"; g[14][x] = "#"; }
  g[12][2] = "@";
  var endCol = W - 4, col = 6;

  function coins(row, from, n){
    for(var k=0;k<n;k++) if(from+k > 2 && from+k < W-2 && g[row][from+k] === ".") g[row][from+k] = "o";
  }
  function carve(from, w){
    for(var k=0;k<w;k++){ g[13][from+k] = "."; g[14][from+k] = "."; }
  }

  var pool = ["flat","coins","platform"];
  if(idx >= 1) pool = pool.concat(["pit","enemy"]);
  if(idx >= 2) pool = pool.concat(["spikes","enemy","platform"]);
  if(idx >= 3) pool = pool.concat(["pad","pit"]);
  if(idx >= 4) pool = pool.concat(["mover","fly","spikes"]);
  if(idx >= 5) pool = pool.concat(["mover","fly","enemy"]);

  while(col < endCol - 6){
    var f = pickOf(rnd, pool), w, row;
    if(f === "flat"){ col += irnd(rnd,3,5); }
    else if(f === "coins"){ coins(12, col, irnd(rnd,2,3)); col += 5; }
    else if(f === "pit" || f === "mover"){
      var mover = (f === "mover");
      w = mover ? irnd(rnd,4,5) : irnd(rnd, 2, idx >= 3 ? 3 : 2);
      if(col + w > endCol - 6){ col += 3; continue; }
      carve(col, w);
      if(mover){
        movers.push({ tx:col, ty:11, tw:3, axis:"x", dist:Math.max(2, w-3),
                      speed:0.018 + rnd()*0.008, phase:rnd()*6.28 });
        coins(10, col+1, 2);
      } else if(rnd() < 0.5) coins(11, col, w);
      col += w + 4;                     // запас на разбег перед следующей фичей
    }
    else if(f === "spikes"){
      w = irnd(rnd,1,2);
      for(i=0;i<w;i++) g[12][col+i] = "^";
      col += w + 4;
    }
    else if(f === "enemy"){ g[12][col] = "x"; col += 6; }
    else if(f === "fly"){ g[irnd(rnd,7,9)][col] = "v"; col += 4; }
    else if(f === "platform"){
      w = irnd(rnd,3,5); row = irnd(rnd,10,11);
      for(i=0;i<w;i++) g[row][col+i] = "=";
      coins(row-1, col+1, Math.min(w-1, irnd(rnd,1,3)));
      plats.push({ x:col + Math.floor(w/2), y:row-1 });
      col += w + 2;
    }
    else if(f === "pad"){
      g[12][col] = "J";
      var prow = irnd(rnd,5,6), pw = irnd(rnd,3,4), px = Math.max(1, col + irnd(rnd,-1,1));
      for(i=0;i<pw;i++) if(px+i < W-1) g[prow][px+i] = "=";
      coins(prow-1, px, Math.min(pw, 3));
      plats.push({ x:px + 1, y:prow-1 });
      col += pw + 3;
    }
  }

  g[12][endCol] = "E";

  /* ключ кладём на площадку, а если их нет — на ровную землю */
  if(withKey){
    if(plats.length){
      var pl = plats[Math.floor(rnd()*plats.length)];
      g[pl.y][pl.x] = "K";
    } else {
      for(x = Math.floor(endCol/2); x < endCol-2; x++)
        if(g[12][x] === "." && g[13][x] === "#"){ g[12][x] = "K"; break; }
    }
  }

  /* минимум пирожков, чтобы уровень не был пустым */
  var got = 0;
  for(y=0;y<H;y++) for(x=0;x<W;x++) if(g[y][x] === "o") got++;
  for(i=0; got < 6 && i < 200; i++){
    x = irnd(rnd, 4, endCol-2);
    if(g[12][x] === "." && g[13][x] === "#"){ g[12][x] = "o"; got++; }
  }

  /* страховка: всё, что стоит на земле, должно стоять на твёрдом */
  for(x=0;x<W;x++)
    if("@Ex^JKo".indexOf(g[12][x]) >= 0 && g[13][x] !== "#"){ g[13][x] = "#"; g[14][x] = "#"; }

  return { name:name, hint:pickOf(rnd, GEN_HINTS),
           rows: g.map(function(r){ return r.join(""); }), movers:movers };
}

function genLevels(seed){
  var rnd = mulberry(hashSeed(seed));
  var names = GEN_NAMES.slice(), out = [], i, n;
  var keyLevel = irnd(rnd, 2, 5);
  for(i=0;i<7;i++){
    n = names.length ? names.splice(Math.floor(rnd()*names.length), 1)[0] : "Этаж " + (i+1);
    out.push(genLevel(rnd, i, n, i === keyLevel));
  }
  return out;
}

var modOn = {};
function mod(k){ return !!modOn[k]; }
function modMult(){
  var sum = 0;
  for(var i=0;i<MODS.length;i++) if(modOn[MODS[i].k]) sum += MODS[i].m;
  return Math.max(0.1, 1 + sum/100);
}
function modCount(){ var n = 0, i; for(i=0;i<MODS.length;i++) if(modOn[MODS[i].k]) n++; return n; }
function modSave(){
  var on = [];
  for(var i=0;i<MODS.length;i++) if(modOn[MODS[i].k]) on.push(MODS[i].k);
  try{ localStorage.setItem("peremena_mods", on.join(",")); }catch(e){}
}
function modLoad(){
  var raw = "";
  try{ raw = localStorage.getItem("peremena_mods") || ""; }catch(e){}
  raw.split(",").forEach(function(k){ if(k) modOn[k] = true; });
}
function runMax(){ return RUN_MAX * (mod("sneak") ? 1.18 : 1); }
function jumpV(){ return JUMP_V * (mod("heavy") ? 0.92 : 1) * (mod("sneak") ? 1.06 : 1); }
function timeLimit(){
  var t = curDiff.time;
  if(mod("rush")) t *= 0.67;
  if(mod("long")) t *= 1.5;
  return Math.round(t);
}
function oneLife(){ return curDiff.oneLife || mod("onelife"); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

/* ================== ЗВУК ================== */
var AC = null, muted = false;
function actx(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, dur, type, vol, slide, delay){
  if(muted) return;
  var c = actx(); if(!c) return;
  var t0 = c.currentTime + (delay||0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(f, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(50, f+slide), t0+dur);
  g.gain.setValueAtTime(vol||0.07, t0);
  g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}

function setKey(k, down){
  if(k === "jump"){
    if(down && !input.jump && G && G.player) G.player.jumpBuf = 8;
    input.jump = down;
    if(down) uiAction();
  } else input[k] = down;

function uiAction(){
  actx();
  if(G.state === "mods"){ return; }
  if(G.state === "menu"){ startRun(G.pick); }
  else if(G.state === "win" || G.state === "over"){ startRun(curDiff.key); }
  else if(G.state === "paused"){ G.state = "play"; }
}

function doButton(id){
  actx();
  G.hotBtn = id; G.hotT = 9;
  if(id === "mode_normal"){ G.pick = "normal"; startRun("normal"); }
  else if(id === "mode_hard"){ G.pick = "hard"; startRun("hard"); }
  else if(id === "again"){ startRun(curDiff.key); }
  else if(id === "menu"){ toMenu(); }
  else if(id === "resume"){ G.state = "play"; }
  else if(id === "restart"){ startRun(curDiff.key); }
  else if(id === "pause"){ G.state = (G.state === "play") ? "paused" : (G.state === "paused" ? "play" : G.state); }
  else if(id === "sound"){ muted = !muted; if(!muted) sfx.coin(); }
  else if(id === "mods_open"){ G.state = "mods"; }
  else if(id === "mods_back"){ G.state = "menu"; }
  else if(id === "mods_clear"){ modOn = {}; modSave(); applySource(); }
  else if(id.indexOf("mod_") === 0){
    var mk = id.slice(4);
    modOn[mk] = !modOn[mk];
    if(!modOn[mk]) delete modOn[mk];
    modSave(); applySource();
    tone(modOn[mk] ? 700 : 400, 0.08, "square", 0.05, modOn[mk] ? 200 : -150);
  }
  else if(id === "src_classic"){ curSrc = "classic"; applySource(); }
  else if(id === "src_seed"){ curSrc = "seed"; applySource(); }
  else if(id === "seed_new"){ curSeed = randomSeed(); curSrc = "seed"; applySource(); sfx.key(); }
}
function canvasPoint(ev){
  var r = cv.getBoundingClientRect();
  return { x:(ev.clientX - r.left) * VW / r.width, y:(ev.clientY - r.top) * VH / r.height };
}
document.addEventListener("keydown", function(e){
  var c = e.code;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].indexOf(c) >= 0) e.preventDefault();
  if(e.repeat) return;
  if(G.state === "menu" && (c==="ArrowLeft"||c==="KeyA"||c==="ArrowRight"||c==="KeyD")){
    G.pick = (c==="ArrowLeft"||c==="KeyA") ? "normal" : "hard"; return;
  }
  if(c==="Digit1") { G.pick = "normal"; if(G.state==="menu") startRun("normal"); return; }
  if(c==="Digit2") { G.pick = "hard"; if(G.state==="menu") startRun("hard"); return; }
  if(c==="ArrowLeft"||c==="KeyA") setKey("left",true);
  else if(c==="ArrowRight"||c==="KeyD") setKey("right",true);
  else if(c==="Space"||c==="ArrowUp"||c==="KeyW"||c==="KeyZ") setKey("jump",true);
  else if(c==="Enter") uiAction();
  else if(c==="KeyR"){ actx(); if(G.state==="play") killPlayer(true); else startRun(curDiff.key); }
  else if(c==="KeyP"||c==="Escape"){
    if(G.state==="play") G.state="paused";
    else if(G.state==="paused") G.state="play";
    else if(G.state==="mods") G.state="menu";
  }
  else if(c==="KeyO" && (G.state==="menu"||G.state==="mods")) G.state = (G.state==="mods") ? "menu" : "mods";
  else if(c==="KeyM"){ muted = !muted; }
});
document.addEventListener("keyup", function(e){
  var c = e.code;
  if(c==="ArrowLeft"||c==="KeyA") setKey("left",false);
  else if(c==="ArrowRight"||c==="KeyD") setKey("right",false);
  else if(c==="Space"||c==="ArrowUp"||c==="KeyW"||c==="KeyZ") setKey("jump",false);
});
(function touchSetup(){
  isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if(!isTouch) return;
  document.body.classList.add("touch");
  var btns = document.querySelectorAll(".btn");
  Array.prototype.forEach.call(btns, function(b){
    var k = b.getAttribute("data-k");
    b.addEventListener("pointerdown", function(e){
      e.preventDefault();
      b.setPointerCapture(e.pointerId);   // палец может съехать — кнопка не залипнет
      b.classList.add("on"); setKey(k, true);
    });
    function off(e){ b.classList.remove("on"); setKey(k, false); }
    b.addEventListener("pointerup", off);
    b.addEventListener("pointercancel", off);
    b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  });
})();
cv.addEventListener("pointerdown", function(ev){
  actx();
  var pt = canvasPoint(ev), i, b;
  for(i = G.buttons.length-1; i >= 0; i--){
    b = G.buttons[i];
    if(pt.x >= b.x && pt.x <= b.x+b.w && pt.y >= b.y && pt.y <= b.y+b.h){
      ev.preventDefault(); doButton(b.id); return;
    }
  }
  if(G.state !== "play" && G.state !== "mods") uiAction();
});
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });

/* ================== ЗАГРУЗКА УРОВНЯ ================== */
function isSolidChar(ch){ return SOLID.indexOf(ch) >= 0; }

function buildLevel(def){
  var w = 0, i, j;
  for(i=0;i<def.rows.length;i++) w = Math.max(w, def.rows[i].length);
  var grid = [];
  for(i=0;i<def.rows.length;i++){
    var row = def.rows[i];
    while(row.length < w) row += ".";
    grid.push(row.split(""));
  }
  var lv = { name:def.name, hint:(isTouch && def.hintTouch) ? def.hintTouch : def.hint, w:w, h:grid.length, grid:grid,
             coins:[], enemies:[], pads:[], spikes:[], movers:[], door:null,
             key:null, needKey:false, start:{x:64,y:64}, coinTotal:0 };

  for(i=0;i<lv.h;i++) for(j=0;j<w;j++){
    var ch = grid[i][j], px = j*TS, py = i*TS;
    if(ch === "o"){ lv.coins.push({x:px+8, y:py+8, w:16, h:16, got:false, ph:rnd(0,6.28)}); grid[i][j]="."; }
    else if(ch === "@"){ lv.start = {x:px+6, y:py+4}; grid[i][j]="."; }
    else if(ch === "E"){
      lv.door = { x:px+3, y:py-14, w:26, h:46, cx:px+16 };
      lv.doorHit = { x:px+1, y:py-96, w:30, h:128 };   // засчитываем и в прыжке над дверью
      grid[i][j]=".";
    }
    else if(ch === "K"){ lv.key = {x:px+8, y:py+10, w:16, h:14, got:false, ph:0}; lv.needKey=true; grid[i][j]="."; }
    else if(ch === "J"){ lv.pads.push({x:px+2, y:py+18, w:28, h:14, t:0}); grid[i][j]="."; }
    else if(ch === "x"){ if(!mod("empty")) lv.enemies.push(makeEnemy(px+3, py+4, false)); grid[i][j]="."; }
    else if(ch === "v"){ if(!mod("empty")) lv.enemies.push(makeEnemy(px+2, py+6, true)); grid[i][j]="."; }
    else if(ch === "^"){ lv.spikes.push({x:px+2, y:py+18, w:28, h:14}); }
  }
  lv.coinTotal = lv.coins.length;

  /* «Толпа на перемене»: досыпаем завучей на свободные куски земли */
  if(mod("crowd") && !mod("empty")){
    var crnd = mulberry(hashSeed(def.name + "crowd")), extra = 2 + Math.round(lv.enemies.length * 0.6), tries = 0;
    var occupied = function(cx, cy){
      var k, e;
      for(k=0;k<lv.enemies.length;k++){ e = lv.enemies[k]; if(Math.abs(e.x - cx*TS) < TS*3 && Math.abs(e.y - cy*TS) < TS*2) return true; }
      for(k=0;k<lv.spikes.length;k++) if(Math.abs(lv.spikes[k].x - cx*TS) < TS*2) return true;
      if(lv.door && Math.abs(lv.door.cx - cx*TS) < TS*3) return true;
      return Math.abs(lv.start.x - cx*TS) < TS*4;
    };
    while(extra > 0 && tries++ < 400){
      var cx = 4 + Math.floor(crnd()*(w-8)), cy = 0;
      for(cy=1; cy<lv.h-1; cy++){
        if(!isSolidChar(grid[cy][cx]) || grid[cy][cx] === "=") continue;
        if(isSolidChar(grid[cy-1][cx]) || isSolidChar(grid[cy-2] ? grid[cy-2][cx] : ".")) continue;
        if(occupied(cx, cy-1)) continue;
        lv.enemies.push(makeEnemy(cx*TS+3, (cy-1)*TS+4, false));
        extra--;
        break;
      }
    }
  }

  var ms = def.movers || [];
  for(i=0;i<ms.length;i++){
    var m = ms[i];
    lv.movers.push({ ox:m.tx*TS, oy:m.ty*TS, x:m.tx*TS, y:m.ty*TS,
      w:m.tw*TS, h:14, axis:m.axis, dist:m.dist*TS, speed:m.speed,
      t:m.phase||0, dx:0, dy:0, isMover:true });
  }
  return lv;
}

function makeEnemy(x, y, fly){
  return { x:x, y:y, w:fly?28:26, h:fly?18:28,
           vx: (fly ? 1.5*curDiff.fly : 0.85*curDiff.enemy) * (mod("fast") ? 1.4 : 1), vy:0,
           fly:fly, homeX:x, range: fly?999999:TS*curDiff.range, dead:false, deadT:0,
           dir:1, anim:0, hitWall:false };
}

/* ================== КОЛЛИЗИИ ================== */
function tileChar(cx, cy){
  var lv = G.level;
  if(cx < 0 || cx >= lv.w) return "#";           // невидимые стены по краям уровня
  if(cy < 0 || cy >= lv.h) return ".";           // сверху небо, снизу пропасть
  return lv.grid[cy][cx];
}
function solidAt(cx, cy){ return isSolidChar(tileChar(cx, cy)); }
function solidAtPx(px, py){ return solidAt(Math.floor(px/TS), Math.floor(py/TS)); }

function collideTiles(e, axis){
  var x0 = Math.floor(e.x/TS), x1 = Math.floor((e.x+e.w-0.01)/TS);
  var y0 = Math.floor(e.y/TS), y1 = Math.floor((e.y+e.h-0.01)/TS);
  var cx, cy, hit = false;
  for(cy=y0; cy<=y1; cy++) for(cx=x0; cx<=x1; cx++){
    var ch = tileChar(cx,cy);
    if(!isSolidChar(ch)) continue;
    if(ch === "="){                              // доска: стоим сверху, снизу пролетаем насквозь
      if(axis === "x" || e.vy <= 0) continue;
      if(e.y + e.h - e.vy > cy*TS + 4) continue;
    }
    hit = true;
    if(axis === "x"){
      if(e.vx > 0) e.x = Math.min(e.x, cx*TS - e.w);
      else if(e.vx < 0) e.x = Math.max(e.x, (cx+1)*TS);
    } else {
      if(e.vy > 0){ e.y = Math.min(e.y, cy*TS - e.h); e.grounded = true; }
      else if(e.vy < 0) e.y = Math.max(e.y, (cy+1)*TS);
    }
  }
  if(hit){ if(axis === "x"){ e.vx = 0; e.hitWall = true; } else e.vy = 0; }
}

function collideMovers(e, axis){
  var ms = G.level.movers, i, m;
  for(i=0;i<ms.length;i++){
    m = ms[i];
    if(!overlap(e, m)) continue;
    if(axis === "x"){
      if(e.vx > 0) e.x = Math.min(e.x, m.x - e.w);
      else if(e.vx < 0) e.x = Math.max(e.x, m.x + m.w);
      e.vx = 0; e.hitWall = true;
    } else {
      if(e.vy > 0){ e.y = Math.min(e.y, m.y - e.h); e.grounded = true; e.standing = m; }
      else if(e.vy < 0) e.y = Math.max(e.y, m.y + m.h);
      e.vy = 0;
    }
  }
}

/* ================== ЧАСТИЦЫ ================== */
function puff(x, y, n, col, spd){
  for(var i=0;i<n;i++)
    G.parts.push({ x:x, y:y, vx:rnd(-spd,spd), vy:rnd(-spd,spd*0.4),
                   life:rnd(18,38), max:38, col:col, s:rnd(2,5), g:0.14 });
}

/* ================== ИГРОВОЙ ЦИКЛ / СОСТОЯНИЕ ================== */
function newGame(){
  return { state:"menu", levelIndex:0, level:null, player:null,
           coins:0, coinsMax:0, deaths:0, timeLeft:timeLimit(),
           parts:[], shake:0, flash:0, banner:0, hintT:0, cam:0,
           hasKey:false, tick:0, penalty:0, buttons:[], pick:"normal" };
}
function recKey(dk){ return dk + (curSrc === "seed" ? "_" + curSeed : ""); }
function syncSeedUrl(){
  try{
    localStorage.setItem("peremena_seed", curSeed);
    localStorage.setItem("peremena_src", curSrc);
  }catch(e){}
  try{ location.hash = (curSrc === "seed") ? ("s=" + curSeed) : "classic"; }catch(e){}
}
function applySource(){                 // пересобрать набор уровней под текущий выбор
  LEVELS = (curSrc === "seed") ? genLevels(curSeed) : CAMPAIGN;
  syncSeedUrl();
  if(G && G.state === "menu"){
    G.level = buildLevel(LEVELS[0]);
    G.coinsMax = 0;
    for(var i=0;i<LEVELS.length;i++) G.coinsMax += buildLevel(LEVELS[i]).coinTotal;
    G.cam = 0;
  }
}
function setSeed(sd, src){
  sd = cleanSeed(sd);
  if(!sd) return;
  curSeed = sd;
  curSrc = src || "seed";
  applySource();
}
window.addEventListener("hashchange", function(){
  var h = "";
  try{ h = (location.hash || "").replace(/^#/, ""); }catch(e){ return; }
  if(/^s=/i.test(h)){
    var sd = cleanSeed(h.slice(2));
    if(sd && (sd !== curSeed || curSrc !== "seed")) setSeed(sd, "seed");
  } else if(/^classic$/i.test(h) && curSrc !== "classic"){
    curSrc = "classic"; applySource();
  }
});
function startRun(mode, src){
  var st = G ? G.state : "menu";
  curDiff = DIFFS[mode] || DIFFS[(G && G.pick) || "normal"];
  if(src) curSrc = src;
  LEVELS = (curSrc === "seed") ? genLevels(curSeed) : CAMPAIGN;
  syncSeedUrl();
  var pick = curDiff.key;
  G = newGame();
  G.pick = pick;
  try{ localStorage.setItem("peremena_mode", pick); }catch(e){}
  G.state = "play";
  G.coinsMax = 0;
  for(var i=0;i<LEVELS.length;i++) G.coinsMax += buildLevel(LEVELS[i]).coinTotal;
  loadLevel(0);
  if(st === "menu") sfx.door();
}
function loadLevel(i){
  G.levelIndex = i;
  G.level = buildLevel(LEVELS[i]);
  G.hasKey = false;
  G.hintT = 240;
  G.banner = 0;
  G.parts = [];
  spawnPlayer();
}
function spawnPlayer(){
  var s = G.level.start;
  G.player = { x:s.x, y:s.y, w:20, h:28, vx:0, vy:0, dir:1, grounded:false,
               coyote:0, jumpBuf:0, anim:0, sqx:1, sqy:1, dead:false, deadT:0,
               standing:null, hitWall:false, spawnT:18, jumping:false };
  G.cam = camTarget();
}
function camTarget(){
  var lv = G.level, p = G.player;
  var max = Math.max(0, lv.w*TS - VW);
  return clamp(p.x + p.w/2 - VW/2, 0, max);
}

function goOver(reason){
  G.state = "over"; G.overReason = reason;
}
function killPlayer(silent){
  var p = G.player;
  if(p.dead) return;
  p.dead = true; p.deadT = 0; p.vy = -7; p.vx = 0;
  if(!silent){
    G.deaths++;                      // рестарт по R не считается падением
    if(curDiff.deathCost){ G.timeLeft = Math.max(0, G.timeLeft - curDiff.deathCost); G.penalty = 75; }
  }
  G.shake = 14;
  puff(p.x+p.w/2, p.y+p.h/2, 22, "#ff6b6b", 4.5);
  if(!silent) sfx.hurt();
}

function updatePlayer(dt){
  var p = G.player, lv = G.level, i;

  if(p.dead){
    p.deadT++;
    p.vy = Math.min(p.vy + GRAV, MAXFALL);
    p.y += p.vy;
    if(p.deadT > 46){
      if(oneLife()){ goOver("dead"); sfx.fail(); }
      else spawnPlayer();
    }
    return;
  }
  if(p.spawnT > 0) p.spawnT--;

  /* едем на платформе */
  if(p.standing && p.standing.isMover){
    p.x += p.standing.dx;
    p.y += p.standing.dy;
  }
  p.standing = null;
  p.grounded = false;
  p.hitWall = false;

  var ix = (input.right?1:0) - (input.left?1:0);
  var slip = mod("ice");
  var acc = slip ? 0.42 : 0.85;
  if(ix){ p.vx += acc*ix; p.dir = ix; }
  else { p.vx *= p.grounded && slip ? 0.975 : 0.80; if(Math.abs(p.vx) < 0.06) p.vx = 0; }
  p.vx = clamp(p.vx, -runMax(), runMax());

  p.vy = Math.min(p.vy + GRAV, MAXFALL);
  if(p.coyote > 0) p.coyote--;
  if(p.jumpBuf > 0) p.jumpBuf--;

  if(p.jumpBuf > 0 && p.coyote > 0){
    p.vy = jumpV(); p.jumpBuf = 0; p.coyote = 0; p.jumping = true;
    p.sqx = 0.78; p.sqy = 1.28;
    puff(p.x+p.w/2, p.y+p.h, 6, "#ffffff", 1.8);
    sfx.jump();
  }
  if(p.jumping && !input.jump && p.vy < -4.2){ p.vy = -4.2; p.jumping = false; }  // короткий прыжок

  /* движение + столкновения */
  p.x += p.vx; collideTiles(p,"x"); collideMovers(p,"x");
  var wasAir = !p.grounded;
  p.y += p.vy; collideTiles(p,"y"); collideMovers(p,"y");

  if(p.grounded){
    p.jumping = false;
    p.coyote = curDiff.coyote;
    if(p.sqy > 1){ p.sqx = 1.22; p.sqy = 0.8; puff(p.x+p.w/2, p.y+p.h, 5, "#ffffff", 1.6); }
  }
  p.sqx += (1 - p.sqx) * 0.18;
  p.sqy += (1 - p.sqy) * 0.18;
  p.anim += Math.abs(p.vx) * 0.22;

  /* батуты */
  for(i=0;i<lv.pads.length;i++){
    var pad = lv.pads[i];
    if(pad.t > 0) pad.t--;
    if(p.vy >= 0 && overlap(p, pad) && p.y + p.h <= pad.y + 14){
      p.y = pad.y - p.h; p.vy = PAD_V; p.coyote = 0; p.jumping = false; pad.t = 14;
      p.sqx = 0.7; p.sqy = 1.4;
      puff(pad.x+pad.w/2, pad.y, 10, "#7ef7c0", 3);
      sfx.pad();
    }
  }

  /* шипы */
  var body = { x:p.x+3, y:p.y+4, w:p.w-6, h:p.h-4 };
  for(i=0;i<lv.spikes.length;i++) if(overlap(body, lv.spikes[i])){ killPlayer(); return; }

  /* падение в пропасть */
  if(p.y > lv.h*TS + 40){ killPlayer(); return; }

  /* пирожки */
  for(i=0;i<lv.coins.length;i++){
    var c = lv.coins[i];
    if(c.got) continue;
    c.ph += 0.09;
    if(overlap(p, c)){
      c.got = true; G.coins++;
      puff(c.x+8, c.y+8, 10, "#ffd166", 2.6);
      sfx.coin();
    }
  }
  /* ключ */
  if(lv.key && !lv.key.got){
    lv.key.ph += 0.08;
    if(overlap(p, lv.key)){
      lv.key.got = true; G.hasKey = true; G.flash = 12;
      puff(lv.key.x+8, lv.key.y+7, 16, "#ffe066", 3);
      sfx.key();
    }
  }
  /* враги */
  for(i=0;i<lv.enemies.length;i++){
    var en = lv.enemies[i];
    if(en.dead) continue;
    if(!overlap(body, en)) continue;
    if(!en.fly && !mod("nostomp") && p.vy > 1.2 && (p.y + p.h) - en.y < 18){
      en.dead = true; en.deadT = 0;
      p.vy = -8.4; p.sqx = 1.2; p.sqy = 0.82;
      G.shake = 6;
      puff(en.x+en.w/2, en.y+en.h/2, 14, "#c8d6e5", 3);
      sfx.stomp();
    } else { killPlayer(); return; }
  }
  /* дверь */
  if(lv.doorHit && overlap(p, lv.doorHit) && doorOpen()){
    nextLevel();
  }
}

function coinsLeft(){
  var lv = G.level, n = 0, i;
  for(i=0;i<lv.coins.length;i++) if(!lv.coins[i].got) n++;
  return n;
}
function doorOpen(){
  if(G.level.needKey && !G.hasKey) return false;
  if(mod("hungry") && coinsLeft() > 0) return false;
  return true;
}
function updateEnemies(){
  var lv = G.level, i;
  for(i=0;i<lv.enemies.length;i++){
    var e = lv.enemies[i];
    if(e.dead){ e.deadT++; continue; }
    e.hitWall = false;
    e.anim += Math.abs(e.vx) * 0.2;
    e.dir = e.vx > 0 ? 1 : -1;

    e.x += e.vx; collideTiles(e,"x"); collideMovers(e,"x");
    if(!e.fly){
      e.vy = Math.min(e.vy + GRAV, MAXFALL);
      e.grounded = false;
      e.y += e.vy; collideTiles(e,"y"); collideMovers(e,"y");
      var aheadX = e.dir > 0 ? e.x + e.w + 3 : e.x - 3;
      var noFloor = !solidAtPx(aheadX, e.y + e.h + 4);
      if(e.hitWall || noFloor || Math.abs(e.x - e.homeX) > e.range){
        e.vx = -e.vx;
        e.x += e.vx * 1.5;
      }
      if(e.y > lv.h*TS + 60) e.dead = true;
    } else {
      if(e.hitWall || Math.abs(e.x - e.homeX) > TS*7) { e.vx = -e.vx; e.x += e.vx*1.5; }
      e.y += Math.sin((G.tick + i*40) * 0.06) * 0.5;
    }
  }
}

function updateMovers(){
  var ms = G.level.movers, i;
  for(i=0;i<ms.length;i++){
    var m = ms[i];
    m.t += m.speed;
    var ph = (Math.sin(m.t) + 1) / 2;
    var nx = m.ox + (m.axis === "x" ? m.dist*ph : 0);
    var ny = m.oy + (m.axis === "y" ? m.dist*ph : 0);
    m.dx = nx - m.x; m.dy = ny - m.y;
    m.x = nx; m.y = ny;
  }
}

function updateParts(){
  for(var i=G.parts.length-1;i>=0;i--){
    var q = G.parts[i];
    q.x += q.vx; q.y += q.vy; q.vy += q.g; q.vx *= 0.98; q.life--;
    if(q.life <= 0) G.parts.splice(i,1);
  }
}

function nextLevel(){
  sfx.door();
  G.banner = 70;
  G.state = "clear";
}
function runPoints(){
  var done = (G.state === "win") ? LEVELS.length : G.levelIndex;
  return Math.max(0, done*100 + G.coins*10 + Math.floor(G.timeLeft)*2 - G.deaths*20);
}
function runScore(){ return Math.round(runPoints() * modMult()); }
function finishRun(){
  G.state = "win";
  sfx.win();
  var used = curDiff.time - G.timeLeft;
  var best = bestScore(recKey(curDiff.key));
  var sc = runScore();
  if(!best || sc > (best.score || 0)){
    G.record = true;
    try{ localStorage.setItem("peremena_best_" + recKey(curDiff.key),
      JSON.stringify({ time:used, coins:G.coins, deaths:G.deaths, score:sc })); }catch(e){}
  }
  G.best = best;
}
function bestScore(key){
  try{ return JSON.parse(localStorage.getItem("peremena_best_" + key) || "null"); }catch(e){ return null; }
}

function update(dtSec){
  G.tick++;
  if(G.shake > 0) G.shake *= 0.88;
  if(G.flash > 0) G.flash--;
  if(G.hintT > 0) G.hintT--;
  if(G.hotT > 0) G.hotT--;
  if(G.penalty > 0) G.penalty--;

  if(G.state === "play"){
    G.timeLeft -= dtSec;
    if(G.timeLeft <= 0){
      G.timeLeft = 0; goOver("bell"); sfx.bell(); G.shake = 20;
    }
    updateMovers();
    updatePlayer(dtSec);
    updateEnemies();
    updateParts();
    G.cam += (camTarget() - G.cam) * 0.14;
  } else if(G.state === "clear"){
    updateMovers(); updateEnemies(); updateParts();
    G.banner--;
    if(G.banner <= 0){
      if(G.levelIndex + 1 >= LEVELS.length){ finishRun(); }
      else { loadLevel(G.levelIndex + 1); G.state = "play"; }
    }
  } else {
    updateParts();
  }
}

/* ================== ОТРИСОВКА ================== */
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function text(str, x, y, size, col, align, weight){
  ctx.font = (weight||700) + " " + size + "px 'Segoe UI', system-ui, Arial, sans-serif";
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = col;
  ctx.fillText(str, x, y);
}
function shadowText(str, x, y, size, col, align){
  text(str, x+2, y+2, size, "rgba(0,0,0,.45)", align);
  text(str, x, y, size, col, align);
}

function drawBackground(cam){
  var g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, "#3d7ec4");
  g.addColorStop(0.45, "#7cc0ea");
  g.addColorStop(1, "#cfeaf7");
  ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);

  /* солнце */
  ctx.save();
  ctx.globalAlpha = 0.85;
  var sx = 690 - cam*0.05, sy = 78;
  var sg = ctx.createRadialGradient(sx,sy,10,sx,sy,90);
  sg.addColorStop(0,"rgba(255,246,190,.95)");
  sg.addColorStop(1,"rgba(255,246,190,0)");
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx,sy,90,0,6.2832); ctx.fill();
  ctx.fillStyle = "#fff4bd"; ctx.beginPath(); ctx.arc(sx,sy,26,0,6.2832); ctx.fill();
  ctx.restore();

  /* облака */
  var i, cx2, cy2;
  ctx.fillStyle = "rgba(255,255,255,.75)";
  for(i=0;i<7;i++){
    cx2 = ((i*260 + G.tick*0.25 - cam*0.15) % 1300) - 150;
    cy2 = 50 + (i%3)*46;
    ctx.beginPath();
    ctx.arc(cx2,cy2,26,0,6.2832); ctx.arc(cx2+26,cy2+6,20,0,6.2832);
    ctx.arc(cx2-24,cy2+8,18,0,6.2832); ctx.arc(cx2+6,cy2-14,18,0,6.2832);
    ctx.fill();
  }

  /* школа вдалеке */
  ctx.save();
  ctx.translate(-cam*0.35, 0);
  ctx.fillStyle = "#5f7fa8";
  for(i=0;i<5;i++){
    var bx = i*380 - 60, bw = 250, bh = 190;
    ctx.fillRect(bx, VH-150-bh, bw, bh);
    ctx.fillStyle = "#4e6b91";
    ctx.fillRect(bx-14, VH-150-bh-18, bw+28, 22);
    ctx.fillStyle = "rgba(255,240,180,.55)";
    for(var wy=0; wy<4; wy++) for(var wx=0; wx<5; wx++)
      ctx.fillRect(bx+22+wx*44, VH-150-bh+26+wy*42, 26, 26);
    ctx.fillStyle = "#5f7fa8";
  }
  ctx.restore();

  ctx.fillStyle = "rgba(210,236,247,.5)";
  ctx.fillRect(0, VH-150, VW, 150);

  /* деревья */
  ctx.save();
  ctx.translate(-cam*0.6, 0);
  for(i=0;i<14;i++){
    var tx = i*170 + 40, ty = VH-120;
    ctx.fillStyle = "#6b4a2f"; ctx.fillRect(tx-6, ty, 12, 70);
    ctx.fillStyle = i%2 ? "#3f9b5a" : "#358a4f";
    ctx.beginPath(); ctx.arc(tx, ty-6, 34, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(tx-26, ty+10, 24, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(tx+26, ty+10, 24, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

function drawTiles(cam){
  var lv = G.level;
  var c0 = Math.max(0, Math.floor(cam/TS)-1), c1 = Math.min(lv.w-1, Math.ceil((cam+VW)/TS));
  for(var cy=0; cy<lv.h; cy++) for(var cx=c0; cx<=c1; cx++){
    var ch = lv.grid[cy][cx];
    if(!isSolidChar(ch)) continue;
    var x = cx*TS, y = cy*TS;
    var openTop = !(cy>0 && isSolidChar(lv.grid[cy-1][cx]));
    if(ch === "#"){
      ctx.fillStyle = "#8a5a35"; ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle = "rgba(0,0,0,.12)";
      ctx.fillRect(x, y+TS-6, TS, 6);
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.fillRect(x+3, y+3, TS-6, 4);
      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 1;
      ctx.strokeRect(x+0.5, y+0.5, TS-1, TS-1);
      if(openTop){
        ctx.fillStyle = "#4fb05e"; ctx.fillRect(x, y, TS, 9);
        ctx.fillStyle = "#63c972"; ctx.fillRect(x, y, TS, 4);
        ctx.fillStyle = "#4fb05e";
        ctx.fillRect(x+4, y-4, 4, 5); ctx.fillRect(x+15, y-6, 4, 7); ctx.fillRect(x+25, y-3, 4, 4);
      }
    } else {
      ctx.fillStyle = "#c08b4a"; ctx.fillRect(x, y, TS, 14);
      ctx.fillStyle = "#e0a95f"; ctx.fillRect(x, y, TS, 5);
      ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(x, y+11, TS, 3);
    }
  }
}

function drawMovers(){

    ctx.fillStyle = "#f0c27f"; rrect(m.x, m.y, m.w, 5, 4); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.5)";

function drawSpikes(){
  var sp = G.level.spikes;
  for(var i=0;i<sp.length;i++){

    ctx.fillStyle = "#9aa7b4";
    for(var k=0;k<3;k++){

function drawPads(){

function drawCoins(){
  var cs = G.level.coins;
  for(var i=0;i<cs.length;i++){
    var c = cs[i];
    if(c.got) continue;
    var by = Math.sin(c.ph + G.tick*0.05) * 3;

    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle = "rgba(0,0,0,.15)";
    ctx.beginPath(); ctx.ellipse(1, 12, 9, 3, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#e8a33d";
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 8, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#f7c66b";
    ctx.beginPath(); ctx.ellipse(-1, -2, 9, 6, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#c98727"; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for(var k=-1;k<=1;k++){ ctx.moveTo(k*5-2, -1); ctx.lineTo(k*5+1, 3); }

function drawKey(){

function drawDoor(){
  var d = G.level.door;

  ctx.save();
  if(open){ ctx.shadowColor = "rgba(120,255,180,.85)"; ctx.shadowBlur = 16 + Math.sin(G.tick*0.09)*7; }
  ctx.fillStyle = "#5a3f28"; rrect(d.x-4, d.y-4, d.w+8, d.h+4, 6); ctx.fill();

function drawEnemy(e){
  if(e.dead && e.deadT > 26) return;
  ctx.save();
  ctx.translate(e.x + e.w/2, e.y + e.h/2);
  if(e.dead){ ctx.globalAlpha = Math.max(0, 1 - e.deadT/26); ctx.scale(1, 0.35); }
  if(e.fly){
    ctx.scale(e.dir, 1);
    ctx.fillStyle = "rgba(0,0,0,.12)";
    ctx.beginPath(); ctx.ellipse(0, 16, 12, 3, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#f3f6fb";
    ctx.beginPath(); ctx.moveTo(-14,-7); ctx.lineTo(14,0); ctx.lineTo(-14,7); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c9d5e5";
    ctx.beginPath(); ctx.moveTo(-14,7); ctx.lineTo(14,0); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#2b3b4e";
    ctx.beginPath(); ctx.arc(6,-1.5,1.6,0,6.2832); ctx.fill();
  } else {
    var wob = Math.sin(e.anim)*1.5, hy = -12 + wob*0.3;
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.beginPath(); ctx.ellipse(0, e.h/2-1, 12, 3.5, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#2b3850"; /* брюки */
    ctx.fillRect(-8, 6, 6, 9); ctx.fillRect(2, 6, 6, 9);
    ctx.fillStyle = "#1d2635";
    ctx.fillRect(-9, 13, 8, 3); ctx.fillRect(1, 13, 8, 3);
    ctx.fillStyle = "#56688c"; /* пиджак */
    rrect(-10, -5+wob*0.2, 20, 14, 5); ctx.fill();
    ctx.fillStyle = "#e9eef7"; /* рубашка */
    ctx.beginPath(); ctx.moveTo(-3,-5); ctx.lineTo(3,-5); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#d1443f"; /* галстук */
    ctx.beginPath(); ctx.moveTo(-1.6,-3); ctx.lineTo(1.6,-3); ctx.lineTo(0.8,5); ctx.lineTo(-0.8,5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f3cfa8"; /* голова */
    ctx.beginPath(); ctx.arc(0, hy, 9, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#8b7a63"; /* залысина */
    ctx.beginPath(); ctx.arc(0, hy-1.5, 9, Math.PI*1.08, Math.PI*1.92); ctx.fill();
    ctx.fillStyle = "#ffffff"; /* очки */
    ctx.beginPath(); ctx.arc(-3.6, hy+1, 3.2, 0, 6.2832); ctx.arc(3.6, hy+1, 3.2, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#39445c"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(-3.6, hy+1, 3.2, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.arc(3.6, hy+1, 3.2, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.4, hy+1); ctx.lineTo(0.4, hy+1); ctx.stroke();
    ctx.fillStyle = "#39445c";
    ctx.beginPath(); ctx.arc(-3.6+e.dir*1.2, hy+1, 1.4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(3.6+e.dir*1.2, hy+1, 1.4, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#a9724f"; ctx.lineWidth = 1.5; /* хмурый рот */
    ctx.beginPath(); ctx.arc(0, hy+9, 3.4, Math.PI+0.3, -0.3); ctx.stroke();
    ctx.fillStyle = "#e8eef7"; /* папка */
    ctx.save(); ctx.translate(e.dir*12, 1); ctx.rotate(e.dir*0.25);
    ctx.fillRect(-4, -7, 9, 13); ctx.fillStyle = "#b9c6d8"; ctx.fillRect(-4, -7, 9, 3);
    ctx.fillStyle = "#9fb0c6"; ctx.fillRect(-2.5, -2, 6, 1.2); ctx.fillRect(-2.5, 1, 6, 1.2);
    ctx.restore();
  }
  ctx.restore();
}

function drawPlayer(){
  var p = G.player;
  var blink = p.dead ? 1 : (p.spawnT > 0 && (G.tick%6<3) ? 0.45 : 1);
  drawCharacter(p, "#3aa0e8", blink);
}
function drawCharacter(p, shirt, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(p.x + p.w/2, p.y + p.h);
  ctx.scale(p.sqx, p.sqy);
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(0, 1, 11, 3.5, 0, 0, 6.2832); ctx.fill();

  var walk = p.grounded && Math.abs(p.vx) > 0.4 ? Math.sin(p.anim)*4 : 0;
  var air = !p.grounded;
  /* ноги */
  ctx.fillStyle = "#2f3e56";
  ctx.fillRect(-7, -9, 6, 9 + (air? -2 : 0) + walk*0.5);
  ctx.fillRect(1, -9, 6, 9 + (air? -2 : 0) - walk*0.5);
  ctx.fillStyle = "#e14b4b";
  ctx.fillRect(-8, -3 + (air?-2:0) + walk*0.5, 8, 4);
  ctx.fillRect(0, -3 + (air?-2:0) - walk*0.5, 8, 4);
  /* рюкзак */
  ctx.fillStyle = "#7a4ec4";
  rrect(-11*p.dir - (p.dir>0?0:0), -26, 8, 15, 3); ctx.fill();
  /* корпус */
  ctx.fillStyle = shirt;
  rrect(-9, -26, 18, 18, 5); ctx.fill();
  ctx.globalAlpha = alpha * 0.55;
  ctx.fillStyle = "#ffffff";
  rrect(-9, -26, 18, 6, 4); ctx.fill();
  ctx.globalAlpha = alpha;
  /* руки */
  ctx.fillStyle = "#f0c9a0";
  var armY = air ? -24 : -19 + walk*0.4;
  ctx.fillRect(-12, armY, 5, 8);
  ctx.fillRect(7, armY - (air?0:walk*0.8), 5, 8);
  /* голова */
  ctx.fillStyle = "#f6d3ac";
  ctx.beginPath(); ctx.arc(0, -33, 9, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#4a3524";
  ctx.beginPath(); ctx.arc(0, -35, 9, Math.PI*0.95, Math.PI*2.05); ctx.fill();
  ctx.fillRect(-9, -36, 18, 3);
  /* глаза */
  ctx.fillStyle = "#23303f";
  if(p.dead){
    ctx.lineWidth = 2; ctx.strokeStyle = "#23303f";
    ctx.beginPath();
    ctx.moveTo(-6,-35); ctx.lineTo(-1,-30); ctx.moveTo(-1,-35); ctx.lineTo(-6,-30);
    ctx.moveTo(2,-35); ctx.lineTo(7,-30); ctx.moveTo(7,-35); ctx.lineTo(2,-30);
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-3 + p.dir*2.5, -33, 1.8, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(3 + p.dir*2.5, -33, 1.8, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#c9765a"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(1 + p.dir*2, -29.5, 3.2, 0.2, Math.PI-0.2); ctx.stroke();
  }
  ctx.restore();
}

function drawParts(){
  for(var i=0;i<G.parts.length;i++){
    var q = G.parts[i];
    ctx.globalAlpha = Math.max(0, q.life/q.max);
    ctx.fillStyle = q.col;
    ctx.fillRect(q.x, q.y, q.s, q.s);
  }
  ctx.globalAlpha = 1;
}

/* ---- кнопки прямо на канвасе: работают и мышью, и пальцем ---- */
function uiButton(id, x, y, w, h, label, sub, o){
  o = o || {};
  var hot = (G.hotBtn === id && G.hotT > 0);
  var sel = !!o.sel;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,.28)";
  rrect(x+3, y+5, w, h, 16); ctx.fill();
  ctx.fillStyle = hot ? (o.hot || "rgba(255,255,255,.42)")
                      : (sel ? (o.selBg || "rgba(255,255,255,.26)") : (o.bg || "rgba(255,255,255,.13)"));
  rrect(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = sel ? (o.selBorder || "#8bffcf") : "rgba(255,255,255,.42)";
  ctx.lineWidth = sel ? 3 : 2;
  rrect(x, y, w, h, 16); ctx.stroke();
  ctx.restore();
  var fs = o.size || 22;
  text(label, x + w/2, y + h/2 + (sub ? -2 : fs*0.36), fs, o.col || "#ffffff", "center");
  if(sub) text(sub, x + w/2, y + h/2 + 22, 13, "rgba(226,238,255,.8)", "center", 600);
  G.buttons.push({ id:id, x:x, y:y, w:w, h:h });
}
function iconBtn(id, x, y, s, kind){
  var hot = (G.hotBtn === id && G.hotT > 0);
  ctx.save();
  ctx.fillStyle = hot ? "rgba(255,255,255,.4)" : "rgba(9,16,32,.55)";
  rrect(x, y, s, s, 13); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5;
  rrect(x, y, s, s, 13); ctx.stroke();
  ctx.translate(x + s/2, y + s/2);
  ctx.fillStyle = "#eaf6ff";
  if(kind === "pause"){
    if(G.state === "paused"){ ctx.beginPath(); ctx.moveTo(-5,-8); ctx.lineTo(9,0); ctx.lineTo(-5,8); ctx.closePath(); ctx.fill(); }
    else { ctx.fillRect(-7,-8,5,16); ctx.fillRect(2,-8,5,16); }
  } else {
    ctx.beginPath(); ctx.moveTo(-8,-4); ctx.lineTo(-3,-4); ctx.lineTo(3,-9); ctx.lineTo(3,9); ctx.lineTo(-3,4); ctx.lineTo(-8,4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#eaf6ff"; ctx.lineWidth = 2; ctx.lineCap = "round";
    if(muted){ ctx.beginPath(); ctx.moveTo(6,-5); ctx.lineTo(12,5); ctx.moveTo(12,-5); ctx.lineTo(6,5); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(4,0,7,-0.9,0.9); ctx.stroke(); }
  }
  ctx.restore();
  G.buttons.push({ id:id, x:x, y:y, w:s, h:s });
}

function drawHUD(){
  ctx.save();
  ctx.fillStyle = "rgba(9,16,32,.52)";
  rrect(10, 10, VW-20, 40, 12); ctx.fill();

  var low = G.timeLeft < (curDiff.key === "hard" ? 60 : 120);
  var col = low ? (G.tick%30 < 15 ? "#ff8080" : "#ffd0d0") : "#eaf6ff";
  drawBellIcon(36, 28, 0.85, col);
  text(fmtTime(G.timeLeft), 54, 37, 22, col);
  text("до конца перемены", 132, 36, 12, "rgba(220,235,255,.7)", "left", 600);
  if(G.penalty > 0){
    ctx.globalAlpha = Math.min(1, G.penalty/40);
    text("−" + curDiff.deathCost + " сек", 62, 70, 20, "#ff8a8a", "left");
    ctx.globalAlpha = 1;
  }

  text(LEVELS[G.levelIndex].name, VW/2, 31, 17, "#ffffff", "center");
  text("уровень " + (G.levelIndex+1) + " / " + LEVELS.length + " · " + curDiff.name +
       (curSrc === "seed" ? " · сид " + curSeed : "") + (modCount() ? " · ×" + modMult().toFixed(2) : ""),
       VW/2, 45, 11, curDiff.key === "hard" ? "rgba(255,190,190,.85)" : "rgba(220,235,255,.7)", "center", 600);

  drawPieIcon(VW-152, 28, 0.85);
  text(G.coins + " / " + G.coinsMax, VW-134, 34, 19, "#ffd98a");
  if(G.deaths > 0) text("падений: " + G.deaths, VW-24, 46, 11, "rgba(255,180,180,.8)", "right", 600);
  ctx.restore();

  if(G.state === "play" || G.state === "paused" || G.state === "clear"){
    var s = isTouch ? 54 : 44;
    iconBtn("pause", VW - s - 14, 58, s, "pause");
    iconBtn("sound", VW - s*2 - 24, 58, s, "sound");
  }

  if(G.hintT > 0 && G.state === "play"){
    ctx.save();
    ctx.globalAlpha = Math.min(1, G.hintT/50);
    ctx.fillStyle = "rgba(9,16,32,.6)";
    var t = G.level.hint;
    ctx.font = "600 14px 'Segoe UI', system-ui, Arial, sans-serif";
    var w = ctx.measureText(t).width + 28;
    rrect(VW/2 - w/2, VH-56, w, 30, 10); ctx.fill();
    text(t, VW/2, VH-36, 14, "#dbeaff", "center", 600);
    ctx.restore();
  }
}

function panel(w, h){
  ctx.fillStyle = "rgba(6,12,26,.85)";
  rrect(VW/2-w/2, VH/2-h/2, w, h, 22); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 2;
  rrect(VW/2-w/2, VH/2-h/2, w, h, 22); ctx.stroke();
}

function recLine(key, x, y){
  var b = bestScore(key);
  text(b ? (b.score ? "рекорд " + b.score + " очков" : "рекорд " + fmtTime(b.time)) : "ещё не пройден",
       x, y, 12, b ? "#8bffcf" : "rgba(200,220,255,.45)", "center", 600);
}

function drawMenu(){
  ctx.fillStyle = "rgba(4,10,22,.62)"; ctx.fillRect(0,0,VW,VH);
  panel(700, 400);
  shadowText("ПЕРЕМЕНА", VW/2, 92, 44, "#ffd166", "center");
  text("успей пробежать школу за перемену", VW/2, 114, 14, "#9fd8ff", "center", 600);

  uiButton("mode_normal", 122, 128, 264, 80, "ОБЫЧНЫЙ", DIFFS.normal.tag,
           { sel: G.pick === "normal", size:24 });
  uiButton("mode_hard", 414, 128, 264, 80, "ХАРДКОР", DIFFS.hard.tag,
           { sel: G.pick === "hard", selBorder:"#ff8080", col:"#ffd0d0", size:24 });
  recLine(recKey("normal"), 254, 226);
  recLine(recKey("hard"), 546, 226);

  uiButton("src_classic", 104, 240, 190, 52, "КЛАССИКА", null,
           { size:17, sel: curSrc === "classic", selBorder:"#9fd8ff" });
  uiButton("src_seed", 306, 240, 190, 52, "СИД " + curSeed, null,
           { size:17, sel: curSrc === "seed", selBorder:"#9fd8ff" });
  uiButton("seed_new", 508, 240, 190, 52, "НОВЫЙ СИД", null, { size:17 });
  text(curSrc === "seed"
        ? "7 случайных уровней по коду · один код — один и тот же набор"
        : "7 авторских уровней · «сид» соберёт случайные",
       VW/2, 312, 13, "rgba(200,220,255,.75)", "center", 600);

  text(isTouch ? "Слева внизу — бежать, справа — прыгать."
               : "← →  бежать      ПРОБЕЛ  прыжок      R  заново      P  пауза",
       VW/2, 336, 13, "rgba(200,220,255,.6)", "center", 600);

  uiButton("mods_open", 296, 338, 210, 54, "МОДИФИКАТОРЫ", "очки × " + modMult().toFixed(2),
           { size:15, sel: modCount() > 0, selBorder:"#ffb98a" });
  ctx.globalAlpha = 0.65 + 0.35*Math.sin(G.tick*0.08);
  text(isTouch ? "Тапни режим — и побежали" : "ПРОБЕЛ — начать выбранный режим",
       VW/2, 424, 16, "#ffffff", "center");
  ctx.globalAlpha = 1;
  iconBtn("sound", 674, 58, isTouch ? 54 : 44, "sound");
}

function modCell(m, x, y, w, h){
  var on = mod(m.k), hot = (G.hotBtn === "mod_" + m.k && G.hotT > 0);
  var tint = m.m > 0 ? "#ffb98a" : "#8bffcf";
  ctx.fillStyle = hot ? "rgba(255,255,255,.3)" : (on ? "rgba(255,255,255,.16)" : "rgba(255,255,255,.06)");
  rrect(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = on ? tint : "rgba(255,255,255,.18)";
  ctx.lineWidth = on ? 2.4 : 1.4;
  rrect(x, y, w, h, 12); ctx.stroke();
  ctx.fillStyle = on ? tint : "rgba(255,255,255,.12)";
  rrect(x+12, y+h/2-11, 22, 22, 6); ctx.fill();
  if(on){
    ctx.strokeStyle = "#14202c"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x+18, y+h/2); ctx.lineTo(x+22, y+h/2+5); ctx.lineTo(x+29, y+h/2-6);
    ctx.stroke();
  }
  text(m.n, x+44, y+h/2-1, 15, on ? "#ffffff" : "rgba(230,240,255,.8)", "left", 700);
  text(m.d, x+44, y+h/2+15, 11, "rgba(200,220,255,.55)", "left", 600);
  text((m.m > 0 ? "+" : "") + m.m + "%", x+w-12, y+h/2+5, 15, tint, "right", 700);
  G.buttons.push({ id:"mod_" + m.k, x:x, y:y, w:w, h:h });
}

function drawMods(){
  ctx.fillStyle = "rgba(4,10,22,.72)"; ctx.fillRect(0,0,VW,VH);
  panel(770, 450);
  shadowText("МОДИФИКАТОРЫ", VW/2, 50, 26, "#ffd166", "center");
  text("ОЧКИ × " + modMult().toFixed(2) + (modCount() ? "   ·   включено " + modCount() : "   ·   ничего не включено"),
       VW/2, 76, 17, modCount() ? "#ffb98a" : "rgba(200,220,255,.6)", "center");
  for(var i=0;i<MODS.length;i++)
    modCell(MODS[i], (i % 2) ? 402 : 32, 94 + Math.floor(i/2)*54, 350, 50);
  uiButton("mods_clear", 214, 424, 170, 38, "ВСЁ ВЫКЛ", null, { size:15 });
  uiButton("mods_back", 416, 424, 170, 38, "НАЗАД", null, { size:15, sel:true });
}

function drawBanner(){
  var k = 1 - Math.abs(G.banner - 35)/35;
  ctx.save();
  ctx.globalAlpha = Math.min(1, k*2);
  ctx.fillStyle = "rgba(6,12,26,.65)";
  rrect(VW/2-190, VH/2-46, 380, 92, 16); ctx.fill();
  shadowText("Уровень пройден!", VW/2, VH/2-4, 30, "#8bffcf", "center");
  text(G.levelIndex+1 < LEVELS.length ? "Дальше: " + LEVELS[G.levelIndex+1].name : "Последний рывок…",
       VW/2, VH/2+26, 15, "#dbe8ff", "center", 600);
  ctx.restore();
}

function rankOf(used, coins, deaths){
  if(coins === G.coinsMax && deaths === 0) return ["ОТЛИЧНИК С МЕДАЛЬЮ", "#ffd166"];
  if(coins >= G.coinsMax*0.8 && used < curDiff.time*0.55) return ["ОТЛИЧНИК", "#8bffcf"];
  if(coins >= G.coinsMax*0.5) return ["ХОРОШИСТ", "#9fd8ff"];
  return ["ТРОЕЧНИК, НО ЖИВОЙ", "#ffb3b3"];
}

function endButtons(y){
  uiButton("again", 140, y, 240, 64, "ЕЩЁ РАЗ", null, { size:22, selBg:"rgba(255,255,255,.2)" });
  uiButton("menu", 420, y, 240, 64, "В МЕНЮ", null, { size:22 });
}

function drawWin(){
  ctx.fillStyle = "rgba(4,10,22,.66)"; ctx.fillRect(0,0,VW,VH);
  panel(620, 430);
  var used = curDiff.time - G.timeLeft;
  var r = rankOf(used, G.coins, G.deaths);
  shadowText("УСПЕЛ!", VW/2, 106, 46, "#8bffcf", "center");
  text(curDiff.key === "hard" ? "И это на ХАРДКОРЕ. Уважение." : "Звонок ещё не прозвенел, а ты уже герой перемены.",
       VW/2, 134, 15, "#dbe8ff", "center", 600);
  text("Время " + fmtTime(used) + "   ·   пирожков " + G.coins + "/" + G.coinsMax +
       "   ·   падений " + G.deaths, VW/2, 172, 15, "#dbe8ff", "center", 600);
  text(runScore() + " ОЧКОВ", VW/2, 214, 34, "#ffd166", "center");
  text(runPoints() + " × " + modMult().toFixed(2) + (modCount() ? "  (модификаторов: " + modCount() + ")" : ""),
       VW/2, 236, 12, "rgba(220,235,255,.7)", "center", 600);
  text(r[0], VW/2, 278, 22, r[1], "center");
  if(G.record) text("★ новый рекорд ★", VW/2, 302, 14, "#ffd166", "center", 600);
  else if(G.best && G.best.score) text("рекорд: " + G.best.score + " очков", VW/2, 302, 13,
                                       "rgba(200,220,255,.7)", "center", 600);
  if(curSrc === "seed") text("сид " + curSeed, VW/2, 322, 13, "#9fd8ff", "center", 600);
  endButtons(344);
}

function drawOver(){
  ctx.fillStyle = "rgba(40,6,14,.68)"; ctx.fillRect(0,0,VW,VH);
  panel(620, 380);
  var dead = G.overReason === "dead";
  shadowText(dead ? "ПОПАЛСЯ!" : "ДЗЫНЬ!", VW/2, 140, 46, "#ff8080", "center");
  text(dead ? "В хардкоре жизнь одна — забег окончен."
            : "Перемена кончилась, а ты посреди коридора.",
       VW/2, 172, 15, "#ffd9d9", "center", 600);
  text("Дошёл до уровня " + (G.levelIndex+1) + " · пирожков " + G.coins,
       VW/2, 206, 16, "#ffd98a", "center");
  text(runScore() + " очков", VW/2, 232, 20, "#ffd166", "center");
  if(curSrc === "seed") text("сид " + curSeed, VW/2, 238, 13, "rgba(200,220,255,.7)", "center", 600);
  endButtons(268);
}

function drawPaused(){
  ctx.fillStyle = "rgba(4,10,22,.66)"; ctx.fillRect(0,0,VW,VH);
  panel(520, 320);
  shadowText("ПАУЗА", VW/2, 174, 38, "#9fd8ff", "center");
  uiButton("resume", 250, 200, 300, 62, "ПРОДОЛЖИТЬ", null, { size:22, sel:true });
  uiButton("restart", 250, 274, 142, 54, "СНАЧАЛА", null, { size:17 });
  uiButton("menu", 408, 274, 142, 54, "В МЕНЮ", null, { size:17 });
}

/* ================== КАДР ================== */
function render(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0,0,VW,VH);
  G.buttons = [];                       // кнопки собираются заново каждый кадр

  var cam = G.level ? G.cam : 0;
  drawBackground(cam);

  if(G.level){
    ctx.save();
    var sh = G.shake;
    ctx.translate(-Math.round(cam) + (sh>0.4?rnd(-sh,sh):0), (sh>0.4?rnd(-sh,sh):0));
    drawTiles(cam);
    drawMovers();
    drawSpikes();
    drawPads();
    drawCoins();
    drawKey();
    drawDoor();
    for(var i=0;i<G.level.enemies.length;i++) drawEnemy(G.level.enemies[i]);
    drawParts();
    if(G.player) drawPlayer();
    ctx.restore();
  }

  if(mod("dark") && G.player && (G.state === "play" || G.state === "clear" || G.state === "paused")){
    var lx = G.player.x + G.player.w/2 - G.cam, ly = G.player.y + G.player.h/2;
    var lg = ctx.createRadialGradient(lx, ly, 30, lx, ly, 200);
    lg.addColorStop(0, "rgba(5,9,18,0)");
    lg.addColorStop(0.5, "rgba(5,9,18,.55)");
    lg.addColorStop(1, "rgba(5,9,18,.94)");
    ctx.fillStyle = lg; ctx.fillRect(0, 0, VW, VH);
  }
  if(G.flash > 0){
    ctx.fillStyle = "rgba(255,240,180," + (G.flash/12*0.35) + ")";
    ctx.fillRect(0,0,VW,VH);
  }

  syncPad();
  if(G.state === "menu"){ drawMenu(); return; }
  if(G.state === "mods"){ drawMenu(); drawMods(); return; }
  drawHUD();
  if(G.state === "clear") drawBanner();
  else if(G.state === "win") drawWin();
  else if(G.state === "over") drawOver();
  else if(G.state === "paused") drawPaused();
}

/* ================== ЗАПУСК ================== */
function resize(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = VW*dpr; cv.height = VH*dpr;
  cv.style.width = ""; cv.style.height = "";
}
window.addEventListener("resize", resize);

var padShown = null;
function syncPad(){                              // джойстик нужен только в самой игре
  var show = (G.state === "play" || G.state === "clear");
  if(show === padShown) return;
  padShown = show;
  document.body.classList.toggle("hidepad", !show);
}
var mqPortrait = window.matchMedia ? window.matchMedia("(orientation: portrait)") : null;
function orientCheck(){
  if(isTouch && mqPortrait && mqPortrait.matches && G && G.state === "play") G.state = "paused";
}
if(mqPortrait){
  if(mqPortrait.addEventListener) mqPortrait.addEventListener("change", orientCheck);
  else if(mqPortrait.addListener) mqPortrait.addListener(orientCheck);
}
document.addEventListener("visibilitychange", function(){
  if(document.hidden && G && G.state === "play") G.state = "paused";
});

var last = 0, acc = 0, STEP = 1/60;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last = ts;
  var dt = Math.min(0.1, (ts - last)/1000);
  last = ts;
  acc += dt;
  var guard = 0;
  while(acc >= STEP && guard < 5){ update(STEP); acc -= STEP; guard++; }
  if(guard >= 5) acc = 0;
  render();
}

window.PEREMENA_DEBUG = {
  get: function(){ return G; },
  goto: function(i){ G.state = "play"; loadLevel(i); },
  start: startRun,
  input: input,
  levels: function(){ return LEVELS; },
  gen: function(seed){ return genLevels(seed); },
  seed: function(){ return { src: curSrc, seed: curSeed }; },
  setSeed: setSeed,
  mods: function(){ return modOn; },
  mult: modMult, points: runPoints, score: runScore,
  jumpV: jumpV, runMax: runMax, doorOpen: doorOpen
};

modLoad();
(function initSeed(){
  var h = "";
  try{ h = (location.hash || "").replace(/^#/, ""); }catch(e){}
  if(/^s=/i.test(h)){ curSeed = cleanSeed(h.slice(2)); curSrc = "seed"; }
  else {
    try{
      curSeed = cleanSeed(localStorage.getItem("peremena_seed"));
      if(!/^classic$/i.test(h)) curSrc = localStorage.getItem("peremena_src") || "classic";
    }catch(e){}
  }
  if(!curSeed) curSeed = randomSeed();
  LEVELS = (curSrc === "seed") ? genLevels(curSeed) : CAMPAIGN;
})();

G = newGame();
G.coinsMax = 0;
for(var li=0; li<LEVELS.length; li++) G.coinsMax += buildLevel(LEVELS[li]).coinTotal;
G.level = buildLevel(LEVELS[0]);
G.player = null;
try{ G.pick = localStorage.getItem("peremena_mode") || "normal"; }catch(e){}
resize();
requestAnimationFrame(frame);
})();
</script>
