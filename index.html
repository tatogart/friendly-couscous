/* ================== СЛУЧАЙНЫЕ УРОВНИ ПО СИДУ ==================
   Генератор строит уровень слева направо вдоль земли, поэтому проход
   есть всегда: ямы не шире 3 клеток, площадки — только на досягаемой
   высоте, перед выходом всегда чистый участок. */
var SEED_ABC = "ACDEFHJKLMNPRTUVWXY3479";
var GEN_NAMES = ["Первый этаж","Раздевалка","Столовая","Актовый зал","Лестница",
                 "Спортзал","Коридор","Библиотека","Кабинет труда","Чердак",
                 "Крыша","Школьный двор","Рекреация","Кабинет химии"];
var GEN_HINTS = ["Этого уровня ещё никто не видел","Сид сгенерил — тебе проходить",
                 "Смотри под ноги","Тут может быть что угодно","Беги, не думай",
                 "Звонок не ждёт"];

function hashSeed(str){
  var h = 2166136261, i;
  str = String(str).toUpperCase();
  for(i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randomSeed(){
  var out = "", i;
  for(i=0;i<5;i++) out += SEED_ABC.charAt(Math.floor(Math.random()*SEED_ABC.length));
  return out;
}
function cleanSeed(str){
  var out = "", i, ch;
  str = String(str || "").toUpperCase();
  for(i=0;i<str.length && out.length<8;i++){
    ch = str.charAt(i);
    if(SEED_ABC.indexOf(ch) >= 0 || /[0-9A-Z]/.test(ch)) out += ch;
  }
  return out;
}
function irnd(rnd, a, b){ return a + Math.floor(rnd()*(b-a+1)); }
function pickOf(rnd, arr){ return arr[Math.floor(rnd()*arr.length)]; }

function genLevel(rnd, idx, name, withKey){
  var W = 40 + idx*2, H = 15, i, x, y;
  var g = [], movers = [], plats = [];
  for(y=0;y<H;y++){ g.push([]); for(x=0;x<W;x++) g[y].push("."); }
  for(x=0;x<W;x++){ g[13][x] = "#"; g[14][x] = "#"; }
  g[12][2] = "@";
  var endCol = W - 4, col = 6;

  function coins(row, from, n){
    for(var k=0;k<n;k++) if(from+k > 2 && from+k < W-2 && g[row][from+k] === ".") g[row][from+k] = "o";
  }
  function carve(from, w){
    for(var k=0;k<w;k++){ g[13][from+k] = "."; g[14][from+k] = "."; }
  }

  var pool = ["flat","coins","platform","locker"];
  if(idx >= 1) pool = pool.concat(["pit","enemy"]);
  if(idx >= 2) pool = pool.concat(["spikes","enemy","platform","ball","bell"]);
  if(idx >= 3) pool = pool.concat(["pad","pit"]);
  if(idx >= 4) pool = pool.concat(["mover","fly","spikes"]);
  if(idx >= 5) pool = pool.concat(["mover","fly","enemy"]);

  while(col < endCol - 6){
    var f = pickOf(rnd, pool), w, row;
    if(f === "flat"){ col += irnd(rnd,3,5); }
    else if(f === "coins"){ coins(12, col, irnd(rnd,2,3)); col += 5; }
    else if(f === "pit" || f === "mover"){
      var mover = (f === "mover");
      w = mover ? irnd(rnd,4,5) : irnd(rnd, 2, idx >= 3 ? 3 : 2);
      if(col + w > endCol - 6){ col += 3; continue; }
      carve(col, w);
      if(mover){
        movers.push({ tx:col, ty:11, tw:3, axis:"x", dist:Math.max(2, w-3),
                      speed:0.018 + rnd()*0.008, phase:rnd()*6.28 });
        coins(10, col+1, 2);
      } else if(rnd() < 0.5) coins(11, col, w);
      col += w + 4;                     // запас на разбег перед следующей фичей
    }
    else if(f === "spikes"){
      w = irnd(rnd,1,2);
      for(i=0;i<w;i++) g[12][col+i] = "^";
      col += w + 4;
    }
    else if(f === "enemy"){ g[12][col] = "x"; col += 6; }
    else if(f === "locker"){ g[12][col] = "?"; col += 4; }
    else if(f === "ball"){ g[12][col] = "m"; col += 4; }
    else if(f === "bell"){ g[12][col] = "B"; col += 4; }
    else if(f === "fly"){ g[irnd(rnd,7,9)][col] = "v"; col += 4; }
    else if(f === "platform"){
      w = irnd(rnd,3,5); row = irnd(rnd,10,11);
      for(i=0;i<w;i++) g[row][col+i] = "=";
      coins(row-1, col+1, Math.min(w-1, irnd(rnd,1,3)));
      plats.push({ x:col + Math.floor(w/2), y:row-1 });
      col += w + 2;
    }
    else if(f === "pad"){
      g[12][col] = "J";
      var prow = irnd(rnd,5,6), pw = irnd(rnd,3,4), px = Math.max(1, col + irnd(rnd,-1,1));
      for(i=0;i<pw;i++) if(px+i < W-1) g[prow][px+i] = "=";
      coins(prow-1, px, Math.min(pw, 3));
      plats.push({ x:px + 1, y:prow-1 });
      col += pw + 3;
    }
  }

  g[12][endCol] = "E";

  /* ключ кладём на площадку, а если их нет — на ровную землю */
  if(withKey){
    if(plats.length){
      var pl = plats[Math.floor(rnd()*plats.length)];
      g[pl.y][pl.x] = "K";
    } else {
      for(x = Math.floor(endCol/2); x < endCol-2; x++)
        if(g[12][x] === "." && g[13][x] === "#"){ g[12][x] = "K"; break; }
    }
  }

  /* минимум пирожков, чтобы уровень не был пустым */
  var got = 0;
  for(y=0;y<H;y++) for(x=0;x<W;x++) if(g[y][x] === "o") got++;
  for(i=0; got < 6 && i < 200; i++){
    x = irnd(rnd, 4, endCol-2);
    if(g[12][x] === "." && g[13][x] === "#"){ g[12][x] = "o"; got++; }
  }

  /* страховка: всё, что стоит на земле, должно стоять на твёрдом */
  for(x=0;x<W;x++)
    if("@Ex^JKo?mB".indexOf(g[12][x]) >= 0 && g[13][x] !== "#"){ g[13][x] = "#"; g[14][x] = "#"; }

  return { name:name, hint:pickOf(rnd, GEN_HINTS),
           rows: g.map(function(r){ return r.join(""); }), movers:movers };
}

function genLevels(seed){
  var rnd = mulberry(hashSeed(seed));
  var names = GEN_NAMES.slice(), out = [], i, n;
  var keyLevel = irnd(rnd, 2, 5);
  for(i=0;i<7;i++){
    n = names.length ? names.splice(Math.floor(rnd()*names.length), 1)[0] : "Этаж " + (i+1);
    out.push(genLevel(rnd, i, n, i === keyLevel));
  }
  return out;
}

function shuffleQuestion(src, r){
  var a = src.a.slice(), i, j, t;
  for(i = a.length - 1; i > 0; i--){              // тасуем Фишером — Йетсом
    j = Math.floor(r() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return { q: src.q, a: a, r: a.indexOf(src.a[0]) };   // верный ответ всегда первый в таблице
}
function lessonCfg(){
  return {
    strict: mod("strict"), exam: mod("exam"), easy: mod("easyclass"),
    bonus: mod("favorite") ? 30 : 15,
    pts:   mod("favorite") ? 200 : 100
  };
}
function startLesson(i, force){
  var r = mulberry(hashSeed(curSeed + "les" + i + curDiff.key));
  var kinds = ["copy","quiz","notes","canteen","pushups","sleep"];
  var cfg = lessonCfg();
  var L = { kind: force || kinds[Math.floor(r()*kinds.length)], i:i, t:0, done:false, ok:false, endT:0,
            cfg: cfg, subject: LESSON_NAMES[Math.floor(r()*LESSON_NAMES.length)] };
  if(L.kind === "copy"){
    L.prog = 0; L.phase = "away"; L.pt = 100; L.strikes = 0; L.stun = 0;
    L.limit = (cfg.strict ? 28 : 34)*60;
    L.maxStrikes = cfg.exam ? 2 : (cfg.easy ? 5 : 3);
  } else if(L.kind === "quiz"){
    L.qs = []; L.used = {};
    while(L.qs.length < 3){
      var qi = Math.floor(r()*QUIZ.length);
      if(L.used[qi]) continue;
      L.used[qi] = 1;
      L.qs.push(shuffleQuestion(QUIZ[qi], r));       // варианты каждый раз в новом порядке
    }
    L.qi = 0; L.right = 0; L.per = cfg.strict ? 6*60 : 9*60; L.qt = L.per; L.pick = -1; L.pickT = 0;
    L.need = cfg.exam ? 3 : (cfg.easy ? 1 : 2);
  } else if(L.kind === "notes"){
    L.notes = []; L.spawn = 20; L.left = 12; L.hits = 0; L.miss = 0; L.pop = 0; L.popT = 0;
    L.need = cfg.exam ? 10 : (cfg.easy ? 5 : 8);
    L.speed = cfg.strict ? 4.1 : 3.1;
  } else if(L.kind === "canteen"){
    L.need = cfg.exam ? 12 : (cfg.easy ? 5 : 9);
    L.tray = VW/2; L.items = []; L.caught = 0; L.bad = 0;
    L.left = L.need + 6;                      // с запасом на тряпки и промахи
    L.spawn = 25; L.fall = cfg.strict ? 3.6 : 2.8;
  } else if(L.kind === "pushups"){
    L.reps = 0; L.down = 0; L.next = "left";
    L.limit = (cfg.strict ? 16 : 22)*60;
    L.need = cfg.exam ? 18 : (cfg.easy ? 8 : 13);
  } else {
    L.eye = 100; L.blink = 0; L.zzz = 0;
    L.limit = (cfg.strict ? 28 : 22)*60;
    L.drain = cfg.strict ? 0.42 : 0.3;
  }
  G.lesson = L;
  G.state = "lesson";
  G.wipe = 26;
}
function lessonEnd(ok){
  var L = G.lesson;
  if(L.done) return;
  L.done = true; L.ok = ok; L.endT = 100;
  if(ok){ G.timeLeft += L.cfg.bonus; G.bonusPts += L.cfg.pts; sfx.win(); }
  else { G.timeLeft = Math.max(8, G.timeLeft - 10); sfx.fail(); }
}
function lessonAnswer(n){
  var L = G.lesson;
  if(!L || L.kind !== "quiz" || L.done || L.pickT > 0) return;
  if(L.qi >= L.qs.length) return;
  var q = L.qs[L.qi];
  L.pick = n; L.pickT = 45;
  if(n === q.r){ L.right++; sfx.coin(); } else sfx.hurt();
}
function lessonPress(k){
  var L = G.lesson;
  if(!L || L.done) return;
  if(L.kind === "pushups" && (k === "left" || k === "right")){
    if(k === L.next){
      L.reps++; L.down = 12;
      L.next = (k === "left") ? "right" : "left";
      puff(VW/2, 330, 4, "#8bffcf", 2);
      tone(300 + (L.reps % 6)*30, 0.06, "square", 0.05, 80);
      if(L.reps >= L.need) lessonEnd(true);
    } else {
      G.shake = 5; sfx.hurt();
    }
    return;
  }
  if(L.kind === "sleep" && k === "jump"){
    L.eye = Math.min(100, L.eye + 11);
    L.blink = 8;
    tone(520, 0.05, "triangle", 0.04, 120);
    return;
  }
  if(L.kind === "notes" && (k === "left" || k === "right")){
    var lane = (k === "left") ? 0 : 1, i, nt, best = -1, bd = 99, d;
    for(i=0;i<L.notes.length;i++){
      nt = L.notes[i];
      if(nt.lane !== lane || nt.hit) continue;
      d = Math.abs(nt.x - 210);
      if(d < bd){ bd = d; best = i; }
    }
    if(best >= 0 && bd < 40){
      L.notes[best].hit = true; L.hits++;
      L.pop = 1; L.popT = 18;
      puff(210, 200 + lane*70, 8, "#8bffcf", 2.4);
      sfx.coin();
    } else {
      L.miss++; L.pop = -1; L.popT = 18; sfx.hurt();
    }
  }
}
function lessonUpdate(){
  var L = G.lesson, i, nt;
  if(!L) return;
  L.t++;
  if(L.done){
    if(--L.endT <= 0){
      if(mod("dbllesson") && !L.second){ startLesson(L.i + 100, null); G.lesson.second = true; }
      else { G.state = "play"; G.wipe = 26; }
    }
    return;
  }
  if(L.kind === "copy"){
    if(L.stun > 0) L.stun--;
    if(--L.pt <= 0){
      if(L.phase === "away"){ L.phase = "turn"; L.pt = L.cfg.strict ? 20 : 32; }
      else if(L.phase === "turn"){ L.phase = "watch"; L.pt = (L.cfg.strict ? 80 : 60) + Math.floor(Math.random()*70); }
      else { L.phase = "away"; L.pt = (L.cfg.strict ? 50 : 80) + Math.floor(Math.random()*90); }
    }
    if(input.jump && L.stun <= 0){
      if(L.phase === "watch"){
        L.strikes++; L.stun = 40;
        L.prog = Math.max(0, L.prog - 16);
        G.shake = 12; sfx.hurt();
        toast(L.strikes >= L.maxStrikes ? "Попался!" : "Учитель смотрит!");
        if(L.strikes >= L.maxStrikes) lessonEnd(false);
      } else {
        L.prog += 0.8;
        if(L.t % 6 === 0) puff(VW/2 + rnd(-40,40), 336, 2, "#ffd166", 1);
        if(L.prog >= 100) lessonEnd(true);
      }
    }
    if(--L.limit <= 0) lessonEnd(false);
  } else if(L.kind === "quiz"){
    if(L.pickT > 0){
      if(--L.pickT <= 0){
        L.pick = -1; L.qi++; L.qt = L.per;
        if(L.qi >= L.qs.length) lessonEnd(L.right >= L.need);
      }
      return;
    }
    if(--L.qt <= 0){ L.pick = 9; L.pickT = 45; sfx.hurt(); }
  } else if(L.kind === "canteen"){
    var it, k2;
    L.tray += ((input.right?1:0) - (input.left?1:0)) * 6;
    L.tray = clamp(L.tray, 70, VW-70);
    if(L.left > 0 && --L.spawn <= 0){
      L.spawn = (L.cfg.strict ? 20 : 28) + Math.floor(Math.random()*16);
      L.items.push({ x: rnd(90, VW-90), y:-20, bad: Math.random() < 0.18, sp:0 });
      L.left--;
    }
    for(k2=L.items.length-1; k2>=0; k2--){
      it = L.items[k2];
      it.y += L.fall; it.sp += 0.08;
      if(it.y > VH-158 && it.y < VH-116 && Math.abs(it.x - L.tray) < 48){
        L.items.splice(k2,1);
        if(it.bad){
          L.bad++; L.caught = Math.max(0, L.caught - 1);
          G.shake = 6; sfx.hurt(); toast("Тряпка в подносе!");
        } else {
          L.caught++; sfx.coin();
          puff(it.x, VH-140, 7, "#ffd166", 2.2);
        }
        continue;
      }
      if(it.y > VH + 20) L.items.splice(k2,1);
    }
    if(L.left <= 0 && !L.items.length) lessonEnd(L.caught >= L.need);
  } else if(L.kind === "pushups"){
    if(L.down > 0) L.down--;
    if(--L.limit <= 0) lessonEnd(L.reps >= L.need);
  } else if(L.kind === "sleep"){
    if(L.blink > 0) L.blink--;
    L.eye -= L.drain;
    if(L.eye < 40 && L.t % 24 === 0){
      G.parts.push({ x:VW/2 + rnd(-30,30), y:250, vx:rnd(-0.3,0.3), vy:-0.7,
                     life:60, max:60, col:"#9fd8ff", s:4, g:0 });
    }
    if(L.eye <= 0) lessonEnd(false);
    else if(--L.limit <= 0) lessonEnd(true);
  } else {
    if(L.popT > 0) L.popT--;
    if(L.left > 0 && --L.spawn <= 0){
      L.spawn = 34 + Math.floor(Math.random()*16);
      L.notes.push({ lane: Math.random() < 0.5 ? 0 : 1, x: VW + 30, hit:false });
      L.left--;
    }
    for(i=L.notes.length-1; i>=0; i--){
      nt = L.notes[i];
      nt.x -= L.speed;
      if(nt.hit && nt.x < 190){ L.notes.splice(i,1); continue; }
      if(!nt.hit && nt.x < 165){ L.notes.splice(i,1); L.miss++; L.pop = -1; L.popT = 14; }
    }
    if(L.left <= 0 && !L.notes.length) lessonEnd(L.hits >= L.need);
  }
}

var ITEMS = {
  soda:  { n:"Газировка", d:"рывок скорости на 6 сек", c:"#ff6b6b", t:360, w:22 },
  gum:   { n:"Жвачка",    d:"двойной прыжок на 15 сек", c:"#ff9ff3", t:900, w:20 },
  bag:   { n:"Портфель",  d:"держит один удар",         c:"#9b6bf0", t:0,   w:20 },

};
var ITEM_KEYS = ["soda","gum","bag","watch","pass"];
function rollItem(rnd){
  var total = 0, i, r;
  for(i=0;i<ITEM_KEYS.length;i++) total += ITEMS[ITEM_KEYS[i]].w;
  r = rnd() * total;
  for(i=0;i<ITEM_KEYS.length;i++){
    r -= ITEMS[ITEM_KEYS[i]].w;
    if(r <= 0) return ITEM_KEYS[i];
  }
  return "soda";
}

var AC = null, muted = false;
function actx(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, dur, type, vol, slide, delay){
  if(muted) return;
  var c = actx(); if(!c) return;
  var t0 = c.currentTime + (delay||0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(f, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(50, f+slide), t0+dur);
  g.gain.setValueAtTime(vol||0.07, t0);
  g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}

var input = { left:false, right:false, jump:false };

function setKey(k, down){

    return;

function doButton(id){
  actx();
  G.hotBtn = id; G.hotT = 9;
  if(id === "mode_normal"){ G.pick = "normal"; }
  else if(id === "mode_hard"){ G.pick = "hard"; }
  else if(id === "mode_endless"){ G.pick = "endless"; }
  else if(id === "play"){ startRun(G.pick); }
  else if(id === "again"){ startRun(curDiff.key); }
  else if(id === "menu"){ toMenu(); }
  else if(id === "resume"){ G.state = "play"; }
  else if(id === "restart"){ startRun(curDiff.key); }
  else if(id === "pause"){ G.state = (G.state === "play") ? "paused" : (G.state === "paused" ? "play" : G.state); }
  else if(id === "sound"){ muted = !muted; if(!muted) sfx.coin(); }
  else if(id === "full"){ toggleFullscreen(); }
  else if(id === "mods_open"){ G.back = "menu"; G.state = "mods"; G.modTab = G.modTab || "hard"; }
  else if(id === "hub_open"){ enterHub(); }
  else if(id === "back"){ G.state = G.back || "menu"; G.back = null; }
  else if(id === "to_hub"){ enterHub(); }
  else if(id.indexOf("skin_") === 0){ buySkin(skinBy(id.slice(5))); }
  else if(id.indexOf("ans") === 0){ lessonAnswer(+id.slice(3)); }
  else if(id === "tab_hard"){ G.modTab = "hard"; }
  else if(id === "tab_easy"){ G.modTab = "easy"; }
  else if(id === "tab_class"){ G.modTab = "class"; }
  else if(id === "mods_back"){ G.state = G.back || "menu"; G.back = null; }
  else if(id === "mods_clear"){ modOn = {}; modSave(); applySource(); }
  else if(id.indexOf("mod_") === 0){
    var mk = id.slice(4);
    modOn[mk] = !modOn[mk];
    if(!modOn[mk]) delete modOn[mk];
    modSave(); applySource();
    tone(modOn[mk] ? 700 : 400, 0.08, "square", 0.05, modOn[mk] ? 200 : -150);
  }
  else if(id === "src_classic"){ curSrc = "classic"; applySource(); }
  else if(id === "src_seed"){ curSrc = "seed"; applySource(); }
  else if(id === "seed_new"){ curSeed = randomSeed(); curSrc = "seed"; applySource(); sfx.key(); }

function trackMouse(ev){
  var pt = canvasPoint(ev);
  G.mx = pt.x; G.my = pt.y;
}
function canvasPoint(ev){
  var r = cv.getBoundingClientRect();
  return { x:(ev.clientX - r.left) * VW / r.width, y:(ev.clientY - r.top) * VH / r.height };
}
document.addEventListener("keydown", function(e){
  var c = e.code;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].indexOf(c) >= 0) e.preventDefault();
  if(e.repeat) return;
  if(G.state === "menu" && (c==="ArrowLeft"||c==="KeyA"||c==="ArrowRight"||c==="KeyD")){
    G.pick = (c==="ArrowLeft"||c==="KeyA") ? "normal" : "hard"; return;
  }
  if(G.state === "lesson" && (c==="Digit1"||c==="Digit2"||c==="Digit3")){
    lessonAnswer(+c.slice(5) - 1); return;
  }
  if(c==="Digit1") { G.pick = "normal"; if(G.state==="menu") startRun("normal"); return; }
  if(c==="Digit2") { G.pick = "hard"; if(G.state==="menu") startRun("hard"); return; }
  if(c==="Digit3") { G.pick = "endless"; if(G.state==="menu") startRun("endless"); return; }
  if(c==="ArrowLeft"||c==="KeyA") setKey("left",true);
  else if(c==="ArrowRight"||c==="KeyD") setKey("right",true);
  else if(c==="Space"||c==="ArrowUp"||c==="KeyW"||c==="KeyZ") setKey("jump",true);
  else if(c==="Enter") uiAction();
  else if(c==="KeyR"){
    actx();
    if(G.state === "play") killPlayer(true);
    else if(G.state === "menu" || G.state === "win" || G.state === "over") startRun(curDiff.key);
  }
  else if(c==="KeyP"||c==="Escape"){
    if(G.state==="play") G.state="paused";
    else if(G.state==="paused") G.state="play";
    else if(G.state==="mods") G.state="menu";
  }
  else if(c==="KeyO" && (G.state==="menu"||G.state==="mods")) G.state = (G.state==="mods") ? "menu" : "mods";
  else if(c==="KeyM"){ muted = !muted; }
  else if(c==="KeyF"){ toggleFullscreen(); }
  else if(c==="KeyE"||c==="ArrowDown"||c==="ShiftLeft"||c==="KeyQ") setKey("item", true);
});
document.addEventListener("keyup", function(e){
  var c = e.code;
  if(c==="ArrowLeft"||c==="KeyA") setKey("left",false);
  else if(c==="ArrowRight"||c==="KeyD") setKey("right",false);

(function touchSetup(){
  isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if(!isTouch) return;

/* ================== ЗАГРУЗКА УРОВНЯ ================== */
function isSolidChar(ch){ return SOLID.indexOf(ch) >= 0; }

function buildLevel(def){
  var w = 0, i, j;
  for(i=0;i<def.rows.length;i++) w = Math.max(w, def.rows[i].length);
  var grid = [];
  for(i=0;i<def.rows.length;i++){
    var row = def.rows[i];
    while(row.length < w) row += ".";
    grid.push(row.split(""));
  }
  var lv = { name:def.name, theme:themeOf(def),
             hint:(isTouch && def.hintTouch) ? def.hintTouch : def.hint, w:w, h:grid.length, grid:grid,
             coins:[], enemies:[], pads:[], spikes:[], movers:[], lockers:[], stands:[],
             balls:[], bells:[], door:null,
             crack:{}, broke:{},
             key:null, needKey:false, start:{x:64,y:64}, coinTotal:0 };

  for(i=0;i<lv.h;i++) for(j=0;j<w;j++){
    var ch = grid[i][j], px = j*TS, py = i*TS;
    if(ch === "o"){ lv.coins.push({x:px+8, y:py+8, w:16, h:16, got:false, ph:rnd(0,6.28)}); grid[i][j]="."; }
    else if(ch === "@"){ lv.start = {x:px+6, y:py+4}; grid[i][j]="."; }
    else if(ch === "E"){
      lv.door = { x:px+3, y:py-14, w:26, h:46, cx:px+16 };
      /* вход засчитывается по всей колонке двери: перепрыгнуть выход нельзя.
         Поэтому над дверью в карте ничего не ставим. */
      lv.doorHit = { x:px, y:0, w:32, h:py+TS };
      grid[i][j]=".";
    }
    else if(ch === "K"){ lv.key = {x:px+8, y:py+10, w:16, h:14, got:false, ph:0}; lv.needKey=true; grid[i][j]="."; }
    else if(ch === "J"){ lv.pads.push({x:px+2, y:py+18, w:28, h:14, t:0}); grid[i][j]="."; }
    else if(ch === "x"){ if(!mod("empty")) lv.enemies.push(makeEnemy(px+3, py+4, false)); grid[i][j]="."; }
    else if(ch === "v"){ if(!mod("empty")) lv.enemies.push(makeEnemy(px+2, py+6, true)); grid[i][j]="."; }
    else if(ch === "^"){ lv.spikes.push({x:px+2, y:py+18, w:28, h:14}); }
    else if(STAND_INFO[ch]){ lv.stands.push({ x:px-6, y:py-40, w:44, h:72, kind:ch }); grid[i][j]="."; }
    else if(ch === "m"){ lv.balls.push({ x:px+6, y:py+8, w:20, h:20, vx:0, vy:0, spin:0, cool:0 }); grid[i][j]="."; }
    else if(ch === "B"){ lv.bells.push({ x:px+4, y:py+2, w:24, h:26, used:false, t:0 }); grid[i][j]="."; }
    else if(ch === "?"){ lv.lockers.push({ x:px+3, y:py+1, w:26, h:31, open:false, t:0, item:null }); grid[i][j]="."; }
  }
  lv.coinTotal = lv.coins.length;

  /* если шкафчиков в карте нет — ставим пару на свободную землю */
  if(lv.lockers.length < 2 && !mod("nobox") && !lv.stands.length){
    var lrnd = mulberry(hashSeed(def.name + "lockers")), put = 2 - lv.lockers.length, guard = 0;
    while(put > 0 && guard++ < 300){
      var lx = 5 + Math.floor(lrnd()*(w-10));
      if(grid[12][lx] !== "." || grid[13][lx] !== "#") continue;
      if(Math.abs(lx*TS - lv.start.x) < TS*3) continue;
      if(lv.door && Math.abs(lx*TS - lv.door.cx) < TS*3) continue;
      var busy = false, q;
      for(q=0;q<lv.lockers.length;q++) if(Math.abs(lv.lockers[q].x - lx*TS) < TS*6) busy = true;
      for(q=0;q<lv.spikes.length;q++) if(Math.abs(lv.spikes[q].x - lx*TS) < TS*2) busy = true;
      if(busy) continue;
      lv.lockers.push({ x:lx*TS+3, y:12*TS+1, w:26, h:31, open:false, t:0, item:null });
      put--;
    }
  }
  if(mod("nobox")) lv.lockers = [];

  /* мяч и кнопка звонка — школьные приколы, ставим на свободную землю */
  function freeSpot(seed, minFrom){
    var r = mulberry(hashSeed(def.name + seed)), guard = 0, gx, q, ok;
    while(guard++ < 260){
      gx = 5 + Math.floor(r()*(w-10));
      if(grid[12][gx] !== "." || grid[13][gx] !== "#") continue;
      if(Math.abs(gx*TS - lv.start.x) < TS*(minFrom || 3)) continue;
      if(lv.door && Math.abs(gx*TS - lv.door.cx) < TS*3) continue;
      ok = true;
      for(q=0;q<lv.lockers.length;q++) if(Math.abs(lv.lockers[q].x - gx*TS) < TS*3) ok = false;
      for(q=0;q<lv.spikes.length;q++) if(Math.abs(lv.spikes[q].x - gx*TS) < TS*2) ok = false;
      for(q=0;q<lv.balls.length;q++) if(Math.abs(lv.balls[q].x - gx*TS) < TS*4) ok = false;
      for(q=0;q<lv.bells.length;q++) if(Math.abs(lv.bells[q].x - gx*TS) < TS*4) ok = false;
      if(ok) return gx;
    }
    return -1;
  }
  if(!lv.stands.length){
    if(!lv.balls.length){
      var bx = freeSpot("ball", 5);
      if(bx > 0) lv.balls.push({ x:bx*TS+6, y:12*TS+8, w:20, h:20, vx:0, vy:0, spin:0, cool:0 });
    }
    if(!lv.bells.length && lv.enemies.length >= 2){
      var kx = freeSpot("bell", 4);
      if(kx > 0) lv.bells.push({ x:kx*TS+4, y:12*TS+2, w:24, h:26, used:false, t:0 });
    }
  }

  /* «Толпа на перемене»: досыпаем завучей на свободные куски земли */
  if(mod("crowd") && !mod("empty")){
    var crnd = mulberry(hashSeed(def.name + "crowd")), extra = 2 + Math.round(lv.enemies.length * 0.6), tries = 0;
    var occupied = function(cx, cy){
      var k, e;
      for(k=0;k<lv.enemies.length;k++){ e = lv.enemies[k]; if(Math.abs(e.x - cx*TS) < TS*3 && Math.abs(e.y - cy*TS) < TS*2) return true; }
      for(k=0;k<lv.spikes.length;k++) if(Math.abs(lv.spikes[k].x - cx*TS) < TS*2) return true;
      if(lv.door && Math.abs(lv.door.cx - cx*TS) < TS*3) return true;
      return Math.abs(lv.start.x - cx*TS) < TS*4;
    };
    while(extra > 0 && tries++ < 400){
      var cx = 4 + Math.floor(crnd()*(w-8)), cy = 0;
      for(cy=1; cy<lv.h-1; cy++){
        if(!isSolidChar(grid[cy][cx]) || grid[cy][cx] === "=") continue;
        if(isSolidChar(grid[cy-1][cx]) || isSolidChar(grid[cy-2] ? grid[cy-2][cx] : ".")) continue;
        if(occupied(cx, cy-1)) continue;
        lv.enemies.push(makeEnemy(cx*TS+3, (cy-1)*TS+4, false));
        extra--;
        break;
      }
    }
  }

  var ms = def.movers || [];
  for(i=0;i<ms.length;i++){
    var m = ms[i];
    lv.movers.push({ ox:m.tx*TS, oy:m.ty*TS, x:m.tx*TS, y:m.ty*TS,
      w:m.tw*TS, h:14, axis:m.axis, dist:m.dist*TS, speed:m.speed,
      t:m.phase||0, dx:0, dy:0, isMover:true });
  }
  return lv;
}

function makeEnemy(x, y, fly){
  return { x:x, y:y, w:fly?28:26, h:fly?18:28,
           vx: (fly ? 1.5*curDiff.fly : 0.85*curDiff.enemy) * (mod("fast") ? 1.4 : 1), vy:0,
           fly:fly, homeX:x, range: fly?999999:TS*curDiff.range, dead:false, deadT:0,
           dir:1, anim:0, hitWall:false };
}

/* ================== КОЛЛИЗИИ ================== */
function tileChar(cx, cy){
  var lv = G.level;
  if(cx < 0 || cx >= lv.w) return "#";           // невидимые стены по краям уровня
  if(cy < 0 || cy >= lv.h) return ".";           // сверху небо, снизу пропасть
  var ch = lv.grid[cy][cx];
  if(ch === "=" && lv.broke[cx + "," + cy] > 0) return ".";
  return ch;
}
function solidAt(cx, cy){ return isSolidChar(tileChar(cx, cy)); }
function solidAtPx(px, py){ return solidAt(Math.floor(px/TS), Math.floor(py/TS)); }

function collideTiles(e, axis){
  var x0 = Math.floor(e.x/TS), x1 = Math.floor((e.x+e.w-0.01)/TS);
  var y0 = Math.floor(e.y/TS), y1 = Math.floor((e.y+e.h-0.01)/TS);
  var cx, cy, hit = false;
  for(cy=y0; cy<=y1; cy++) for(cx=x0; cx<=x1; cx++){
    var ch = tileChar(cx,cy);
    if(!isSolidChar(ch)) continue;
    if(ch === "="){                              // доска: стоим сверху, снизу пролетаем насквозь
      if(axis === "x" || e.vy <= 0) continue;
      if(e.y + e.h - e.vy > cy*TS + 4) continue;
    }
    hit = true;
    if(axis === "x"){
      if(e.vx > 0) e.x = Math.min(e.x, cx*TS - e.w);
      else if(e.vx < 0) e.x = Math.max(e.x, (cx+1)*TS);
    } else {
      if(e.vy > 0){ e.y = Math.min(e.y, cy*TS - e.h); e.grounded = true; }
      else if(e.vy < 0) e.y = Math.max(e.y, (cy+1)*TS);
    }
  }
  if(hit){ if(axis === "x"){ e.vx = 0; e.hitWall = true; } else e.vy = 0; }
}

function collideMovers(e, axis){
  var ms = G.level.movers, i, m;
  for(i=0;i<ms.length;i++){
    m = ms[i];
    if(!overlap(e, m)) continue;
    if(axis === "x"){
      if(e.vx > 0) e.x = Math.min(e.x, m.x - e.w);
      else if(e.vx < 0) e.x = Math.max(e.x, m.x + m.w);
      e.vx = 0; e.hitWall = true;
    } else {
      if(e.vy > 0){ e.y = Math.min(e.y, m.y - e.h); e.grounded = true; e.standing = m; }
      else if(e.vy < 0) e.y = Math.max(e.y, m.y + m.h);
      e.vy = 0;
    }
  }
}

/* ================== ЧАСТИЦЫ ================== */
function puff(x, y, n, col, spd){
  for(var i=0;i<n;i++)
    G.parts.push({ x:x, y:y, vx:rnd(-spd,spd), vy:rnd(-spd,spd*0.4),
                   life:rnd(18,38), max:38, col:col, s:rnd(2,5), g:0.14 });
}

/* ================== ИГРОВОЙ ЦИКЛ / СОСТОЯНИЕ ================== */
function newGame(){
  return { state:"menu", levelIndex:0, level:null, player:null,
           mx:-999, my:-999, stateT:0, lastState:"", wipe:0, scoreShown:0,
           coins:0, coinsMax:0, deaths:0, timeLeft:timeLimit(),
           parts:[], shake:0, flash:0, banner:0, hintT:0, cam:0,
           hasKey:false, tick:0, penalty:0, buttons:[], pick:"normal",
           item:null, buff:{ soda:0, gum:0, pass:0 }, shield:false,
           combo:0, comboT:0, comboPts:0, bonusPts:0, allPies:0, toast:"", toastT:0, invul:0, freeze:0 };
}
function recKey(dk){ return dk + (curSrc === "seed" ? "_" + curSeed : ""); }
function syncSeedUrl(){
  try{
    localStorage.setItem("peremena_seed", curSeed);
    localStorage.setItem("peremena_src", curSrc);
  }catch(e){}
  try{ location.hash = (curSrc === "seed") ? ("s=" + curSeed) : "classic"; }catch(e){}
}
function applySource(){                 // пересобрать набор уровней под текущий выбор
  LEVELS = (curSrc === "seed") ? genLevels(curSeed) : CAMPAIGN;
  syncSeedUrl();
  if(G && G.state === "menu"){
    G.level = buildLevel(LEVELS[0]);
    G.coinsMax = 0;
    for(var i=0;i<LEVELS.length;i++) G.coinsMax += buildLevel(LEVELS[i]).coinTotal;
    G.cam = 0;
  }
}
function setSeed(sd, src){
  sd = cleanSeed(sd);
  if(!sd) return;
  curSeed = sd;
  curSrc = src || "seed";
  applySource();
}
window.addEventListener("hashchange", function(){
  var h = "";
  try{ h = (location.hash || "").replace(/^#/, ""); }catch(e){ return; }
  if(/^s=/i.test(h)){
    var sd = cleanSeed(h.slice(2));
    if(sd && (sd !== curSeed || curSrc !== "seed")) setSeed(sd, "seed");
  } else if(/^classic$/i.test(h) && curSrc !== "classic"){
    curSrc = "classic"; applySource();
  }
});
function startRun(mode, src){
  var st = G ? G.state : "menu";
  var wipe = 34;
  curDiff = DIFFS[mode] || DIFFS[(G && G.pick) || "normal"];
  if(src) curSrc = src;
  if(curDiff.endless) curSrc = "seed";           // бесконечный всегда по сиду
  LEVELS = (curSrc === "seed") ? genLevels(curSeed) : CAMPAIGN;
  syncSeedUrl();
  var pick = curDiff.key;
  G = newGame();
  G.pick = pick;
  try{ localStorage.setItem("peremena_mode", pick); }catch(e){}
  G.state = "play";
  G.coinsMax = 0;
  for(var i=0;i<LEVELS.length;i++) G.coinsMax += buildLevel(LEVELS[i]).coinTotal;
  if(curDiff.endless){
    G.erng = mulberry(hashSeed(curSeed + "endless"));
    G.floor = 1;
  }
  beginLevel(0);
  if(G.state !== "lesson") G.wipe = wipe;
  if(st === "menu") sfx.door();
}
function enterHub(){
  statSave();
  var keep = G ? G.pick : "normal";
  curDiff = DIFFS[keep] || DIFFS.normal;
  G = newGame();
  G.pick = keep;
  G.state = "hub";
  G.wipe = 30;
  G.level = buildLevel(HUB);
  G.hintT = 260;
  for(var i=0;i<LEVELS.length;i++) G.coinsMax += buildLevel(LEVELS[i]).coinTotal;
  spawnPlayer();
  G.cam = camTarget();
}
function hubNear(){
  var st = G.level.stands, p = G.player, i;
  if(!p) return null;
  for(i=0;i<st.length;i++)
    if(Math.abs((p.x + p.w/2) - (st[i].x + st[i].w/2)) < 34) return st[i];
  return null;
}
function hubUse(){
  var st = hubNear();
  if(!st) return;
  var info = STAND_INFO[st.kind];
  sfx.box();
  if(info.s === "start"){ startRun(G.pick); return; }
  G.back = "hub";
  G.state = info.s;
}
function beginLevel(i){
  loadLevel(i);
  if(mod("skipclass")){ G.state = "play"; return; }
  startLesson(i);
}
function loadLevel(i){
  G.levelIndex = i;
  G.level = buildLevel(LEVELS[i]);
  G.hasKey = false;
  G.hintT = 240;
  G.banner = 0;
  G.parts = [];
  spawnPlayer();
}
function spawnPlayer(){
  if(mod("startbag")) G.shield = true;
  var s = G.level.start;
  G.player = { x:s.x, y:s.y, w:20, h:28, vx:0, vy:0, dir:1, grounded:false,
               coyote:0, jumpBuf:0, anim:0, sqx:1, sqy:1, dead:false, deadT:0,
               standing:null, hitWall:false, spawnT:18, jumping:false, air:0 };
  G.cam = camTarget();
}
function camTarget(){
  var lv = G.level, p = G.player;
  var max = Math.max(0, lv.w*TS - VW);
  return clamp(p.x + p.w/2 - VW/2, 0, max);
}

function goOver(reason){
  G.state = "over"; G.overReason = reason;
  var sc = runScore();
  if(sc > STATS.best) STATS.best = sc;
  statSave();
}
function toast(msg){ G.toast = msg; G.toastT = 110; }
function useItem(){
  if(G.state !== "play" || !G.item || !G.player || G.player.dead) return;
  var k = G.item;
  G.item = null;
  stat("items");
  if(k === "watch"){ G.timeLeft += 20; G.flash = 14; toast("+20 секунд"); }
  else if(k === "bag"){ G.shield = true; toast("Портфель наготове"); }
  else { G.buff[k] = ITEMS[k].t; toast(ITEMS[k].n + " действует"); }
  puff(G.player.x+10, G.player.y+14, 14, ITEMS[k].c, 3);
  sfx.item();
}
function hurtPlayer(){                 // урон с учётом портфеля-щита
  if(G.invul > 0) return;
  if(G.shield){
    G.shield = false;
    G.flash = 10; G.shake = 8;
    G.invul = 80;                      // пара секунд, чтобы выбраться из шипов
    G.player.vy = -9; G.player.spawnT = 80;
    puff(G.player.x+10, G.player.y+14, 18, "#9b6bf0", 4);
    toast("Портфель принял удар");
    sfx.stomp();
    return;
  }
  killPlayer();
}
function killPlayer(silent){
  var p = G.player;
  if(p.dead) return;
  p.dead = true; p.deadT = 0; p.vy = -7; p.vx = 0;
  if(!silent){
    G.deaths++; stat("falls");       // рестарт по R не считается падением
    if(curDiff.deathCost){ G.timeLeft = Math.max(0, G.timeLeft - curDiff.deathCost); G.penalty = 75; }
  }
  G.shake = 14;
  puff(p.x+p.w/2, p.y+p.h/2, 22, "#ff6b6b", 4.5);
  if(!silent) sfx.hurt();
}

function updatePlayer(dt){
  var p = G.player, lv = G.level, i;

  if(p.dead){
    p.deadT++;
    p.vy = Math.min(p.vy + GRAV, MAXFALL);
    p.y += p.vy;
    if(p.deadT > 46){
      if(oneLife()){ goOver("dead"); sfx.fail(); }
      else spawnPlayer();
    }
    return;
  }
  if(p.spawnT > 0) p.spawnT--;

  /* едем на платформе */
  if(p.standing && p.standing.isMover){
    p.x += p.standing.dx;
    p.y += p.standing.dy;
  }
  p.standing = null;
  p.grounded = false;
  p.hitWall = false;

  var ix = (input.right?1:0) - (input.left?1:0);
  if(mod("mirror")) ix = -ix;
  var slip = mod("ice");
  var acc = slip ? 0.42 : 0.85;
  if(ix){ p.vx += acc*ix; p.dir = ix; }
  else { p.vx *= p.grounded && slip ? 0.975 : 0.80; if(Math.abs(p.vx) < 0.06) p.vx = 0; }
  p.vx = clamp(p.vx, -runMax(), runMax());

  p.vy = Math.min(p.vy + GRAV, MAXFALL);
  if(p.coyote > 0) p.coyote--;
  if(p.jumpBuf > 0) p.jumpBuf--;

  if(p.jumpBuf > 0 && p.coyote > 0){
    p.vy = jumpV(); p.jumpBuf = 0; p.coyote = 0; p.jumping = true;
    p.sqx = 0.78; p.sqy = 1.28;
    puff(p.x+p.w/2, p.y+p.h, 6, "#ffffff", 1.8);
    sfx.jump();
  } else if(p.jumpBuf > 0 && !p.grounded && p.air > 0 && canDouble()){
    p.vy = jumpV() * 0.92; p.jumpBuf = 0; p.air--; p.jumping = true;
    p.sqx = 0.8; p.sqy = 1.25;
    puff(p.x+p.w/2, p.y+p.h, 10, "#ff9ff3", 2.4);
    sfx.jump();
  }
  if(p.jumping && !input.jump && p.vy < -4.2){ p.vy = -4.2; p.jumping = false; }  // короткий прыжок

  /* движение + столкновения */
  p.x += p.vx; collideTiles(p,"x"); collideMovers(p,"x");
  var wasAir = !p.grounded;
  p.y += p.vy; collideTiles(p,"y"); collideMovers(p,"y");

  if(p.grounded){
    p.jumping = false;
    p.air = canDouble() ? 1 : 0;
    p.coyote = curDiff.coyote;
    if(p.sqy > 1){ p.sqx = 1.22; p.sqy = 0.8; puff(p.x+p.w/2, p.y+p.h, 5, "#ffffff", 1.6); }
  }
  p.sqx += (1 - p.sqx) * 0.18;
  p.sqy += (1 - p.sqy) * 0.18;
  p.anim += Math.abs(p.vx) * 0.22;

  if(mod("glass") && p.grounded){                      // «Стеклянные доски»
    var fy = Math.floor((p.y + p.h + 1)/TS), cc;
    for(cc = Math.floor((p.x+2)/TS); cc <= Math.floor((p.x+p.w-2)/TS); cc++){
      if(lv.grid[fy] && lv.grid[fy][cc] === "="){
        var kk = cc + "," + fy;
        if(!lv.crack[kk] && !lv.broke[kk]) lv.crack[kk] = 34;
      }
    }
  }

  /* батуты */
  for(i=0;i<lv.pads.length;i++){
    var pad = lv.pads[i];
    if(pad.t > 0) pad.t--;
    if(p.vy >= 0 && overlap(p, pad) && p.y + p.h <= pad.y + 14){
      p.y = pad.y - p.h; p.vy = PAD_V; p.coyote = 0; p.jumping = false; pad.t = 14;
      p.sqx = 0.7; p.sqy = 1.4;
      puff(pad.x+pad.w/2, pad.y, 10, "#7ef7c0", 3);
      sfx.pad();
    }
  }

  /* шипы */
  var body = { x:p.x+3, y:p.y+4, w:p.w-6, h:p.h-4 };
  if(G.invul <= 0)
    for(i=0;i<lv.spikes.length;i++) if(overlap(body, lv.spikes[i])){ hurtPlayer(); return; }

  /* падение в пропасть */
  if(p.y > lv.h*TS + 40){ killPlayer(); return; }

  /* пирожки */
  for(i=0;i<lv.coins.length;i++){
    var c = lv.coins[i];
    if(c.got) continue;
    c.ph += 0.09;
    if(mod("magnet")){                                  // «Магнит»: пирожки тянутся к игроку
      var dx = (p.x + p.w/2) - (c.x + 8), dy = (p.y + p.h/2) - (c.y + 8);
      var dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 120 && dist > 1){ c.x += dx/dist * 3.2; c.y += dy/dist * 3.2; }
    }
    if(overlap(p, c)){
      c.got = true; G.coins++; stat("pies"); stat("buns");
      G.combo = (G.comboT > 0) ? Math.min(5, G.combo + 1) : 1;
      G.comboT = 110;
      G.comboPts += 10 * (G.combo - 1);
      if(G.combo > 1) toast("×" + G.combo + " подряд");
      puff(c.x+8, c.y+8, 10, "#ffd166", 2.6);
      sfx.coin();
    }
  }
  /* шкафчики */
  for(i=0;i<lv.lockers.length;i++){
    var lk = lv.lockers[i];
    if(lk.open || G.item) continue;
    if(!overlap(p, lk)) continue;
    lk.open = true; lk.t = 16;
    lk.item = rollItem(mulberry(hashSeed(lv.name + "#" + Math.round(lk.x))));
    G.item = lk.item;
    toast(ITEMS[lk.item].n + " — " + ITEMS[lk.item].d);
    puff(lk.x+13, lk.y+14, 12, ITEMS[lk.item].c, 2.6);
    sfx.box();
  }
  /* ключ */
  if(lv.key && !lv.key.got){
    lv.key.ph += 0.08;
    if(overlap(p, lv.key)){
      lv.key.got = true; G.hasKey = true; G.flash = 12;
      puff(lv.key.x+8, lv.key.y+7, 16, "#ffe066", 3);
      sfx.key();
    }
  }
  /* враги */
  for(i=0;i<lv.enemies.length;i++){
    var en = lv.enemies[i];
    if(en.dead) continue;
    if(!overlap(body, en)) continue;
    if(G.buff.pass > 0 || G.invul > 0) continue;        // «Пропуск» и неуязвимость после удара
    if(!en.fly && !mod("nostomp") && p.vy > 1.2 && (p.y + p.h) - en.y < 18){
      en.dead = true; en.deadT = 0; stat("stomps");
      p.vy = -8.4; p.sqx = 1.2; p.sqy = 0.82;
      G.shake = 6;
      puff(en.x+en.w/2, en.y+en.h/2, 14, "#c8d6e5", 3);
      sfx.stomp();
    } else { hurtPlayer(); return; }
  }
  /* дверь */
  if(lv.doorHit && overlap(p, lv.doorHit) && doorOpen()){
    nextLevel();
  }
}

function coinsLeft(){
  var lv = G.level, n = 0, i;
  for(i=0;i<lv.coins.length;i++) if(!lv.coins[i].got) n++;
  return n;
}
function doorOpen(){
  if(G.level.needKey && !G.hasKey) return false;
  if(mod("hungry") && coinsLeft() > 0) return false;
  return true;
}
function updateBalls(){
  var lv = G.level, p = G.player, i, j, bl, en;
  for(i=0;i<lv.balls.length;i++){
    bl = lv.balls[i];
    if(bl.cool > 0) bl.cool--;
    bl.vy = Math.min(bl.vy + GRAV*0.8, 12);
    bl.grounded = false;
    bl.x += bl.vx; collideTiles(bl, "x");
    if(bl.hitWall){ bl.vx = -bl.vxPrev * 0.55; bl.hitWall = false; }
    bl.vxPrev = bl.vx;
    bl.y += bl.vy; collideTiles(bl, "y");
    if(bl.grounded){
      if(bl.vyPrev > 3.5) bl.vy = -bl.vyPrev * 0.42;   // отскок
      bl.vx *= 0.975;
      if(Math.abs(bl.vx) < 0.05) bl.vx = 0;
    }
    bl.vyPrev = bl.vy;
    bl.spin += bl.vx * 0.06;
    if(bl.y > lv.h*TS + 60){                            // укатился в яму — возвращаем
      bl.x = lv.start.x + 60; bl.y = lv.start.y; bl.vx = bl.vy = 0;
    }
    /* пинок игроком */
    if(p && !p.dead && bl.cool <= 0 && overlap(p, bl)){
      var dir = (p.x + p.w/2 < bl.x + bl.w/2) ? 1 : -1;
      bl.vx = dir * (4 + Math.abs(p.vx) * 1.3);
      bl.vy = -3.4;
      bl.cool = 8;
      puff(bl.x+10, bl.y+18, 5, "#ffffff", 1.6);
      tone(320, 0.07, "square", 0.05, 120);
    }
    /* мяч сбивает завуча */
    if(Math.abs(bl.vx) > 2.4){
      for(j=0;j<lv.enemies.length;j++){
        en = lv.enemies[j];
        if(en.dead || !overlap(bl, en)) continue;
        en.dead = true; en.deadT = 0; stat("stomps");
        G.bonusPts += 20;
        G.shake = 7;
        bl.vx *= -0.5;
        puff(en.x+13, en.y+14, 16, "#c8d6e5", 3.4);
        toast("ГОООЛ! +20");
        sfx.stomp();
      }
    }
  }
}
function ringBell(){
  var lv = G.level, p = G.player, i, bl;
  for(i=0;i<lv.bells.length;i++){
    bl = lv.bells[i];
    if(bl.used || !p) continue;
    if(Math.abs((p.x + p.w/2) - (bl.x + bl.w/2)) > 40) continue;
    bl.used = true; bl.t = 30;
    G.freeze = 260;
    G.flash = 10;
    toast("Ты нажал звонок! Все замерли");
    sfx.bell();
    return true;
  }
  return false;
}
function tickGlass(){
  var lv = G.level, k, parts;
  for(k in lv.crack){
    lv.crack[k]--;
    if(lv.crack[k] <= 0){
      delete lv.crack[k];
      lv.broke[k] = 220;
      parts = k.split(",");
      puff(+parts[0]*TS + 16, +parts[1]*TS + 7, 10, "#d6a15a", 2.6);
      tone(200, 0.1, "square", 0.05, -90);
    }
  }
  for(k in lv.broke){ lv.broke[k]--; if(lv.broke[k] <= 0) delete lv.broke[k]; }
}
function updateEnemies(){
  var lv = G.level, i;
  if(G.freeze > 0) G.freeze--;
  for(i=0;i<lv.enemies.length;i++){
    var e = lv.enemies[i];
    if(e.dead){ e.deadT++; continue; }
    if(G.freeze > 0) continue;                         // звонок: все замерли
    e.hitWall = false;
    e.anim += Math.abs(e.vx) * 0.2;
    e.dir = e.vx > 0 ? 1 : -1;

    e.x += e.vx; collideTiles(e,"x"); collideMovers(e,"x");
    if(!e.fly){
      e.vy = Math.min(e.vy + GRAV, MAXFALL);
      e.grounded = false;
      e.y += e.vy; collideTiles(e,"y"); collideMovers(e,"y");
      if(mod("jumpy") && e.grounded && (G.tick + i*37) % 130 === 0) e.vy = -7.6;
      var aheadX = e.dir > 0 ? e.x + e.w + 3 : e.x - 3;
      var noFloor = !solidAtPx(aheadX, e.y + e.h + 4);
      if(e.hitWall || noFloor || Math.abs(e.x - e.homeX) > e.range){
        e.vx = -e.vx;
        e.x += e.vx * 1.5;
      }
      if(e.y > lv.h*TS + 60) e.dead = true;
    } else {
      if(e.hitWall || Math.abs(e.x - e.homeX) > TS*7) { e.vx = -e.vx; e.x += e.vx*1.5; }
      e.y += Math.sin((G.tick + i*40) * 0.06) * 0.5;
    }
  }
}

function updateMovers(){
  var ms = G.level.movers, i;
  for(i=0;i<ms.length;i++){
    var m = ms[i];
    m.t += m.speed;
    var ph = (Math.sin(m.t) + 1) / 2;
    var nx = m.ox + (m.axis === "x" ? m.dist*ph : 0);
    var ny = m.oy + (m.axis === "y" ? m.dist*ph : 0);
    m.dx = nx - m.x; m.dy = ny - m.y;
    m.x = nx; m.y = ny;
  }
}

function updateParts(){
  for(var i=G.parts.length-1;i>=0;i--){
    var q = G.parts[i];
    q.x += q.vx; q.y += q.vy; q.vy += q.g; q.vx *= 0.98; q.life--;
    if(q.life <= 0) G.parts.splice(i,1);
  }
}

function endlessPush(){                           // дорисовываем этаж на лету
  var n = LEVELS.length;
  var idx = Math.min(6, 1 + Math.floor(n/3));
  var nm = GEN_NAMES[Math.floor(G.erng()*GEN_NAMES.length)] + " " + (n+1);
  LEVELS.push(genLevel(G.erng, idx, nm, G.erng() < 0.25));
  G.coinsMax += buildLevel(LEVELS[n]).coinTotal;
}
function nextLevel(){
  statSave();                         // копилка булок не должна теряться посреди забега
  if(coinsLeft() === 0 && G.level.coinTotal > 0){
    G.bonusPts += 50; G.allPies++; stat("clean");
    toast("Все пирожки на уровне! +50");
  }
  sfx.door();
  if(curDiff.endless){
    G.timeLeft += curDiff.bonus;
    G.floor = (G.floor || 1) + 1;
    toast("Этаж пройден! +" + curDiff.bonus + " сек");
    if(G.levelIndex + 1 >= LEVELS.length) endlessPush();
  }
  G.banner = 70;
  G.state = "clear";
}
function runPoints(){
  var done = (G.state === "win") ? LEVELS.length : G.levelIndex;
  return Math.max(0, done*100 + G.coins*10 + G.comboPts + G.bonusPts +
                     Math.floor(G.timeLeft)*2 - G.deaths*20);
}
function runScore(){ return Math.round(runPoints() * modMult()); }
function finishRun(){
  G.state = "win";
  sfx.win();
  stat("runs");
  if(curDiff.oneLife) stat("hardRuns");
  var used = curDiff.time - G.timeLeft;
  var best = bestScore(recKey(curDiff.key));
  var sc = runScore();
  if(sc > STATS.best) STATS.best = sc;
  statSave();
  if(!best || sc > (best.score || 0)){
    G.record = true;
    try{ localStorage.setItem("peremena_best_" + recKey(curDiff.key),
      JSON.stringify({ time:used, coins:G.coins, deaths:G.deaths, score:sc })); }catch(e){}
  }
  G.best = best;
}
function bestScore(key){
  try{ return JSON.parse(localStorage.getItem("peremena_best_" + key) || "null"); }catch(e){ return null; }
}

function update(dtSec){
  G.tick++;
  if(G.shake > 0) G.shake *= 0.88;
  if(G.flash > 0) G.flash--;
  if(G.hintT > 0) G.hintT--;
  if(G.hotT > 0) G.hotT--;
  if(G.state !== G.lastState){ G.lastState = G.state; G.stateT = 0; }
  G.stateT++;
  if(G.wipe > 0) G.wipe--;
  if(G.penalty > 0) G.penalty--;

  if(G.toastT > 0) G.toastT--;
  if(G.invul > 0) G.invul--;
  if(G.state === "play"){
    if(G.comboT > 0){ G.comboT--; if(!G.comboT) G.combo = 0; }
    if(G.buff.soda > 0) G.buff.soda--;
    if(G.buff.gum > 0) G.buff.gum--;
    if(G.buff.pass > 0) G.buff.pass--;
    tickGlass();
    updateBalls();
    G.timeLeft -= dtSec;
    if(G.timeLeft <= 0){
      G.timeLeft = 0; goOver("bell"); sfx.bell(); G.shake = 20;
    }
    updateMovers();
    updatePlayer(dtSec);
    updateEnemies();
    updateParts();
    G.cam += (camTarget() - G.cam) * 0.14;
  } else if(G.state === "lesson"){
    lessonUpdate();
    updateParts();
  } else if(G.state === "hub"){
    updateMovers();
    updatePlayer(dtSec);
    updateParts();
    G.cam += (camTarget() - G.cam) * 0.14;
  } else if(G.state === "clear"){
    updateMovers(); updateEnemies(); updateParts();
    G.banner--;
    if(G.banner <= 0){
      if(!curDiff.endless && G.levelIndex + 1 >= LEVELS.length){ finishRun(); }
      else beginLevel(G.levelIndex + 1);
    }
  } else {
    updateParts();
    if(G.state === "menu" || G.state === "mods" || G.state === "skins" ||
       G.state === "iteminfo" || G.state === "records") menuDrift();
  }
}

function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function text(str, x, y, size, col, align, weight){
  ctx.font = (weight||700) + " " + size + "px 'Segoe UI', system-ui, Arial, sans-serif";
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = col;
  ctx.fillText(str, x, y);
}
function shadowText(str, x, y, size, col, align){
  text(str, x+2, y+2, size, "rgba(0,0,0,.45)", align);
  text(str, x, y, size, col, align);
}

function hsh(i){ var x = Math.sin(i*127.1 + 11.3) * 43758.5453; return x - Math.floor(x); }
function bgLoop(cam, par, step, fn){        // ряд объектов с параллаксом
  var off = -cam*par, first = Math.floor(-off/step) - 1, i;
  for(i = first; i < first + Math.ceil(VW/step) + 3; i++) fn(i*step + off, i);
}
function poster(x, y, w, h, str, col){
  ctx.fillStyle = "rgba(255,255,255,.9)";
  rrect(x, y, w, h, 3); ctx.fill();
  ctx.fillStyle = col || "#c0392b";
  ctx.fillRect(x+4, y+4, w-8, 3);
  ctx.save();
  ctx.font = "700 9px 'Segoe UI', system-ui, Arial, sans-serif";
  ctx.textAlign = "center"; ctx.fillStyle = "#2b3850";
  var words = str.split(" "), line = "", lines = [], k;
  for(k=0;k<words.length;k++){
    var test = line ? line + " " + words[k] : words[k];
    if(ctx.measureText(test).width > w-8 && line){ lines.push(line); line = words[k]; }
    else line = test;
  }
  lines.push(line);
  for(k=0;k<lines.length && k<3;k++) ctx.fillText(lines[k], x+w/2, y+20+k*10);
  ctx.restore();
}

  for(var cy=0; cy<lv.h; cy++) for(var cx=c0; cx<=c1; cx++){
    var ch = lv.grid[cy][cx];
    if(!isSolidChar(ch)) continue;
    var x = cx*TS, y = cy*TS;
    var openTop = !(cy>0 && isSolidChar(lv.grid[cy-1][cx]));
    if(ch === "#"){
      ctx.fillStyle = th.ground; ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle = "rgba(0,0,0,.12)";
      ctx.fillRect(x, y+TS-6, TS, 6);
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.fillRect(x+3, y+3, TS-6, 4);
      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 1;
      ctx.strokeRect(x+0.5, y+0.5, TS-1, TS-1);
      if(openTop){
        ctx.fillStyle = th.cap; ctx.fillRect(x, y, TS, 9);
        ctx.fillStyle = th.cap2; ctx.fillRect(x, y, TS, 4);
        if(th.grass){
          ctx.fillStyle = th.cap;
          ctx.fillRect(x+4, y-4, 4, 5); ctx.fillRect(x+15, y-6, 4, 7); ctx.fillRect(x+25, y-3, 4, 4);
        } else {
          ctx.fillStyle = "rgba(0,0,0,.16)";
          ctx.fillRect(x + (cx % 2 ? 0 : TS/2), y+4, 2, 5);
        }
      }
    } else {
      var key = cx + "," + cy;
      if(lv.broke[key] > 0) continue;                 // доска рассыпалась
      var shake = lv.crack[key] ? Math.sin(G.tick*0.9) * 1.6 : 0;
      ctx.save();
      if(lv.crack[key]) ctx.globalAlpha = 0.55 + 0.45*Math.sin(G.tick*0.7);
      ctx.fillStyle = th.plank; ctx.fillRect(x, y + shake, TS, 14);
      ctx.fillStyle = th.plank2; ctx.fillRect(x, y + shake, TS, 5);
      ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(x, y+11 + shake, TS, 3);
      ctx.restore();
    }
  }
}

function drawEnemy(e){
  if(e.dead && e.deadT > 26) return;
  if(G.freeze > 0 && !e.dead){
    ctx.globalAlpha = 0.7 + 0.3*Math.sin(G.tick*0.2);
    text("!", e.x + e.w/2, e.y - 8, 16, "#9fd8ff", "center");
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(e.x + e.w/2, e.y + e.h/2);
  if(e.dead){ ctx.globalAlpha = Math.max(0, 1 - e.deadT/26); ctx.scale(1, 0.35); }
  if(e.fly){
    ctx.scale(e.dir, 1);
    ctx.fillStyle = "rgba(0,0,0,.12)";
    ctx.beginPath(); ctx.ellipse(0, 16, 12, 3, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#f3f6fb";
    ctx.beginPath(); ctx.moveTo(-14,-7); ctx.lineTo(14,0); ctx.lineTo(-14,7); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c9d5e5";
    ctx.beginPath(); ctx.moveTo(-14,7); ctx.lineTo(14,0); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#2b3b4e";
    ctx.beginPath(); ctx.arc(6,-1.5,1.6,0,6.2832); ctx.fill();
  } else {
    var wob = Math.sin(e.anim)*1.5, hy = -12 + wob*0.3;
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.beginPath(); ctx.ellipse(0, e.h/2-1, 12, 3.5, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#2b3850"; /* брюки */
    ctx.fillRect(-8, 6, 6, 9); ctx.fillRect(2, 6, 6, 9);
    ctx.fillStyle = "#1d2635";
    ctx.fillRect(-9, 13, 8, 3); ctx.fillRect(1, 13, 8, 3);
    ctx.fillStyle = "#56688c"; /* пиджак */
    rrect(-10, -5+wob*0.2, 20, 14, 5); ctx.fill();
    ctx.fillStyle = "#e9eef7"; /* рубашка */
    ctx.beginPath(); ctx.moveTo(-3,-5); ctx.lineTo(3,-5); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#d1443f"; /* галстук */
    ctx.beginPath(); ctx.moveTo(-1.6,-3); ctx.lineTo(1.6,-3); ctx.lineTo(0.8,5); ctx.lineTo(-0.8,5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f3cfa8"; /* голова */
    ctx.beginPath(); ctx.arc(0, hy, 9, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#8b7a63"; /* залысина */
    ctx.beginPath(); ctx.arc(0, hy-1.5, 9, Math.PI*1.08, Math.PI*1.92); ctx.fill();
    ctx.fillStyle = "#ffffff"; /* очки */
    ctx.beginPath(); ctx.arc(-3.6, hy+1, 3.2, 0, 6.2832); ctx.arc(3.6, hy+1, 3.2, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#39445c"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(-3.6, hy+1, 3.2, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.arc(3.6, hy+1, 3.2, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.4, hy+1); ctx.lineTo(0.4, hy+1); ctx.stroke();
    ctx.fillStyle = "#39445c";
    ctx.beginPath(); ctx.arc(-3.6+e.dir*1.2, hy+1, 1.4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(3.6+e.dir*1.2, hy+1, 1.4, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#a9724f"; ctx.lineWidth = 1.5; /* хмурый рот */
    ctx.beginPath(); ctx.arc(0, hy+9, 3.4, Math.PI+0.3, -0.3); ctx.stroke();
    ctx.fillStyle = "#e8eef7"; /* папка */
    ctx.save(); ctx.translate(e.dir*12, 1); ctx.rotate(e.dir*0.25);
    ctx.fillRect(-4, -7, 9, 13); ctx.fillStyle = "#b9c6d8"; ctx.fillRect(-4, -7, 9, 3);
    ctx.fillStyle = "#9fb0c6"; ctx.fillRect(-2.5, -2, 6, 1.2); ctx.fillRect(-2.5, 1, 6, 1.2);
    ctx.restore();
  }
  ctx.restore();
}

function drawPlayer(){
  var p = G.player;

    ctx.strokeStyle = "#b08bff"; ctx.lineWidth = 2.5;

  }
  if(G.buff.soda > 0 && Math.abs(p.vx) > 2 && G.tick % 3 === 0)
    G.parts.push({ x:p.x+6, y:p.y+18, vx:-p.vx*0.2, vy:rnd(-0.4,0.4), life:16, max:16,
                   col:"#ff6b6b", s:3, g:0.02 });

function drawCharacter(p, sk, alpha){
  if(typeof sk === "string") sk = { shirt:sk, hair:"#4a3524", acc:"none" };
  var shirt = sk.shirt;
  if(sk.ghost) alpha *= 0.72;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(p.x + p.w/2, p.y + p.h);
  ctx.scale(p.sqx, p.sqy);
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(0, 1, 11, 3.5, 0, 0, 6.2832); ctx.fill();

  var walk = p.grounded && Math.abs(p.vx) > 0.4 ? Math.sin(p.anim)*4 : 0;
  var air = !p.grounded;
  /* ноги */
  ctx.fillStyle = "#2f3e56";
  ctx.fillRect(-7, -9, 6, 9 + (air? -2 : 0) + walk*0.5);
  ctx.fillRect(1, -9, 6, 9 + (air? -2 : 0) - walk*0.5);
  ctx.fillStyle = "#e14b4b";
  ctx.fillRect(-8, -3 + (air?-2:0) + walk*0.5, 8, 4);
  ctx.fillRect(0, -3 + (air?-2:0) - walk*0.5, 8, 4);
  /* рюкзак */
  ctx.fillStyle = "#7a4ec4";
  rrect(-11*p.dir - (p.dir>0?0:0), -26, 8, 15, 3); ctx.fill();
  /* корпус */
  ctx.fillStyle = shirt;
  rrect(-9, -26, 18, 18, 5); ctx.fill();
  ctx.globalAlpha = alpha * 0.55;
  ctx.fillStyle = "#ffffff";
  rrect(-9, -26, 18, 6, 4); ctx.fill();
  ctx.globalAlpha = alpha;
  /* руки */
  ctx.fillStyle = "#f0c9a0";
  var armY = air ? -24 : -19 + walk*0.4;
  ctx.fillRect(-12, armY, 5, 8);
  ctx.fillRect(7, armY - (air?0:walk*0.8), 5, 8);
  /* голова */
  ctx.fillStyle = "#f6d3ac";
  ctx.beginPath(); ctx.arc(0, -33, 9, 0, 6.2832); ctx.fill();
  ctx.fillStyle = sk.hair || "#4a3524";
  ctx.beginPath(); ctx.arc(0, -35, 9, Math.PI*0.95, Math.PI*2.05); ctx.fill();
  ctx.fillRect(-9, -36, 18, 3);
  if(sk.acc === "cap"){                                   // кепка задом наперёд
    ctx.fillStyle = "#e0553f";
    ctx.beginPath(); ctx.arc(0, -37, 9.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-9.5, -38, 19, 4);
    ctx.fillStyle = "#c0392b"; ctx.fillRect(-13*p.dir, -38, 5, 4);
  } else if(sk.acc === "bow"){                            // бант
    ctx.fillStyle = "#ff6b9d";
    ctx.beginPath(); ctx.arc(-7, -40, 4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(1, -40, 4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#e0447d"; ctx.beginPath(); ctx.arc(-3, -40, 2, 0, 6.2832); ctx.fill();
  } else if(sk.acc === "glasses"){                        // очки
    ctx.strokeStyle = "#23303f"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(-3.5 + p.dir*1.5, -33, 3.6, 0, 6.2832);
    ctx.arc(4 + p.dir*1.5, -33, 3.6, 0, 6.2832);
    ctx.moveTo(0.1 + p.dir*1.5, -33); ctx.lineTo(0.4 + p.dir*1.5, -33);
    ctx.stroke();
  } else if(sk.acc === "whistle"){                        // свисток на шнурке
    ctx.strokeStyle = "#f0f4fa"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -28, 7, 0.2, Math.PI-0.2); ctx.stroke();
    ctx.fillStyle = "#ffd166"; rrect(-2, -22, 6, 4, 1.5); ctx.fill();
  } else if(sk.acc === "tie"){                            // галстук
    ctx.fillStyle = "#d1443f";
    ctx.beginPath();
    ctx.moveTo(-2, -26); ctx.lineTo(2, -26); ctx.lineTo(1, -14); ctx.lineTo(-1, -14);
    ctx.closePath(); ctx.fill();
  } else if(sk.acc === "ribbon"){                         // лента выпускника
    ctx.fillStyle = "#ffd166";
    ctx.save(); ctx.translate(0, -18); ctx.rotate(-0.5);
    ctx.fillRect(-4, -12, 7, 22); ctx.restore();
  }
  /* глаза */
  ctx.fillStyle = "#23303f";
  if(p.dead){
    ctx.lineWidth = 2; ctx.strokeStyle = "#23303f";
    ctx.beginPath();
    ctx.moveTo(-6,-35); ctx.lineTo(-1,-30); ctx.moveTo(-1,-35); ctx.lineTo(-6,-30);
    ctx.moveTo(2,-35); ctx.lineTo(7,-30); ctx.moveTo(7,-35); ctx.lineTo(2,-30);
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-3 + p.dir*2.5, -33, 1.8, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(3 + p.dir*2.5, -33, 1.8, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#c9765a"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(1 + p.dir*2, -29.5, 3.2, 0.2, Math.PI-0.2); ctx.stroke();
  }
  ctx.restore();
}

function drawParts(){
  for(var i=0;i<G.parts.length;i++){
    var q = G.parts[i];
    if(q.menu) continue;                       // их рисует фон меню
    ctx.globalAlpha = Math.max(0, q.life/q.max);
    ctx.fillStyle = q.col;
    ctx.fillRect(q.x, q.y, q.s, q.s);
  }

}

/* ================== ИНТЕРФЕЙС ================== */
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ":" + (s<10?"0":"") + s;
}
function drawPieIcon(x, y, s){

  ctx.fillStyle = "#f7c66b"; ctx.beginPath(); ctx.ellipse(-1,-2,9,6,0,0,6.2832); ctx.fill();

}
function drawBellIcon(x, y, s, col){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);

/* ---- кнопки прямо на канвасе: работают и мышью, и пальцем ---- */
function hovered(x, y, w, h){
  return !isTouch && G.mx >= x && G.mx <= x + w && G.my >= y && G.my <= y + h;
}
function gradText(str, x, y, size, c1, c2, align){
  var g = ctx.createLinearGradient(0, y - size, 0, y + size*0.3);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
  text(str, x, y, size, "rgba(0,0,0,.45)", align || "center");
  ctx.restore();
  text(str, x, y, size, g, align || "center");
}
function uiButton(id, x, y, w, h, label, sub, o){
  o = o || {};
  var hot = (G.hotBtn === id && G.hotT > 0);
  var sel = !!o.sel;
  var hov = hovered(x, y, w, h);
  var tint = o.selBorder || (sel ? "#8bffcf" : "#9fd8ff");
  var lift = hot ? -1 : (hov ? -2 : 0);
  var k = hot ? 0.975 : (hov ? 1.025 : 1);
  if(hov || sel) G.uiHover = true;

  ctx.save();
  ctx.translate(x + w/2, y + h/2 + lift);
  ctx.scale(k, k);
  ctx.translate(-w/2, -h/2);

  ctx.fillStyle = "rgba(0,0,0,.35)";
  rrect(2, 6, w, h, 15); ctx.fill();

  var g = ctx.createLinearGradient(0, 0, 0, h);
  if(sel){ g.addColorStop(0, "rgba(255,255,255,.34)"); g.addColorStop(1, "rgba(255,255,255,.14)"); }
  else if(hov){ g.addColorStop(0, "rgba(255,255,255,.26)"); g.addColorStop(1, "rgba(255,255,255,.1)"); }
  else { g.addColorStop(0, "rgba(255,255,255,.16)"); g.addColorStop(1, "rgba(255,255,255,.05)"); }
  ctx.fillStyle = g;
  rrect(0, 0, w, h, 15); ctx.fill();

  if(sel || hov){                                  // свечение по контуру
    ctx.save();
    ctx.shadowColor = tint; ctx.shadowBlur = sel ? 16 : 10;
    ctx.strokeStyle = tint; ctx.lineWidth = sel ? 2.4 : 1.8;
    rrect(0.5, 0.5, w-1, h-1, 15); ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1.4;
    rrect(0.5, 0.5, w-1, h-1, 15); ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,255,255,.22)";        // блик сверху
  rrect(6, 3, w-12, Math.min(12, h*0.3), 8); ctx.fill();
  if(sel){                                         // уголки-акценты
    ctx.strokeStyle = tint; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(9, 15); ctx.lineTo(9, 9); ctx.lineTo(15, 9);
    ctx.moveTo(w-15, h-9); ctx.lineTo(w-9, h-9); ctx.lineTo(w-9, h-15);
    ctx.stroke();
  }
  var fs = o.size || 22;
  text(label, w/2, h/2 + (sub ? -2 : fs*0.36) + 1, fs, "rgba(0,0,0,.4)", "center");
  text(label, w/2, h/2 + (sub ? -2 : fs*0.36), fs, o.col || "#ffffff", "center");
  if(sub) text(sub, w/2, h/2 + 22, 13, "rgba(226,238,255,.82)", "center", 600);
  ctx.restore();
  G.buttons.push({ id:id, x:x, y:y, w:w, h:h });
}
function iconBtn(id, x, y, s, kind){
  var hot = (G.hotBtn === id && G.hotT > 0);
  ctx.save();
  ctx.fillStyle = hot ? "rgba(255,255,255,.4)" : "rgba(9,16,32,.55)";
  rrect(x, y, s, s, 13); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5;
  rrect(x, y, s, s, 13); ctx.stroke();
  ctx.translate(x + s/2, y + s/2);
  ctx.fillStyle = "#eaf6ff";
  if(kind === "pause"){
    if(G.state === "paused"){ ctx.beginPath(); ctx.moveTo(-5,-8); ctx.lineTo(9,0); ctx.lineTo(-5,8); ctx.closePath(); ctx.fill(); }
    else { ctx.fillRect(-7,-8,5,16); ctx.fillRect(2,-8,5,16); }
  } else if(kind === "full"){
    ctx.strokeStyle = "#eaf6ff"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    var q = isFullscreen() ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(-9*q, -3*q); ctx.lineTo(-9*q, -9*q); ctx.lineTo(-3*q, -9*q);
    ctx.moveTo(9*q, -3*q); ctx.lineTo(9*q, -9*q); ctx.lineTo(3*q, -9*q);
    ctx.moveTo(-9*q, 3*q); ctx.lineTo(-9*q, 9*q); ctx.lineTo(-3*q, 9*q);
    ctx.moveTo(9*q, 3*q); ctx.lineTo(9*q, 9*q); ctx.lineTo(3*q, 9*q);
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-8,-4); ctx.lineTo(-3,-4); ctx.lineTo(3,-9); ctx.lineTo(3,9); ctx.lineTo(-3,4); ctx.lineTo(-8,4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#eaf6ff"; ctx.lineWidth = 2; ctx.lineCap = "round";
    if(muted){ ctx.beginPath(); ctx.moveTo(6,-5); ctx.lineTo(12,5); ctx.moveTo(12,-5); ctx.lineTo(6,5); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(4,0,7,-0.9,0.9); ctx.stroke(); }
  }
  ctx.restore();
  G.buttons.push({ id:id, x:x, y:y, w:s, h:s });
}

function drawToast(){
  if(G.toastT <= 0 || !G.toast) return;

  ctx.font = "700 15px 'Segoe UI', system-ui, Arial, sans-serif";
  var w = ctx.measureText(G.toast).width + 34;

}

function drawWipe(){
  if(G.wipe <= 0) return;
  var wk = G.wipe / 34;
  ctx.fillStyle = "#070d1a";
  ctx.fillRect(0, 0, VW, VH * wk);
  ctx.fillRect(0, VH - VH * wk, VW, VH * wk);
  ctx.fillStyle = "rgba(159,216,255,.5)";
  ctx.fillRect(0, VH * wk - 2, VW, 2);
  ctx.fillRect(0, VH - VH * wk, VW, 2);
}
function drawVignette(){
  var g = ctx.createRadialGradient(VW/2, VH/2, VH*0.45, VW/2, VH/2, VH*0.95);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(4,8,18,.45)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen(){
  try{
    if(isFullscreen()){
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      var el = document.documentElement;
      if(el.requestFullscreen) el.requestFullscreen();
      else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  }catch(e){}
}
function drawCursor(){
  if(isTouch) return;
  var want = G.uiHover ? "pointer" : "default";
  if(cv.style.cursor !== want) cv.style.cursor = want;
}
function menuDrift(){                                  // фон меню живёт сам по себе
  if(!G.level) return;
  var max = Math.max(1, G.level.w*TS - VW);
  G.cam = (G.cam + 0.32) % max;
  var i, q;
  for(i=G.parts.length; i<26; i++)
    G.parts.push({ x:rnd(0,VW), y:rnd(0,VH), vx:rnd(-0.12,0.12), vy:rnd(-0.5,-0.18),
                   life:9999, max:9999, col:"#ffd98a", s:rnd(2,4), g:0, menu:true });
  for(i=0;i<G.parts.length;i++){
    q = G.parts[i];
    if(!q.menu) continue;
    q.x += q.vx; q.y += q.vy;
    if(q.y < -10){ q.y = VH + 8; q.x = rnd(0, VW); }
  }
}
function drawMenuGlow(){
  var i, q;
  ctx.save();
  for(i=0;i<G.parts.length;i++){
    q = G.parts[i];
    if(!q.menu) continue;
    ctx.globalAlpha = 0.25 + 0.2*Math.sin(G.tick*0.04 + i);

  ctx.restore();
}

function drawHUD(){
  ctx.save();
  ctx.fillStyle = "rgba(9,16,32,.52)";
  rrect(10, 10, VW-20, 40, 12); ctx.fill();

  var full = Math.max(1, timeLimit());
  var frac = clamp(G.timeLeft / full, 0, 1);
  var low = G.timeLeft < (curDiff.key === "hard" ? 60 : 120);
  var col = low ? (G.tick%30 < 15 ? "#ff8080" : "#ffd0d0") : "#eaf6ff";
  ctx.fillStyle = "rgba(255,255,255,.1)";
  rrect(22, 36, 200, 7, 4); ctx.fill();
  var bar = ctx.createLinearGradient(22, 0, 222, 0);
  bar.addColorStop(0, low ? "#ff6b6b" : "#8bffcf");
  bar.addColorStop(1, low ? "#ffb08a" : "#9fd8ff");
  ctx.fillStyle = bar;
  rrect(22, 36, Math.max(6, 200*frac), 7, 4); ctx.fill();
  drawBellIcon(36, 24, 0.8, col);
  text(fmtTime(G.timeLeft), 54, 32, 21, col);
  text("до звонка", 140, 31, 11, "rgba(220,235,255,.65)", "left", 600);
  if(G.penalty > 0){
    ctx.globalAlpha = Math.min(1, G.penalty/40);
    text("−" + curDiff.deathCost + " сек", 62, 70, 20, "#ff8a8a", "left");
    ctx.globalAlpha = 1;
  }

  text(LEVELS[G.levelIndex].name, VW/2, 28, 17, "#ffffff", "center");
  if(curDiff.endless){
    text("этаж " + (G.floor || 1), VW/2, 45, 12, "#c9a0ff", "center", 700);
  } else {
  var dots = LEVELS.length, dw = 10, dx = VW/2 - (dots*dw)/2, di;
  for(di=0; di<dots; di++){
    ctx.fillStyle = di < G.levelIndex ? "#8bffcf" : (di === G.levelIndex ? "#ffd166" : "rgba(255,255,255,.22)");
    ctx.beginPath(); ctx.arc(dx + di*dw + 4, 39, di === G.levelIndex ? 3.6 : 2.6, 0, 6.2832); ctx.fill();
  }
  }

  if(G.coins !== G.coinsLast){ G.coinsLast = G.coins; G.coinPop = 12; }
  if(G.coinPop > 0) G.coinPop--;
  var pop = 1 + (G.coinPop > 0 ? G.coinPop/40 : 0);
  drawPieIcon(VW-152, 28, 0.85 * pop);
  ctx.save();
  ctx.translate(VW-134, 34); ctx.scale(pop, pop); ctx.translate(-(VW-134), -34);
  text(G.coins + " / " + G.coinsMax, VW-134, 34, 19, G.coinPop > 0 ? "#ffffff" : "#ffd98a");
  ctx.restore();
  var info = curDiff.name + (modCount() ? "  ×" + modMult().toFixed(2) : "") +
             (curSrc === "seed" ? "  сид " + curSeed : "") +
             (G.deaths ? "  падений " + G.deaths : "");
  text(info, VW-24, 46, 10.5,
       curDiff.key === "hard" ? "rgba(255,190,190,.8)" : "rgba(220,235,255,.6)", "right", 600);
  ctx.restore();

  if(G.state === "play" || G.state === "clear" || G.state === "paused") drawSlot();
  drawToast();
  if(G.state === "play" || G.state === "paused" || G.state === "clear"){
    var s = isTouch ? 54 : 44;
    iconBtn("pause", VW - s - 14, 58, s, "pause");
    iconBtn("sound", VW - s*2 - 24, 58, s, "sound");
  }

  if(G.hintT > 0 && G.state === "play"){
    ctx.save();
    ctx.globalAlpha = Math.min(1, G.hintT/50);
    ctx.fillStyle = "rgba(9,16,32,.6)";
    var t = G.level.hint;
    ctx.font = "600 14px 'Segoe UI', system-ui, Arial, sans-serif";
    var w = ctx.measureText(t).width + 28;
    rrect(VW/2 - w/2, VH-56, w, 30, 10); ctx.fill();
    text(t, VW/2, VH-36, 14, "#dbeaff", "center", 600);
    ctx.restore();
  }
}

function uiEase(){                                  // плавное появление экрана
  var t = Math.min(1, (G.stateT || 0) / 11);
  return 1 - Math.pow(1 - t, 3);
}
function panel(w, h, accent){
  var e = uiEase();
  var x = VW/2 - w/2, y = VH/2 - h/2 + (1 - e) * 16;
  ctx.save();
  ctx.globalAlpha = e;
  ctx.translate(VW/2, VH/2);
  ctx.scale(0.97 + 0.03*e, 0.97 + 0.03*e);
  ctx.translate(-VW/2, -VH/2);

  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  ctx.fillStyle = "rgba(8,14,28,.9)";
  rrect(x, y, w, h, 24); ctx.fill();
  ctx.restore();

  var g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, "rgba(90,130,190,.22)");
  g.addColorStop(0.45, "rgba(20,32,56,.12)");
  g.addColorStop(1, "rgba(8,14,28,.28)");
  ctx.fillStyle = g; rrect(x, y, w, h, 24); ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1.5;
  rrect(x+0.5, y+0.5, w-1, h-1, 24); ctx.stroke();

  var line = ctx.createLinearGradient(x, y, x + w, y);   // светящаяся полоса сверху
  line.addColorStop(0, "rgba(255,255,255,0)");
  line.addColorStop(0.5, accent || "rgba(159,216,255,.85)");
  line.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = line; ctx.fillRect(x + 28, y + 1, w - 56, 2);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function modCell(m, x, y, w, h){
  var on = mod(m.k), hot = (G.hotBtn === "mod_" + m.k && G.hotT > 0);
  var hv = hovered(x, y, w, h);
  if(hv) G.uiHover = true;
  var tint = m.m > 0 ? "#ffb98a" : "#8bffcf";
  ctx.fillStyle = hot ? "rgba(255,255,255,.3)"
                      : (on ? "rgba(255,255,255,.16)" : (hv ? "rgba(255,255,255,.12)" : "rgba(255,255,255,.06)"));
  rrect(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = on ? tint : "rgba(255,255,255,.18)";
  ctx.lineWidth = on ? 2.4 : 1.4;
  rrect(x, y, w, h, 12); ctx.stroke();
  ctx.fillStyle = on ? tint : "rgba(255,255,255,.12)";
  rrect(x+11, y+h/2-10, 20, 20, 6); ctx.fill();
  if(on){
    ctx.strokeStyle = "#14202c"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x+16, y+h/2); ctx.lineTo(x+20, y+h/2+4); ctx.lineTo(x+27, y+h/2-5);
    ctx.stroke();
  }
  text(m.n, x+42, y+h/2-2, 14, on ? "#ffffff" : "rgba(230,240,255,.8)", "left", 700);
  text(m.d, x+42, y+h/2+12, 10.5, "rgba(200,220,255,.55)", "left", 600);
  text((m.m > 0 ? "+" : "") + m.m + "%", x+w-12, y+h/2+5, 14, tint, "right", 700);
  G.buttons.push({ id:"mod_" + m.k, x:x, y:y, w:w, h:h });
}

function modList(kind){
  var out = [], i, g;
  for(i=0;i<MODS.length;i++){
    g = MODS[i].grp || (MODS[i].m > 0 ? "hard" : "easy");
    if(g === kind) out.push(MODS[i]);
  }
  return out;
}
function modCountOf(kind){
  var list = modList(kind), n = 0, i;
  for(i=0;i<list.length;i++) if(mod(list[i].k)) n++;
  return n;
}
function drawMods(){
  ctx.fillStyle = "rgba(4,10,22,.78)"; ctx.fillRect(0,0,VW,VH);
  panel(780, 468);
  gradText("МОДИФИКАТОРЫ", VW/2, 34, 24, "#fff3c4", "#f0a83a");
  text("ОЧКИ × " + modMult().toFixed(2) +
       (modCount() ? "   ·   включено " + modCount() + " из " + MODS.length : "   ·   ничего не включено"),

function drawTeacher(x, y, mood){
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.ellipse(0, 4, 20, 5, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#3a4a63";                     // юбка/брюки
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.lineTo(9, -34); ctx.lineTo(-9, -34); ctx.closePath(); ctx.fill();
  ctx.fillStyle = mood === "watch" ? "#8c5a6b" : "#6d7fa0";
  rrect(-13, -60, 26, 28, 7); ctx.fill();
  ctx.fillStyle = "#f3cfa8";                     // голова
  ctx.beginPath(); ctx.arc(0, -72, 12, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#8b7a63";
  ctx.beginPath(); ctx.arc(0, -75, 12.5, Math.PI*0.95, Math.PI*2.05); ctx.fill();
  if(mood === "away"){
    ctx.fillStyle = "#6f6152";                   // затылок: пучок
    ctx.beginPath(); ctx.arc(0, -78, 8, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#f3cfa8"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(10, -52); ctx.lineTo(24, -64); ctx.stroke();   // рука у доски
  } else {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-4.5, -73, 4, 0, 6.2832); ctx.arc(4.5, -73, 4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = mood === "watch" ? "#e04a4a" : "#39445c";
    ctx.beginPath(); ctx.arc(-4.5, -73, 2, 0, 6.2832); ctx.arc(4.5, -73, 2, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#39445c"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(-4.5,-73,4.4,0,6.2832); ctx.moveTo(8.9,-73); ctx.arc(4.5,-73,4.4,0,6.2832); ctx.stroke();
    ctx.strokeStyle = "#a9724f"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, -63, 4, Math.PI+0.3, -0.3); ctx.stroke();
  }
  ctx.restore();
}

    text(L.ok ? "+15 секунд к перемене   ·   +100 очков" : "−10 секунд от перемены",

  text("собранные пирожки — это булки на скины", VW/2, 46, 11, "rgba(220,235,255,.65)", "center", 600);
  if(G.state === "hub") uiButton("back", VW-158, 12, 146, 40, "В МЕНЮ", null, { size:14 });
  if(G.hintT > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, G.hintT/60);
    text(G.level.hint, VW/2, VH-40, 14, "#dbeaff", "center", 600);

  }
}

function drawSkins(){
  ctx.fillStyle = "rgba(4,10,22,.78)"; ctx.fillRect(0,0,VW,VH);
  panel(780, 450);
  gradText("СКИНЫ", VW/2, 44, 26, "#ffe3fb", "#e86bd0");
  drawBun(VW/2 - 58, 63, 0.8);
  text(STATS.buns + " булок", VW/2 - 42, 70, 16, "#ffd98a", "left");
  var i, sk, cx, cy, on, has;
  for(i=0;i<SKINS.length;i++){
    sk = SKINS[i];
    cx = 30 + (i % 3) * 248;
    cy = 86 + Math.floor(i/3) * 110;
    on = (curSkin === sk.k); has = owns(sk.k);
    var hv = hovered(cx, cy, 236, 104);
    if(hv) G.uiHover = true;
    ctx.fillStyle = on ? "rgba(139,255,207,.16)"
                       : (hv ? "rgba(255,255,255,.18)" : (has ? "rgba(255,255,255,.1)" : "rgba(255,255,255,.05)"));
    rrect(cx, cy, 236, 104, 12); ctx.fill();
    ctx.strokeStyle = on ? "#8bffcf" : (has ? "rgba(159,216,255,.5)" : "rgba(255,255,255,.16)");
    ctx.lineWidth = on ? 2.6 : 1.4;
    rrect(cx, cy, 236, 104, 12); ctx.stroke();
    ctx.save();
    if(!has) ctx.globalAlpha = 0.45;
    drawCharacter({ x:cx+20, y:cy+36, w:20, h:28, dir:1, grounded:true, vx:0,
                    anim:0, sqx:1, sqy:1, dead:false }, sk, 1);
    ctx.restore();
    text(sk.n, cx+66, cy+34, 15, has ? "#ffffff" : "rgba(230,240,255,.7)", "left", 700);
    text(sk.d, cx+66, cy+52, 10.5, "rgba(200,220,255,.55)", "left", 600);
    if(on) text("НАДЕТ", cx+66, cy+78, 14, "#8bffcf", "left", 700);
    else if(has) text("нажми, чтобы надеть", cx+66, cy+78, 12, "#9fd8ff", "left", 600);
    else {
      drawBun(cx+74, cy+72, 0.6);
      text(sk.price + "", cx+88, cy+78, 14,
           STATS.buns >= sk.price ? "#ffd98a" : "rgba(255,150,150,.8)", "left", 700);
    }
    G.buttons.push({ id:"skin_" + sk.k, x:cx, y:cy, w:236, h:104 });
  }
  uiButton("back", 315, 424, 170, 36, "НАЗАД", null, { size:14, sel:true });
}

function drawRecords(){
  ctx.fillStyle = "rgba(4,10,22,.78)"; ctx.fillRect(0,0,VW,VH);

    ["Забегов до конца", STATS.runs],
    ["Из них хардкор", STATS.hardRuns],
    ["Пирожков собрано", STATS.pies],

  for(i=0;i<modes.length;i++){

  }

  text("Скинов куплено: " + STATS.owned.length + " из " + SKINS.length, 430, 304, 13, "#ff9ff3", "left", 700);
  uiButton("back", 320, 388, 170, 36, "НАЗАД", null, { size:14, sel:true });
