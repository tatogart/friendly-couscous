  else if(th.deco === "canteen") decoCanteen(cam, th);
  else if(th.deco === "gym") decoGym(cam, th);
  else if(th.deco === "library") decoLibrary(cam, th);
  else if(th.deco === "boiler") decoBoiler(cam, th);
  else decoRoof(cam, th);
  if(th.deco === "yard" || th.deco === "roof") dayTint();
}

/* За окном то же время, что и у игрока: утро греет, вечер золотит, ночь синит. */
function dayTint(){
  var h = new Date().getHours(), col = null;
  if(h >= 5 && h < 9) col = "rgba(255,196,120,.16)";
  else if(h >= 17 && h < 20) col = "rgba(255,150,80,.2)";
  else if(h >= 20 || h < 5) col = "rgba(20,32,80,.42)";
  if(!col) return;
  ctx.fillStyle = col;
  ctx.fillRect(0, 0, VW, VH);
}

/* Плитки уровня статичны: рисуем их один раз на отдельный холст и потом
   копируем нужный кусок одним вызовом вместо сотен прямоугольников.
   Под модификатором «Стеклянные доски» плитки живые — там старый путь. */
var tileCv = null, tileKey = 0;
function tileCacheBuild(){
  var lv = G.level;
  if(!tileCv) tileCv = document.createElement("canvas");
  tileCv.width = lv.w * TS; tileCv.height = lv.h * TS;
  var real = ctx;
  ctx = tileCv.getContext("2d");
  ctx.clearRect(0, 0, tileCv.width, tileCv.height);
  drawTilesLive(0, lv.w * TS);
  ctx = real;
  tileKey = lv.uid;
}
function dropTileCache(){ tileKey = 0; }
function drawTiles(cam){
  var lv = G.level;
  if(mod("glass")){ drawTilesLive(cam, VW); return; }
  if(tileKey !== lv.uid) tileCacheBuild();
  var sx = Math.max(0, Math.floor(cam) - TS);
  var w = Math.min(tileCv.width - sx, VW + TS*2);
  if(w > 0) ctx.drawImage(tileCv, sx, 0, w, tileCv.height, sx, 0, w, tileCv.height);
}
function drawTilesLive(cam, span){
  var lv = G.level, th = lv.theme;
  var c0 = Math.max(0, Math.floor(cam/TS)-1), c1 = Math.min(lv.w-1, Math.ceil((cam+(span||VW))/TS));
  for(var cy=0; cy<lv.h; cy++) for(var cx=c0; cx<=c1; cx++){
    var ch = lv.grid[cy][cx];
    if(!isSolidChar(ch)) continue;
    var x = cx*TS, y = cy*TS;
    var openTop = !(cy>0 && isSolidChar(lv.grid[cy-1][cx]));
    if(ch === "#"){
      ctx.fillStyle = th.ground; ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle = "rgba(0,0,0,.12)";
      ctx.fillRect(x, y+TS-6, TS, 6);
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.fillRect(x+3, y+3, TS-6, 4);
      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 1;
      ctx.strokeRect(x+0.5, y+0.5, TS-1, TS-1);
      if(openTop){
        ctx.fillStyle = th.cap; ctx.fillRect(x, y, TS, 9);
        ctx.fillStyle = th.cap2; ctx.fillRect(x, y, TS, 4);
        if(th.grass){
          ctx.fillStyle = th.cap;
          ctx.fillRect(x+4, y-4, 4, 5); ctx.fillRect(x+15, y-6, 4, 7); ctx.fillRect(x+25, y-3, 4, 4);
        } else {
          ctx.fillStyle = "rgba(0,0,0,.16)";
          ctx.fillRect(x + (cx % 2 ? 0 : TS/2), y+4, 2, 5);
        }
      }
    } else {
      var key = cx + "," + cy;
      if(lv.broke[key] > 0) continue;                 // доска рассыпалась
      var shake = lv.crack[key] ? Math.sin(G.tick*0.9) * 1.6 : 0;
      ctx.save();
      if(lv.crack[key]) ctx.globalAlpha = 0.55 + 0.45*Math.sin(G.tick*0.7);
      ctx.fillStyle = th.plank; ctx.fillRect(x, y + shake, TS, 14);
      ctx.fillStyle = th.plank2; ctx.fillRect(x, y + shake, TS, 5);
      ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(x, y+11 + shake, TS, 3);
      ctx.restore();
    }
  }
}

    } else if(s2.kind === "M"){
      ctx.fillStyle = "#ffb98a"; rrect(-11, -8, 22, 18, 3); ctx.fill();
      ctx.fillStyle = "#7a4a2a"; ctx.fillRect(-7, -4, 14, 2); ctx.fillRect(-7, 0, 14, 2); ctx.fillRect(-7, 4, 9, 2);
    } else if(s2.kind === "P"){                       /* профиль: карточка с портретом */
      ctx.fillStyle = "#e8eef7"; rrect(-12, -11, 24, 22, 3); ctx.fill();
      ctx.fillStyle = "#9fd8ff"; ctx.beginPath(); ctx.arc(-4, -3, 4.2, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-10, 8); ctx.quadraticCurveTo(-4, 1, 2, 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#c9d5e5"; ctx.fillRect(5, -6, 6, 2); ctx.fillRect(5, -2, 6, 2); ctx.fillRect(5, 2, 4, 2);

      ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(5, 2, 2.5, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
    text(info.n, s2.x+22, s2.y-12, 11, hot ? "#ffffff" : "rgba(220,235,255,.75)", "center", 700);
    if(hot){
      ctx.globalAlpha = 0.65 + 0.35*Math.sin(G.tick*0.12);
      text(isTouch ? "жми «ПРЕДМЕТ»" : "E — открыть", s2.x+22, s2.y+90, 12, info.c, "center", 700);
      ctx.globalAlpha = 1;
    }
  }
}

function drawEnemy(e){
  if(e.dead && e.deadT > 26) return;
  if(G.freeze > 0 && !e.dead){
    ctx.globalAlpha = 0.7 + 0.3*Math.sin(G.tick*0.2);
    text("!", e.x + e.w/2, e.y - 8, 16, "#9fd8ff", "center");
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(e.x + e.w/2, e.y + e.h/2);
  if(e.dead){ ctx.globalAlpha = Math.max(0, 1 - e.deadT/26); ctx.scale(1, 0.35); }
  if(e.fly){
    ctx.scale(e.dir, 1);
    ctx.fillStyle = "rgba(0,0,0,.12)";
    ctx.beginPath(); ctx.ellipse(0, 16, 12, 3, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#f3f6fb";
    ctx.beginPath(); ctx.moveTo(-14,-7); ctx.lineTo(14,0); ctx.lineTo(-14,7); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c9d5e5";
    ctx.beginPath(); ctx.moveTo(-14,7); ctx.lineTo(14,0); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#2b3b4e";
    ctx.beginPath(); ctx.arc(6,-1.5,1.6,0,6.2832); ctx.fill();
  } else {
    var wob = Math.sin(e.anim)*1.5, hy = -12 + wob*0.3;
    var suit = e.kind === "guard" ? "#3f5a46" : (e.kind === "throw" ? "#6b5480" : "#56688c");
    var doze = e.kind === "sleep" && !e.wake;
    if(doze) wob = Math.sin(G.tick*0.05)*0.8;
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.beginPath(); ctx.ellipse(0, e.h/2-1, 12, 3.5, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#2b3850"; /* брюки */
    ctx.fillRect(-8, 6, 6, 9); ctx.fillRect(2, 6, 6, 9);
    ctx.fillStyle = "#1d2635";
    ctx.fillRect(-9, 13, 8, 3); ctx.fillRect(1, 13, 8, 3);
    ctx.fillStyle = suit; /* пиджак */
    rrect(-10, -5+wob*0.2, 20, 14, 5); ctx.fill();
    ctx.fillStyle = "#e9eef7"; /* рубашка */
    ctx.beginPath(); ctx.moveTo(-3,-5); ctx.lineTo(3,-5); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#d1443f"; /* галстук */
    ctx.beginPath(); ctx.moveTo(-1.6,-3); ctx.lineTo(1.6,-3); ctx.lineTo(0.8,5); ctx.lineTo(-0.8,5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f3cfa8"; /* голова */
    ctx.beginPath(); ctx.arc(0, hy, 9, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#8b7a63"; /* залысина */
    ctx.beginPath(); ctx.arc(0, hy-1.5, 9, Math.PI*1.08, Math.PI*1.92); ctx.fill();
    ctx.fillStyle = "#ffffff"; /* очки */
    ctx.beginPath(); ctx.arc(-3.6, hy+1, 3.2, 0, 6.2832); ctx.arc(3.6, hy+1, 3.2, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#39445c"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(-3.6, hy+1, 3.2, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.arc(3.6, hy+1, 3.2, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.4, hy+1); ctx.lineTo(0.4, hy+1); ctx.stroke();
    ctx.fillStyle = "#39445c";
    ctx.beginPath(); ctx.arc(-3.6+e.dir*1.2, hy+1, 1.4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(3.6+e.dir*1.2, hy+1, 1.4, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#a9724f"; ctx.lineWidth = 1.5; /* хмурый рот */
    ctx.beginPath(); ctx.arc(0, hy+9, 3.4, Math.PI+0.3, -0.3); ctx.stroke();
    ctx.fillStyle = "#e8eef7"; /* папка */
    ctx.save(); ctx.translate(e.dir*12, 1); ctx.rotate(e.dir*0.25);
    ctx.fillRect(-4, -7, 9, 13); ctx.fillStyle = "#b9c6d8"; ctx.fillRect(-4, -7, 9, 3);
    ctx.fillStyle = "#9fb0c6"; ctx.fillRect(-2.5, -2, 6, 1.2); ctx.fillRect(-2.5, 1, 6, 1.2);
    ctx.restore();

    if(e.kind === "guard"){                       /* каска: на голову не прыгнуть */
      ctx.fillStyle = "#e0a63c";
      ctx.beginPath(); ctx.arc(0, hy-1, 10.5, Math.PI, 0); ctx.fill();
      ctx.fillRect(-11.5, hy-1.5, 23, 3);
      ctx.fillStyle = "#b9832a"; ctx.fillRect(-1.6, hy-11, 3.2, 9);
      ctx.fillStyle = "#2b3850";                  /* рация на плече */
      rrect(-e.dir*12 - 2, -6, 4, 8, 1.5); ctx.fill();
    }
    if(doze){                                     /* дремлет: колпак и «з-з-з» */
      ctx.fillStyle = "#9fd8ff";
      ctx.beginPath(); ctx.moveTo(-9, hy-5); ctx.lineTo(9, hy-5); ctx.lineTo(2, hy-16); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.55 + 0.35*Math.sin(G.tick*0.08);
      text("z", 12, hy - 12 - 3*Math.sin(G.tick*0.06), 12, "#dbeaff", "center");
      ctx.globalAlpha = 1;
    }
    if(e.kind === "throw"){                       /* стопка журналов под мышкой */
      ctx.fillStyle = "#ffd166";
      rrect(-e.dir*13 - 4, -3, 9, 6, 1.5); ctx.fill();
      ctx.fillStyle = "#e8b23c";
      rrect(-e.dir*13 - 4, 0, 9, 3, 1); ctx.fill();
    }
  }
  ctx.restore();
}

function drawPlayer(){
  var p = G.player;
  if(G.shield){
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.25*Math.sin(G.tick*0.14);
    ctx.strokeStyle = "#b08bff"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(p.x + p.w/2, p.y + p.h/2 - 2, 20, 24, 0, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
  if(G.buff.soda > 0 && Math.abs(p.vx) > 2 && G.tick % 3 === 0)
    G.parts.push({ x:p.x+6, y:p.y+18, vx:-p.vx*0.2, vy:rnd(-0.4,0.4), life:16, max:16,
                   col:"#ff6b6b", s:3, g:0.02 });
  var blink = p.dead ? 1 : (p.spawnT > 0 && (G.tick%6<3) ? 0.45 : 1);
  drawCharacter(p, skinView(curSkin), blink);
}
function drawCharacter(p, sk, alpha){
  if(typeof sk === "string") sk = { shirt:sk, hair:"#4a3524", acc:"none" };
  var shirt = sk.shirt;
  if(sk.ghost) alpha *= 0.72;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(p.x + p.w/2, p.y + p.h);
  ctx.scale(p.sqx, p.sqy);
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(0, 1, 11, 3.5, 0, 0, 6.2832); ctx.fill();

  var walk = p.grounded && Math.abs(p.vx) > 0.4 ? Math.sin(p.anim)*4 : 0;
  var air = !p.grounded;
  /* ноги */
  ctx.fillStyle = "#2f3e56";
  ctx.fillRect(-7, -9, 6, 9 + (air? -2 : 0) + walk*0.5);
  ctx.fillRect(1, -9, 6, 9 + (air? -2 : 0) - walk*0.5);
  ctx.fillStyle = "#e14b4b";
  ctx.fillRect(-8, -3 + (air?-2:0) + walk*0.5, 8, 4);
  ctx.fillRect(0, -3 + (air?-2:0) - walk*0.5, 8, 4);
  /* рюкзак */
  ctx.fillStyle = "#7a4ec4";
  rrect(-11*p.dir - (p.dir>0?0:0), -26, 8, 15, 3); ctx.fill();
  /* корпус */
  if(sk.stage >= 3){                      // третий этап: плащ за спиной
    ctx.fillStyle = "rgba(255,209,102,.85)";
    ctx.beginPath();
    ctx.moveTo(-9*p.dir, -26); ctx.lineTo(-17*p.dir, -4); ctx.lineTo(-3*p.dir, -8);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = shirt;
  rrect(-9, -26, 18, 18, 5); ctx.fill();
  if(sk.stage >= 2){                      // второй этап: значок на груди
    ctx.fillStyle = "#ffd166";
    ctx.beginPath(); ctx.arc(5, -16, 3.2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#b07d1c";
    ctx.beginPath(); ctx.arc(5, -16, 1.4, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = alpha * 0.55;
  ctx.fillStyle = "#ffffff";
  rrect(-9, -26, 18, 6, 4); ctx.fill();
  ctx.globalAlpha = alpha;
  /* руки */
  ctx.fillStyle = "#f0c9a0";
  var armY = air ? -24 : -19 + walk*0.4;
  ctx.fillRect(-12, armY, 5, 8);
  ctx.fillRect(7, armY - (air?0:walk*0.8), 5, 8);
  /* голова */
  ctx.fillStyle = "#f6d3ac";
  ctx.beginPath(); ctx.arc(0, -33, 9, 0, 6.2832); ctx.fill();
  ctx.fillStyle = sk.hair || "#4a3524";
  ctx.beginPath(); ctx.arc(0, -35, 9, Math.PI*0.95, Math.PI*2.05); ctx.fill();
  ctx.fillRect(-9, -36, 18, 3);
  if(sk.acc === "cap"){                                   // кепка задом наперёд
    ctx.fillStyle = "#e0553f";
    ctx.beginPath(); ctx.arc(0, -37, 9.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-9.5, -38, 19, 4);
    ctx.fillStyle = "#c0392b"; ctx.fillRect(-13*p.dir, -38, 5, 4);
  } else if(sk.acc === "bow"){                            // бант
    ctx.fillStyle = "#ff6b9d";
    ctx.beginPath(); ctx.arc(-7, -40, 4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(1, -40, 4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#e0447d"; ctx.beginPath(); ctx.arc(-3, -40, 2, 0, 6.2832); ctx.fill();
  } else if(sk.acc === "glasses"){                        // очки
    ctx.strokeStyle = "#23303f"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(-3.5 + p.dir*1.5, -33, 3.6, 0, 6.2832);
    ctx.arc(4 + p.dir*1.5, -33, 3.6, 0, 6.2832);
    ctx.moveTo(0.1 + p.dir*1.5, -33); ctx.lineTo(0.4 + p.dir*1.5, -33);
    ctx.stroke();
  } else if(sk.acc === "whistle"){                        // свисток на шнурке
    ctx.strokeStyle = "#f0f4fa"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -28, 7, 0.2, Math.PI-0.2); ctx.stroke();
    ctx.fillStyle = "#ffd166"; rrect(-2, -22, 6, 4, 1.5); ctx.fill();
  } else if(sk.acc === "tie"){                            // галстук
    ctx.fillStyle = "#d1443f";
    ctx.beginPath();
    ctx.moveTo(-2, -26); ctx.lineTo(2, -26); ctx.lineTo(1, -14); ctx.lineTo(-1, -14);
    ctx.closePath(); ctx.fill();
  } else if(sk.acc === "ribbon"){                         // лента выпускника
    ctx.fillStyle = "#ffd166";
    ctx.save(); ctx.translate(0, -18); ctx.rotate(-0.5);
    ctx.fillRect(-4, -12, 7, 22); ctx.restore();
  } else if(sk.acc === "chef"){                           // поварской колпак
    ctx.fillStyle = "#fbfdff";
    rrect(-8, -44, 16, 7, 2); ctx.fill();
    ctx.beginPath();
    ctx.arc(-5, -48, 5, 0, 6.2832); ctx.arc(0, -51, 5.5, 0, 6.2832);
    ctx.arc(5, -48, 5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#e6ebf2"; ctx.fillRect(-8, -39, 16, 2);
  } else if(sk.acc === "radio"){                          // рация на плече
    ctx.fillStyle = "#1d2635";
    rrect(-11*p.dir - 2.5, -27, 5, 9, 1.5); ctx.fill();
    ctx.fillStyle = "#8bffcf";
    ctx.fillRect(-11*p.dir - 1.2, -25.5, 2.4, 2);
    ctx.strokeStyle = "#1d2635"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-11*p.dir, -27); ctx.lineTo(-11*p.dir, -33); ctx.stroke();
  } else if(sk.acc === "crown"){                          // корона за всё сразу
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.moveTo(-9, -40); ctx.lineTo(-9, -47); ctx.lineTo(-4.5, -43);
    ctx.lineTo(0, -50); ctx.lineTo(4.5, -43); ctx.lineTo(9, -47); ctx.lineTo(9, -40);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ff5f6d"; ctx.beginPath(); ctx.arc(0, -44, 1.7, 0, 6.2832); ctx.fill();
  } else if(sk.acc === "band"){                           // повязка спортсмена
    ctx.fillStyle = "#ff5f6d"; ctx.fillRect(-9.2, -40, 18.4, 4);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(-2, -40, 4, 4);
  } else if(sk.acc === "cat"){                            // ушки
    ctx.fillStyle = sk.hair || "#4a3524";
    ctx.beginPath(); ctx.moveTo(-8,-40); ctx.lineTo(-5,-48); ctx.lineTo(-1,-41); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8,-40); ctx.lineTo(5,-48); ctx.lineTo(1,-41); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ff9ff3";
    ctx.beginPath(); ctx.moveTo(-6.4,-41); ctx.lineTo(-5,-45.4); ctx.lineTo(-3.2,-41.4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6.4,-41); ctx.lineTo(5,-45.4); ctx.lineTo(3.2,-41.4); ctx.closePath(); ctx.fill();
  } else if(sk.acc === "helm"){                           // каска охраны
    ctx.fillStyle = "#e0a63c";
    ctx.beginPath(); ctx.arc(0, -37, 10, Math.PI, 0); ctx.fill();
    ctx.fillRect(-11.5, -38, 23, 3.4);
    ctx.fillStyle = "#b9832a"; ctx.fillRect(-1.6, -46, 3.2, 9);
  }
  /* глаза */
  ctx.fillStyle = "#23303f";
  if(p.dead){
    ctx.lineWidth = 2; ctx.strokeStyle = "#23303f";
    ctx.beginPath();
    ctx.moveTo(-6,-35); ctx.lineTo(-1,-30); ctx.moveTo(-1,-35); ctx.lineTo(-6,-30);
    ctx.moveTo(2,-35); ctx.lineTo(7,-30); ctx.moveTo(7,-35); ctx.lineTo(2,-30);
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-3 + p.dir*2.5, -33, 1.8, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(3 + p.dir*2.5, -33, 1.8, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#c9765a"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(1 + p.dir*2, -29.5, 3.2, 0.2, Math.PI-0.2); ctx.stroke();
  }
  ctx.restore();
}

function drawParts(){
  var i;
  for(i=0;i<G.parts.length;i++){
    var q = G.parts[i];
    if(q.menu) continue;                       // их рисует фон меню
    ctx.globalAlpha = Math.max(0, q.life/q.max);
    ctx.fillStyle = q.col;
    ctx.fillRect(q.x, q.y, q.s, q.s);
  }
  ctx.globalAlpha = 1;
}
function drawRings(){
  for(var i=0;i<G.rings.length;i++){
    var rg = G.rings[i], k = rg.t / rg.life;
    ctx.globalAlpha = (1 - k) * 0.7;
    ctx.strokeStyle = rg.col; ctx.lineWidth = 3 * (1 - k) + 0.6;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, 6 + rg.r * k, 0, 6.2832); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawPops(){
  for(var i=0;i<G.pops.length;i++){
    var o = G.pops[i], k = o.t / o.life;
    var sc = o.t < 7 ? 0.5 + 0.5 * (o.t/7) * 1.25 : 1.12 - 0.12 * Math.min(1, (o.t-7)/8);
    ctx.save();
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.translate(o.x, o.y);
    ctx.scale(sc, sc);
    text(o.str, 1, 1, o.s, "rgba(0,0,0,.5)", "center");
    text(o.str, 0, 0, o.s, o.col, "center");
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawTrail(){                          // шлейф на разгоне
  for(var i=0;i<G.trail.length;i++){
    var t = G.trail[i];
    ctx.globalAlpha = (t.life / t.max) * 0.3;
    ctx.fillStyle = t.col;
    rrect(t.x + 3, t.y + 2, t.w - 6, t.h - 4, 5); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ":" + (s<10?"0":"") + s;
}
function drawPieIcon(x, y, s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle = "#e8a33d"; ctx.beginPath(); ctx.ellipse(0,0,11,8,0,0,6.2832); ctx.fill();
  ctx.fillStyle = "#f7c66b"; ctx.beginPath(); ctx.ellipse(-1,-2,9,6,0,0,6.2832); ctx.fill();
  ctx.restore();
}
function drawBellIcon(x, y, s, col){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-9,6); ctx.quadraticCurveTo(-8,-8, 0,-9); ctx.quadraticCurveTo(8,-8, 9,6);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(-11,6,22,2.5);

}

/* ---- кнопки прямо на канвасе: работают и мышью, и пальцем ---- */
/* Панель рисуется поверх меню или холла, и кнопки фона остаются в списке.
   Мышь до них дотягиваться не должна: под панелью их не видно, а нажатие
   срабатывало — иконка звука из-под экрана настроек, например. Каждый
   верхний экран отмечает, с какого места в списке начинается он сам. */
var uiBase = 0;
function uiTop(){ uiBase = G.buttons.length; }
function hovered(x, y, w, h){
  return !isTouch && G.mx >= x && G.mx <= x + w && G.my >= y && G.my <= y + h;
}
function gradText(str, x, y, size, c1, c2, align){
  var g = vGrad("t" + y + "_" + size + c1 + c2, 0, y - size, 0, y + size*0.3, [0, c1, 1, c2]);
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
  text(str, x, y, size, "rgba(0,0,0,.45)", align || "center");
  ctx.restore();
  text(str, x, y, size, g, align || "center");
}
function buttonBody(w, h, label, sub, o, sel, hov){
  ctx.fillStyle = "rgba(0,0,0,.35)";
  rrect(2, 6, w, h, 15); ctx.fill();

  var tint = o.selBorder || (sel ? "#8bffcf" : "#9fd8ff");
  var g = sel ? vGrad("bs" + h, 0, 0, 0, h, [0, "rgba(255,255,255,.34)", 1, "rgba(255,255,255,.14)"])
       : hov ? vGrad("bh" + h, 0, 0, 0, h, [0, "rgba(255,255,255,.26)", 1, "rgba(255,255,255,.1)"])
             : vGrad("bn" + h, 0, 0, 0, h, [0, "rgba(255,255,255,.16)", 1, "rgba(255,255,255,.05)"]);
  ctx.fillStyle = g;
  rrect(0, 0, w, h, 15); ctx.fill();

  if(sel || hov){                                  // свечение по контуру
    ctx.save();
    if(fancy()){ ctx.shadowColor = tint; ctx.shadowBlur = sel ? 16 : 10; }
    ctx.strokeStyle = tint; ctx.lineWidth = sel ? 2.4 : 1.8;
    rrect(0.5, 0.5, w-1, h-1, 15); ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1.4;
    rrect(0.5, 0.5, w-1, h-1, 15); ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,255,255,.22)";        // блик сверху
  rrect(6, 3, w-12, Math.min(12, h*0.3), 8); ctx.fill();
  if(sel){                                         // уголки-акценты
    ctx.strokeStyle = tint; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(9, 15); ctx.lineTo(9, 9); ctx.lineTo(15, 9);
    ctx.moveTo(w-15, h-9); ctx.lineTo(w-9, h-9); ctx.lineTo(w-9, h-15);
    ctx.stroke();
  }
  var fs = o.size || 22;
  var lw = w - (sel ? 38 : 18);                   // у выделенной кнопки есть уголки
  textFit(label, w/2, h/2 + (sub ? -2 : fs*0.36) + 1, fs, "rgba(0,0,0,.4)", "center", 700, lw);
  textFit(label, w/2, h/2 + (sub ? -2 : fs*0.36), fs, o.col || "#ffffff", "center", 700, lw);
  if(sub) textFit(sub, w/2 + (sel ? 3 : 0), h/2 + Math.min(20, h/2 - 6),
                  o.subSize || 12, "rgba(226,238,255,.8)", "center", 600, w - (sel ? 32 : 12));
}
var BTN_PAD = 26;
function uiButton(id, x, y, w, h, label, sub, o){
  o = o || {};
  var hot = (G.hotBtn === id && G.hotT > 0);
  var sel = !!o.sel;
  var hov = hovered(x, y, w, h);
  var lift = hot ? -1 : (hov ? -2 : 0);
  var k = hot ? 0.975 : (hov ? 1.025 : 1);
  if((hov || sel) && !o.dim) G.uiHover = true;

  var key = "btn" + w + "_" + h + "|" + label + "|" + (sub || "") + "|" +
            (sel?1:0) + (hov?1:0) + (fancy()?1:0) + "|" +
            (o.size||22) + "|" + (o.col||"") + "|" + (o.selBorder||"") + "|" + (o.subSize||12);
  var img = cachedImg(key, w + BTN_PAD*2, h + BTN_PAD*2, function(){
    ctx.translate(BTN_PAD, BTN_PAD);
    buttonBody(w, h, label, sub, o, sel, hov);
  });

  ctx.save();
  if(o.dim) ctx.globalAlpha = 0.3;
  ctx.translate(x + w/2, y + h/2 + lift);
  ctx.scale(k, k);
  ctx.drawImage(img, -w/2 - BTN_PAD, -h/2 - BTN_PAD);
  ctx.restore();
  G.buttons.push({ id:id, x:x, y:y, w:w, h:h });
}
function iconBtn(id, x, y, s, kind){
  var hot = (G.hotBtn === id && G.hotT > 0);
  ctx.save();
  ctx.fillStyle = hot ? "rgba(255,255,255,.4)" : "rgba(9,16,32,.55)";
  rrect(x, y, s, s, 13); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5;
  rrect(x, y, s, s, 13); ctx.stroke();
  ctx.translate(x + s/2, y + s/2);
  ctx.fillStyle = "#eaf6ff";
  if(kind === "pause"){
    if(G.state === "paused"){ ctx.beginPath(); ctx.moveTo(-5,-8); ctx.lineTo(9,0); ctx.lineTo(-5,8); ctx.closePath(); ctx.fill(); }
    else { ctx.fillRect(-7,-8,5,16); ctx.fillRect(2,-8,5,16); }
  } else if(kind === "full"){
    ctx.strokeStyle = "#eaf6ff"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    var q = isFullscreen() ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(-9*q, -3*q); ctx.lineTo(-9*q, -9*q); ctx.lineTo(-3*q, -9*q);
    ctx.moveTo(9*q, -3*q); ctx.lineTo(9*q, -9*q); ctx.lineTo(3*q, -9*q);
    ctx.moveTo(-9*q, 3*q); ctx.lineTo(-9*q, 9*q); ctx.lineTo(-3*q, 9*q);
    ctx.moveTo(9*q, 3*q); ctx.lineTo(9*q, 9*q); ctx.lineTo(3*q, 9*q);
    ctx.stroke();
  } else if(kind === "gear"){
    ctx.strokeStyle = "#eaf6ff"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 6.2832); ctx.stroke();
    var gi;
    for(gi=0; gi<6; gi++){
      var ga = gi * 1.0472;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ga)*8, Math.sin(ga)*8);
      ctx.lineTo(Math.cos(ga)*11.5, Math.sin(ga)*11.5);
      ctx.stroke();
    }
  } else if(kind === "buzz"){
    ctx.globalAlpha = haptics ? 1 : 0.45;
    rrect(-5, -9, 10, 18, 3); ctx.fill();
    ctx.strokeStyle = "#eaf6ff"; ctx.lineWidth = 2; ctx.lineCap = "round";
    if(haptics){
      ctx.beginPath();
      ctx.moveTo(-10, -4); ctx.lineTo(-10, 4);
      ctx.moveTo(10, -4); ctx.lineTo(10, 4);
      ctx.moveTo(-14, -7); ctx.lineTo(-14, 7);
      ctx.moveTo(14, -7); ctx.lineTo(14, 7);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-12,-7); ctx.lineTo(12,7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.beginPath(); ctx.moveTo(-8,-4); ctx.lineTo(-3,-4); ctx.lineTo(3,-9); ctx.lineTo(3,9); ctx.lineTo(-3,4); ctx.lineTo(-8,4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#eaf6ff"; ctx.lineWidth = 2; ctx.lineCap = "round";
    if(muted){ ctx.beginPath(); ctx.moveTo(6,-5); ctx.lineTo(12,5); ctx.moveTo(12,-5); ctx.lineTo(6,5); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(4,0,7,-0.9,0.9); ctx.stroke(); }
  }
  ctx.restore();
  G.buttons.push({ id:id, x:x, y:y, w:s, h:s });
}

function drawItemIcon(k, x, y, s){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if(k === "soda"){
    ctx.fillStyle = "#e0544f"; rrect(-6, -6, 12, 16, 3); ctx.fill();
    ctx.fillStyle = "#ff8a85"; rrect(-6, -3, 12, 5, 1); ctx.fill();
    ctx.fillStyle = "#9fb4c8"; ctx.fillRect(-3, -11, 6, 5);
    ctx.fillStyle = "#e8eef7"; rrect(-4, -13, 8, 3, 1); ctx.fill();
  } else if(k === "gum"){
    ctx.fillStyle = "#ff9ff3"; rrect(-7, -9, 14, 18, 3); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillRect(-7, -4, 14, 2); ctx.fillRect(-7, 1, 14, 2);
  } else if(k === "bag"){
    ctx.strokeStyle = "#6b4a8f"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -7, 4, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = "#9b6bf0"; rrect(-9, -6, 18, 14, 3); ctx.fill();
    ctx.fillStyle = "#c9a5ff"; ctx.fillRect(-9, -1, 18, 3);
  } else if(k === "watch"){
    ctx.fillStyle = "#5d6d7e"; ctx.fillRect(-3, -12, 6, 5); ctx.fillRect(-3, 7, 6, 5);

/* Панель и кнопки не меняются от кадра к кадру — держим готовые картинки. */
var imgCache = {}, imgKeys = [];
function cachedImg(key, w, h, draw){
  var c = imgCache[key], at;
  if(c){
    at = imgKeys.indexOf(key);                 // освежаем позицию в очереди
    if(at >= 0 && at < imgKeys.length - 1){ imgKeys.splice(at, 1); imgKeys.push(key); }
    return c;
  }
  c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  var real = ctx;
  ctx = c.getContext("2d");
  draw();
  ctx = real;
  imgCache[key] = c;
  imgKeys.push(key);
  while(imgKeys.length > 140) delete imgCache[imgKeys.shift()];   // память не копим
  return c;
}
var PAD_IMG = 56;
function panel(w, h, accent){
  var e = uiEase();
  var x = VW/2 - w/2, y = VH/2 - h/2 + (1 - e) * 16;
  var k = "pan" + w + "_" + h + "_" + (accent || "") + (fancy() ? "f" : "");
  var img = cachedImg(k, w + PAD_IMG*2, h + PAD_IMG*2, function(){
    panelBody(PAD_IMG, PAD_IMG, w, h, accent);
  });
  var sc = 0.97 + 0.03*e;
  ctx.save();
  ctx.globalAlpha = e;
  ctx.translate(VW/2, VH/2);
  ctx.scale(sc, sc);
  ctx.translate(-VW/2, -VH/2);
  ctx.drawImage(img, x - PAD_IMG, y - PAD_IMG);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function modCell(m, x, y, w, h){
  var on = mod(m.k), hot = (G.hotBtn === "mod_" + m.k && G.hotT > 0);
  var hv = hovered(x, y, w, h);
  if(hv) G.uiHover = true;
  var tint = m.m > 0 ? "#ffb98a" : "#8bffcf";
  ctx.fillStyle = hot ? "rgba(255,255,255,.3)"
                      : (on ? "rgba(255,255,255,.16)" : (hv ? "rgba(255,255,255,.12)" : "rgba(255,255,255,.06)"));
  rrect(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = on ? tint : "rgba(255,255,255,.18)";
  ctx.lineWidth = on ? 2.4 : 1.4;
  rrect(x, y, w, h, 12); ctx.stroke();
  ctx.fillStyle = on ? tint : "rgba(255,255,255,.12)";
  rrect(x+11, y+h/2-10, 20, 20, 6); ctx.fill();
  if(on){
    ctx.strokeStyle = "#14202c"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x+16, y+h/2); ctx.lineTo(x+20, y+h/2+4); ctx.lineTo(x+27, y+h/2-5);
    ctx.stroke();
  }
  textFit(m.n, x+42, y+h/2-2, 14, on ? "#ffffff" : "rgba(230,240,255,.8)", "left", 700, w-108);
  textFit(m.d, x+42, y+h/2+12, 10.5, "rgba(200,220,255,.55)", "left", 600, w-108);
  text((m.m > 0 ? "+" : "") + m.m + "%", x+w-12, y+h/2+5, 14, tint, "right", 700);
  G.buttons.push({ id:"mod_" + m.k, x:x, y:y, w:w, h:h });
}

function modList(kind){
  var out = [], i, g;
  for(i=0;i<MODS.length;i++){
    g = MODS[i].grp || (MODS[i].m > 0 ? "hard" : "easy");
    if(g === kind) out.push(MODS[i]);
  }
  return out;
}
function modCountOf(kind){
  var list = modList(kind), n = 0, i;
  for(i=0;i<list.length;i++) if(mod(list[i].k)) n++;
  return n;
}
function drawMods(){
  uiTop();
  ctx.fillStyle = "rgba(4,10,22,.78)"; ctx.fillRect(0,0,VW,VH);
  panel(780, 468);
  gradText("МОДИФИКАТОРЫ", VW/2, 34, 24, "#fff3c4", "#f0a83a");
  text("ОЧКИ × " + modMult().toFixed(2) +
       (modCount() ? "   ·   включено " + modCount() + " из " + MODS.length : "   ·   ничего не включено"),
       VW/2, 56, 15, modCount() ? "#ffb98a" : "rgba(200,220,255,.6)", "center");

  var tab = G.modTab || "hard";
  uiButton("tab_hard", 130, 66, 172, 32, "СЛОЖНЕЕ" + (modCountOf("hard") ? " · " + modCountOf("hard") : ""),
           null, { size:13, sel: tab === "hard", selBorder:"#ffb98a" });
  uiButton("tab_easy", 314, 66, 172, 32, "ПРОЩЕ" + (modCountOf("easy") ? " · " + modCountOf("easy") : ""),
           null, { size:13, sel: tab === "easy", selBorder:"#8bffcf" });
  uiButton("tab_class", 498, 66, 172, 32, "УРОКИ" + (modCountOf("class") ? " · " + modCountOf("class") : ""),
           null, { size:13, sel: tab === "class", selBorder:"#9fd8ff" });

  var list = modList(tab), i;
  var rows = Math.max(1, Math.ceil(list.length / 2));
  var top = 106, bottom = 414;                       // сетка сама ужимается под число карточек
  var step = Math.min(72, (bottom - top) / rows);
  var ch = Math.min(64, step - 8);
  top += Math.max(0, (bottom - top - rows*step) / 2);   // и встаёт по центру, без пустого низа
  for(i=0;i<list.length;i++)
    modCell(list[i], (i % 2) ? 400 : 30, top + Math.floor(i/2)*step, 350, ch);

  uiButton("mods_clear", 214, 428, 170, 36, "ВСЁ ВЫКЛ", null, { size:14 });
  uiButton("mods_back", 416, 428, 170, 36, "НАЗАД", null, { size:14, sel:true });
}

function drawTeacher(x, y, mood){
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.ellipse(0, 4, 20, 5, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#3a4a63";                     // юбка/брюки
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.lineTo(9, -34); ctx.lineTo(-9, -34); ctx.closePath(); ctx.fill();
  ctx.fillStyle = mood === "watch" ? "#8c5a6b" : "#6d7fa0";
  rrect(-13, -60, 26, 28, 7); ctx.fill();
  ctx.fillStyle = "#f3cfa8";                     // голова
  ctx.beginPath(); ctx.arc(0, -72, 12, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#8b7a63";
  ctx.beginPath(); ctx.arc(0, -75, 12.5, Math.PI*0.95, Math.PI*2.05); ctx.fill();
  if(mood === "away"){
    ctx.fillStyle = "#6f6152";                   // затылок: пучок
    ctx.beginPath(); ctx.arc(0, -78, 8, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#f3cfa8"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(10, -52); ctx.lineTo(24, -64); ctx.stroke();   // рука у доски
  } else {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-4.5, -73, 4, 0, 6.2832); ctx.arc(4.5, -73, 4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = mood === "watch" ? "#e04a4a" : "#39445c";
    ctx.beginPath(); ctx.arc(-4.5, -73, 2, 0, 6.2832); ctx.arc(4.5, -73, 2, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#39445c"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(-4.5,-73,4.4,0,6.2832); ctx.moveTo(8.9,-73); ctx.arc(4.5,-73,4.4,0,6.2832); ctx.stroke();
    ctx.strokeStyle = "#a9724f"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, -63, 4, Math.PI+0.3, -0.3); ctx.stroke();
  }
  ctx.restore();
}

var starBuff = { double:false, life:0 };
function starBuffLoad(){
  try{
    var raw = JSON.parse(localStorage.getItem("peremena_starbuff") || "null");
    if(raw){ starBuff.double = !!raw.double; starBuff.life = raw.life|0; }
  }catch(e){}
}
function starBuffSave(){
  try{ localStorage.setItem("peremena_starbuff", JSON.stringify(starBuff)); }catch(e){}
}
function buyStar(k){
  var i, g = null;
  for(i=0;i<STAR_GOODS.length;i++) if(STAR_GOODS[i].k === k) g = STAR_GOODS[i];
  if(!g) return;
  if(g.kind === "skin" && owns(g.v)){ toast("Этот скин уже твой"); return; }
  if(stars() < g.p){ toast("Не хватает пятёрок: нужно " + g.p); sfx.hurt(); return; }
  STATS.stars = stars() - g.p;
  if(g.kind === "skin"){ STATS.owned.push(g.v); curSkin = g.v; toast("Скин «" + skinBy(g.v).n + "» твой!"); }
  else if(g.kind === "reroll"){
    DAILY.day = "";
    dailyRoll();
    toast("Задания дня обновлены");
  }
  else if(g.kind === "double"){ starBuff.double = true; starBuffSave(); toast("Следующий забег — двойные булки"); }
  else if(g.kind === "life"){ starBuff.life = (starBuff.life|0) + 1; starBuffSave(); toast("Запасное дыхание в кармане"); }
  statBump();
  sfx.win();
}

function badgeTile(b, x, y, w, h, got, sel, hot){

                      : (got ? (hot ? "rgba(255,255,255,.16)" : "rgba(255,255,255,.08)")

    ctx.restore();

  ctx.strokeStyle = sel ? "#ffd166" : (got ? b.c : "rgba(255,255,255,.12)");
  ctx.lineWidth = sel ? 2.4 : (got ? 1.5 : 1);
  rrect(x, y, w, h, r); ctx.stroke();

  if(!got) ctx.globalAlpha = 0.3;
  badgeIcon(b.k, x + w/2, y + 26, 1, got ? b.c : "rgba(200,220,255,.7)");
  textFit(b.n, x + w/2, y + h - 10, 10.5, got ? "#ffffff" : "rgba(210,228,255,.6)",
          "center", 700, w - 10);

    rrect(x + w - 17, y + 6, 10, 8, 2); ctx.fill();
    ctx.strokeStyle = "rgba(200,220,255,.45)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(x + w - 12, y + 6, 3.2, Math.PI, 0); ctx.stroke();
  }
}

function drawEvents(){
  uiTop();
  ctx.fillStyle = "rgba(4,10,22,.9)"; ctx.fillRect(0,0,VW,VH);
  var i, j, ev, d, stt, col;
  /* Показываем то, что ближе: сегодняшнее, потом ближайшее, потом прошедшее. */
  var list = EVENTS.slice().sort(function(a, b){
    var da = eventDays(a), db = eventDays(b);
    var wa = da === 0 ? -1 : (da > 0 ? da : 1000 - da);
    var wb = db === 0 ? -1 : (db > 0 ? db : 1000 - db);
    return wa - wb;
  });
  var shown = Math.max(1, Math.min(list.length, 3));
  var cardH = shown >= 3 ? 98 : 142, tight = cardH < 130;
  var H = clamp(148 + shown*(cardH + 12), 240, 462), top = VH/2 - H/2;
  panel(760, H, "rgba(201,160,255,.9)");
  gradText("СОБЫТИЯ", VW/2, top + 36, 24, "#efe3ff", "#a06be8");
  text("школьный календарь", VW/2, top + 56, 11, "rgba(200,220,255,.6)", "center", 600);
  var y = top + 76;
  for(i=0;i<list.length && i<shown;i++){
    ev = list[i]; d = eventDays(ev); stt = eventState(ev);
    col = stt === "сегодня" ? "#8bffcf" : (stt === "скоро" ? "#c9a0ff" : "rgba(255,255,255,.3)");
    ctx.fillStyle = "rgba(255,255,255,.06)";
    rrect(40, y, 680, cardH, 12); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = stt === "прошло" ? 1.2 : 2;
    rrect(40, y, 680, cardH, 12); ctx.stroke();

    if(tight){                                /* тесная карточка: заголовок слева */
      gradText(ev.n, 70, y + 26, 17, "#ffffff",
               col === "rgba(255,255,255,.3)" ? "#8899aa" : col, "left");
      textFit(ev.d, 70, y + 43, 10.5, "rgba(220,235,255,.6)", "left", 600, 420);
    } else {
      gradText(ev.n, VW/2, y + 30, 22, "#ffffff",
               col === "rgba(255,255,255,.3)" ? "#8899aa" : col);
      text(ev.d, VW/2, y + 50, 12, "rgba(220,235,255,.7)", "center", 600);
    }
    var bMax = tight ? 2 : 3, bTop = tight ? y + 62 : y + 72;
    for(j=0;j<ev.lines.length && j<bMax;j++)
      textFit("• " + ev.lines[j], 70, bTop + j*17, 11,
              "rgba(220,235,255,.65)", "left", 600, 420);

    var pillY = tight ? y + 10 : y + 50;
    ctx.fillStyle = "rgba(0,0,0,.3)";
    rrect(508, pillY, 196, 30, 9); ctx.fill();
    text(stt === "скоро" ? "через " + d + " дн." : (stt === "сегодня" ? "СЕГОДНЯ!" : "уже прошло"),
         606, pillY + 20, 14, col, "center", 700);
    var przY = tight ? y + 52 : y + 91;
    drawStar(520, przY, 0.62);                /* награда держится внутри карточки */
    textFit("приз: " + ev.prize, 533, przY + 5, 11, "rgba(255,217,138,.9)", "left", 600, 172);
    var btnY = tight ? y + 62 : y + 104;
    if(ev.gift && d <= 0 && !evTaken(ev.k))
      uiButton("ev_take_" + ev.k, 508, btnY, 196, tight ? 26 : 30, "ЗАБРАТЬ ПРИЗ", null,
               { size:12, sel:true, selBorder:"#8bffcf" });
    else if(ev.gift && evTaken(ev.k))
      text("приз уже забран", 606, btnY + (tight ? 18 : 20), 11.5, "#8bffcf", "center", 700);
    else if(ev.gift)
      text("приз откроется в этот день", 606, btnY + (tight ? 18 : 20), 10.5,
           "rgba(200,220,255,.45)", "center", 600);
    y += cardH + 12;
  }
  text(list.length > shown
         ? "в календаре ещё " + (list.length - shown) + " — покажутся, когда подойдёт срок"
         : "код подарка работает у любого — хоть по ссылке, хоть с бумажки",
       VW/2, top + H - 62, 11, "rgba(200,220,255,.45)", "center", 600);
  uiButton("gift_in", 176, top + H - 50, 200, 38, "ВВЕСТИ КОД", null,
           { size:15, selBorder:"#ffd166" });
  uiButton("back", 424, top + H - 50, 200, 38, "ЗАКРЫТЬ", null, { size:15, sel:true });
}

      var j = i - from, a2 = ACHS[i], ok = achDone(a2);

      var val = achValue(a2), near = !ok && val > 0;

function rankOf(used, coins, deaths){
  if(coins === G.coinsMax && deaths === 0) return ["ОТЛИЧНИК С МЕДАЛЬЮ", "#ffd166"];
  if(coins >= G.coinsMax*0.8 && used < curDiff.time*0.55) return ["ОТЛИЧНИК", "#8bffcf"];
  if(coins >= G.coinsMax*0.5) return ["ХОРОШИСТ", "#9fd8ff"];
  return ["ТРОЕЧНИК, НО ЖИВОЙ", "#ffb3b3"];
}

/* ================== КАДР ================== */
/* Состояния, где панель закрывает весь экран (фон под ней не виден). */
var COVERED = { skins:1, records:1, iteminfo:1, mods:1, profile:1,
                news:1, events:1, settings:1, seedin:1, admin:1 };
function drawWorld(cam){
  drawBackground(cam);
  if(!G.level) return;
  ctx.save();
  var sh = G.shake * shakeK();
  ctx.translate(-Math.round(cam) + (sh>0.4?rnd(-sh,sh):0), (sh>0.4?rnd(-sh,sh):0));
  drawTiles(cam);
  drawMovers();
  drawSpikes();
  if(G.state === "hub" || G.back === "hub") drawStands();
  drawBells();
  drawLockers();
  drawBalls();
  drawPads();
  drawCoins();
  drawKey();
  drawDoor();
  for(var wi=0; wi<G.level.enemies.length; wi++) drawEnemy(G.level.enemies[wi]);
  drawShots();
  drawParts();
  drawTrail();
  if(G.player) drawPlayer();
  drawRings();
  drawPops();
  if(devBox) drawHitboxes();
  ctx.restore();
}
var snapCv = null, snapFor = "", snapGen = 0, snapState = "";
function drawSnap(cam){
  /* Снимок переснимается при входе на экран, а не когда дрогнула камера:
     под панелью её всё равно не видно, а пересъёмка каждый кадр — это
     ровно та работа, от которой мы избавляемся. */
  if(G.state !== snapState){ snapState = G.state; snapGen++; }
  var key = G.state + "|" + (G.back || "") + "|" + snapGen;
  if(!snapCv){
    snapCv = document.createElement("canvas");
    snapCv.width = VW; snapCv.height = VH;
  }
  if(snapFor !== key){
    var real = ctx;
    ctx = snapCv.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, VW, VH);
    drawWorld(cam);
    ctx = real;
    snapFor = key;
  }
  ctx.drawImage(snapCv, 0, 0);
}
function render(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0,0,VW,VH);
  G.buttons = [];                       // кнопки собираются заново каждый кадр
  uiBase = 0;
  G.uiHover = false;

  var cam = G.level ? G.cam : 0;
  /* Под панелью школа не меняется — её хватает нарисовать один раз и дальше
     копировать снимок: на слабом устройстве это разница между 27 и 60 кадрами. */
  if(COVERED[G.state]){
    drawSnap(cam);
  } else {
    snapFor = ""; snapState = "";
    drawWorld(cam);
  }

  if(mod("dark") && G.player && (G.state === "play" || G.state === "clear" || G.state === "paused")){
    /* Круг света — картинка (градиент считается один раз), а темнота вокруг —
       четыре сплошные заливки: полноэкранный градиент каждый кадр стоил
       двадцати кадров в секунду на слабом устройстве. */
    var lx = G.player.x + G.player.w/2 - G.cam, ly = G.player.y + G.player.h/2;
    var R = 200, D2 = R*2;
    var lamp = cachedImg("lamp" + R, D2, D2, function(){
      var lg = ctx.createRadialGradient(R, R, 30, R, R, R);
      lg.addColorStop(0, "rgba(5,9,18,0)");
      lg.addColorStop(0.5, "rgba(5,9,18,.55)");
      lg.addColorStop(1, "rgba(5,9,18,.94)");
      ctx.fillStyle = lg; ctx.fillRect(0, 0, D2, D2);
    });
    var x0 = Math.round(lx - R), y0 = Math.round(ly - R);
    ctx.drawImage(lamp, x0, y0);
    ctx.fillStyle = "rgba(5,9,18,.94)";
    var ty = clamp(y0, 0, VH), by = clamp(y0 + D2, 0, VH);
    if(ty > 0) ctx.fillRect(0, 0, VW, ty);
    if(by < VH) ctx.fillRect(0, by, VW, VH - by);
    if(x0 > 0) ctx.fillRect(0, ty, Math.min(x0, VW), by - ty);
    if(x0 + D2 < VW) ctx.fillRect(x0 + D2, ty, VW - (x0 + D2), by - ty);
  }
  drawWipe();
  if(G.flash > 0){
    ctx.fillStyle = "rgba(255,240,180," + (G.flash/12*0.35) + ")";
    ctx.fillRect(0,0,VW,VH);
  }

  syncPad();
  if(G.state === "lesson"){
    drawLesson(); drawVignette(); drawToast(); drawAch(); drawWipe(); drawCursor();
    return;
  }
  drawVignette();
  if(G.state === "menu"){ drawMenu(); drawToast(); drawAch(); drawCursor(); return; }
  if(G.state === "settings" || G.state === "seedin"){
    if(G.back === "hub") drawHubHUD(); else if(G.back === "paused" || G.back === "play"){ drawHUD(); drawPaused(); }
    else drawMenu();
    if(G.state === "settings") drawSettings(); else drawSeedIn();
    drawToast(); drawAch(); drawCursor();
    return;
  }
  if(G.state === "code" || G.state === "admin"){
    if(G.back === "hub") drawHubHUD(); else if(G.back === "menu") drawMenu();
    else { drawHUD(); drawPaused(); }
    if(G.state === "code") drawCode(); else drawAdmin();
    drawToast(); drawAch(); drawCursor();
    return;
  }
  if(G.state === "mods"){
    if(G.back === "hub"){ drawHubHUD(); } else drawMenu();
    drawMods(); drawToast(); drawAch(); drawCursor(); return;
  }
  if(G.state === "skins"){ drawHubHUD(); drawSkins(); drawToast(); drawAch(); return; }
  if(G.state === "news" || G.state === "events" || G.state === "profile"){
    if(G.back === "hub") drawHubHUD(); else drawMenu();
    if(G.state === "news") drawNews();
    else if(G.state === "profile") drawProfile();
    else drawEvents();
    drawToast(); drawAch(); drawCursor();
    return;
  }
  if(G.state === "iteminfo"){ drawHubHUD(); drawItemInfo(); return; }
  if(G.state === "records"){ drawHubHUD(); drawRecords(); return; }
  if(G.state === "hub"){ drawHubHUD(); drawToast(); drawAch(); return; }
  drawHUD();
  drawCursor();
  if(G.state === "clear") drawBanner();
  else if(G.state === "win") drawWin();
  else if(G.state === "over") drawOver();
  else if(G.state === "paused") drawPaused();
}

/* ================== ЗАПУСК ================== */
function resize(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = VW*dpr; cv.height = VH*dpr;
  cv.style.width = ""; cv.style.height = "";
}
window.addEventListener("resize", resize);

var padShown = null, itemShown = null;
var itemBtn = document.querySelector(".btn.item");
function syncItemBtn(){
  var k = G.item || "";
  if(k === itemShown) return;
  itemShown = k;
  if(!itemBtn) return;
  itemBtn.classList.toggle("has", !!k);
  itemBtn.textContent = k ? ITEMS[k].n.toUpperCase() : "ПРЕДМЕТ";
}
function syncPad(){
  syncItemBtn();                              // джойстик нужен в игре, на уроке и в холле
  var show = (G.state === "play" || G.state === "clear" ||
              G.state === "lesson" || G.state === "hub");
  if(show === padShown) return;
  padShown = show;
  document.body.classList.toggle("hidepad", !show);
}
var mqPortrait = window.matchMedia ? window.matchMedia("(orientation: portrait)") : null;
function orientCheck(){
  if(isTouch && mqPortrait && mqPortrait.matches && G && G.state === "play") G.state = "paused";
}
if(mqPortrait){
  if(mqPortrait.addEventListener) mqPortrait.addEventListener("change", orientCheck);
  else if(mqPortrait.addListener) mqPortrait.addListener(orientCheck);
}
document.addEventListener("fullscreenchange", function(){
  document.body.classList.toggle("fs", isFullscreen());
  resize();
});
document.addEventListener("visibilitychange", function(){
  if(document.hidden && G && G.state === "play") G.state = "paused";
});

var last = 0, acc = 0, STEP = 1/60;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last = ts;
  var dt = Math.min(0.1, (ts - last)/1000);
  last = ts;
  acc += dt * (mod("fastgame") ? 1.2 : 1) * POW.time;
  var guard = 0;
  while(acc >= STEP && guard < 5){ update(STEP); acc -= STEP; guard++; }
  if(guard >= 5) acc = 0;
  render();
}

window.PEREMENA_DEBUG = {
  get: function(){ return G; },

  stats: function(){ return STATS; }, skin: function(){ return curSkin; },
  near: function(){ return hubNear(); }, hub: enterHub, ring: ringBell,

  set: function(){ return SET; }, muted: function(){ return muted; }, fancy: fancy,

  devLog: function(){ return devLog; }, lesson: startLesson,

  giftCode: giftCode, giftRead: giftRead, giftLink: giftLink, giftClaim: giftClaim,

  evTaken: evTaken, evReady: evReady, eventBy: eventBy,

  badgeGot: badgeGot, rank: profRank,
  evDate: evDate, evShifted: evShifted
};

modLoad();
statLoad();
profLoad();
setLoad();
startItemLoad();
starBuffLoad();
dayStreak();
dailyLoad();
dailyRoll();
(function initSeed(){
  var h = "";
  try{ h = (location.hash || "").replace(/^#/, ""); }catch(e){}
  if(/^g=/i.test(h)){
    giftPending = h.slice(2); h = "";
    try{ location.hash = "gift"; }catch(e){}
  }
  if(/^s=/i.test(h)){ curSeed = cleanSeed(h.slice(2)); curSrc = "seed"; }
  else {
    try{
      curSeed = cleanSeed(localStorage.getItem("peremena_seed"));
      if(!/^classic$/i.test(h)) curSrc = localStorage.getItem("peremena_src") || "classic";
    }catch(e){}
  }
  if(!curSeed) curSeed = randomSeed();
  LEVELS = (curSrc === "seed") ? genLevels(curSeed) : CAMPAIGN;
})();

G = newGame();
if(giftPending){                          // ссылка с подарком: открываем сразу на старте
  giftClaim(giftPending, "Подарок по ссылке");
  giftPending = "";
}
G.coinsMax = 0;
for(var li=0; li<LEVELS.length; li++) G.coinsMax += buildLevel(LEVELS[li]).coinTotal;
G.level = buildLevel(LEVELS[0]);
G.player = null;
try{ G.pick = localStorage.getItem("peremena_mode") || "normal"; }catch(e){}
resize();
requestAnimationFrame(frame);
})();
