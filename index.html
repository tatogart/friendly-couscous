/* ================== СЛУЧАЙНЫЕ УРОВНИ ПО СИДУ ==================

var SEED_ABC = "ACDEFHJKLMNPRTUVWXY3479";
var GEN_NAMES = ["Первый этаж","Раздевалка","Столовая","Актовый зал","Лестница",
                 "Спортзал","Коридор","Библиотека","Кабинет труда","Чердак",
                 "Крыша","Школьный двор","Рекреация","Кабинет химии"];
var GEN_HINTS = ["Этого уровня ещё никто не видел","Сид сгенерил — тебе проходить",
                 "Смотри под ноги","Тут может быть что угодно","Беги, не думай",
                 "Звонок не ждёт"];

function hashSeed(str){
  var h = 2166136261, i;
  str = String(str).toUpperCase();
  for(i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randomSeed(){
  var out = "", i;
  for(i=0;i<5;i++) out += SEED_ABC.charAt(Math.floor(Math.random()*SEED_ABC.length));
  return out;
}
function daySeed(){                       // общий для всех сид на сегодня
  var d = new Date();
  var key = d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  var r = mulberry(hashSeed("den/" + key)), out = "", i;
  for(i=0;i<5;i++) out += SEED_ABC.charAt(Math.floor(r()*SEED_ABC.length));
  return out;
}
function shareSeed(){                     // ссылка на этот же набор уровней
  var url = "";
  try{ url = location.href.split("#")[0] + "#s=" + (G.seedIn || curSeed); }catch(e){}
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url);

    }
  }catch(e){}
  toast("Сид " + (G.seedIn || curSeed) + " — запиши его");
}
function cleanSeed(str){
  var out = "", i, ch;
  str = String(str || "").toUpperCase();
  for(i=0;i<str.length && out.length<8;i++){
    ch = str.charAt(i);
    if(SEED_ABC.indexOf(ch) >= 0 || /[0-9A-Z]/.test(ch)) out += ch;
  }
  return out;
}
function irnd(rnd, a, b){ return a + Math.floor(rnd()*(b-a+1)); }
function pickOf(rnd, arr){ return arr[Math.floor(rnd()*arr.length)]; }

function genLevel(rnd, idx, name, withKey){
  var W = 40 + idx*2, H = 15, i, x, y;
  var g = [], movers = [], plats = [];
  for(y=0;y<H;y++){ g.push([]); for(x=0;x<W;x++) g[y].push("."); }
  for(x=0;x<W;x++){ g[13][x] = "#"; g[14][x] = "#"; }
  g[12][2] = "@";
  var endCol = W - 4, col = 6;

  function coins(row, from, n){
    for(var k=0;k<n;k++) if(from+k > 2 && from+k < W-2 && g[row][from+k] === ".") g[row][from+k] = "o";
  }
  function carve(from, w){
    for(var k=0;k<w;k++){ g[13][from+k] = "."; g[14][from+k] = "."; }
  }

  var pool = ["flat","coins","platform","locker"];
  if(idx >= 1) pool = pool.concat(["pit","enemy"]);
  if(idx >= 2) pool = pool.concat(["spikes","enemy","platform","ball","bell"]);
  if(idx >= 3) pool = pool.concat(["pad","pit"]);
  if(idx >= 4) pool = pool.concat(["mover","fly","spikes"]);
  if(idx >= 5) pool = pool.concat(["mover","fly","enemy"]);

  while(col < endCol - 6){
    var f = pickOf(rnd, pool), w, row;
    if(f === "flat"){ col += irnd(rnd,3,5); }
    else if(f === "coins"){ coins(12, col, irnd(rnd,2,3)); col += 5; }
    else if(f === "pit" || f === "mover"){
      var mover = (f === "mover");
      w = mover ? irnd(rnd,4,5) : irnd(rnd, 2, idx >= 3 ? 3 : 2);
      if(col + w > endCol - 6){ col += 3; continue; }
      carve(col, w);
      if(mover){
        movers.push({ tx:col, ty:11, tw:3, axis:"x", dist:Math.max(2, w-3),
                      speed:0.018 + rnd()*0.008, phase:rnd()*6.28 });
        coins(10, col+1, 2);
      } else if(rnd() < 0.5) coins(11, col, w);
      col += w + 4;                     // запас на разбег перед следующей фичей
    }
    else if(f === "spikes"){
      w = irnd(rnd,1,2);
      for(i=0;i<w;i++) g[12][col+i] = "^";
      col += w + 4;
    }
    else if(f === "enemy"){ g[12][col] = "x"; col += 6; }
    else if(f === "locker"){ g[12][col] = "?"; col += 4; }
    else if(f === "ball"){ g[12][col] = "m"; col += 4; }
    else if(f === "bell"){ g[12][col] = "B"; col += 4; }
    else if(f === "fly"){ g[irnd(rnd,7,9)][col] = "v"; col += 4; }
    else if(f === "platform"){
      w = irnd(rnd,3,5); row = irnd(rnd,10,11);
      for(i=0;i<w;i++) g[row][col+i] = "=";
      coins(row-1, col+1, Math.min(w-1, irnd(rnd,1,3)));
      plats.push({ x:col + Math.floor(w/2), y:row-1 });
      col += w + 2;
    }
    else if(f === "pad"){
      g[12][col] = "J";
      var prow = irnd(rnd,5,6), pw = irnd(rnd,3,4), px = Math.max(1, col + irnd(rnd,-1,1));
      for(i=0;i<pw;i++) if(px+i < W-1) g[prow][px+i] = "=";
      coins(prow-1, px, Math.min(pw, 3));
      plats.push({ x:px + 1, y:prow-1 });
      col += pw + 3;
    }
  }

  g[12][endCol] = "E";

  /* ключ кладём на площадку, а если их нет — на ровную землю */
  if(withKey){
    if(plats.length){
      var pl = plats[Math.floor(rnd()*plats.length)];
      g[pl.y][pl.x] = "K";
    } else {
      for(x = Math.floor(endCol/2); x < endCol-2; x++)
        if(g[12][x] === "." && g[13][x] === "#"){ g[12][x] = "K"; break; }
    }
  }

  /* минимум пирожков, чтобы уровень не был пустым */
  var got = 0;
  for(y=0;y<H;y++) for(x=0;x<W;x++) if(g[y][x] === "o") got++;
  for(i=0; got < 6 && i < 200; i++){
    x = irnd(rnd, 4, endCol-2);
    if(g[12][x] === "." && g[13][x] === "#"){ g[12][x] = "o"; got++; }
  }

  /* страховка: всё, что стоит на земле, должно стоять на твёрдом */
  for(x=0;x<W;x++)
    if("@Ex^JKo?mB".indexOf(g[12][x]) >= 0 && g[13][x] !== "#"){ g[13][x] = "#"; g[14][x] = "#"; }

  return { name:name, hint:pickOf(rnd, GEN_HINTS),
           rows: g.map(function(r){ return r.join(""); }), movers:movers };
}

function genLevels(seed){
  var rnd = mulberry(hashSeed(seed));
  var names = GEN_NAMES.slice(), out = [], i, n;
  var keyLevel = irnd(rnd, 2, 5);
  for(i=0;i<7;i++){
    n = names.length ? names.splice(Math.floor(rnd()*names.length), 1)[0] : "Этаж " + (i+1);
    out.push(genLevel(rnd, i, n, i === keyLevel));
  }
  return out;
}

/* Значок бейджа: маленький вектор, чтобы сетка читалась без подписей. */
function badgeIcon(k, x, y, s, col){
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.strokeStyle = col;
  ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if(k === "dev"){                                   /* угловые скобки */
    ctx.beginPath(); ctx.moveTo(-3,-6); ctx.lineTo(-9,0); ctx.lineTo(-3,6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3,-6); ctx.lineTo(9,0); ctx.lineTo(3,6); ctx.stroke();
  } else if(k === "helper"){                         /* подарок */
    rrect(-8,-3,16,10,2); ctx.fill();
    rrect(-9,-7,18,5,1.5); ctx.fill();
    ctx.fillStyle = "#0d1626"; ctx.fillRect(-1.2,-7,2.4,14);
  } else if(k === "guest"){                          /* звезда */
    ctx.beginPath();
    for(var i=0;i<10;i++){ var a = -Math.PI/2 + i*Math.PI/5, r = i%2 ? 3.6 : 8.6;
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
    ctx.closePath(); ctx.fill();
  } else if(k === "day7"){                           /* календарь */
    rrect(-8,-6,16,13,2); ctx.fill();
    ctx.fillStyle = "#0d1626"; ctx.fillRect(-8,-6,16,4);
    ctx.fillStyle = col; ctx.fillRect(-5,-9,2,4); ctx.fillRect(3,-9,2,4);
    ctx.fillStyle = "#0d1626"; text("7", 0, 5, 9, "#0d1626", "center", 700);
  } else if(k === "hard"){                           /* череп попроще: щит с крестом */
    ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(8,-5); ctx.lineTo(8,3);
    ctx.lineTo(0,9); ctx.lineTo(-8,3); ctx.lineTo(-8,-5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#0d1626"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-3,-3); ctx.lineTo(3,3); ctx.moveTo(3,-3); ctx.lineTo(-3,3); ctx.stroke();
  } else if(k === "fast"){                           /* молния */
    ctx.beginPath(); ctx.moveTo(2,-9); ctx.lineTo(-6,1); ctx.lineTo(-1,1);
    ctx.lineTo(-2,9); ctx.lineTo(6,-1); ctx.lineTo(1,-1); ctx.closePath(); ctx.fill();
  } else if(k === "skins"){                          /* футболка */
    ctx.beginPath(); ctx.moveTo(-8,-5); ctx.lineTo(-3,-7); ctx.lineTo(3,-7); ctx.lineTo(8,-5);
    ctx.lineTo(6,-1); ctx.lineTo(4,-2); ctx.lineTo(4,8); ctx.lineTo(-4,8); ctx.lineTo(-4,-2);
    ctx.lineTo(-6,-1); ctx.closePath(); ctx.fill();
  } else if(k === "high"){                           /* три ступени вверх */
    ctx.fillRect(-9,2,5,6); ctx.fillRect(-2.5,-2,5,10); ctx.fillRect(4,-7,5,15);
  } else if(k === "class"){                          /* галочка в круге */
    ctx.beginPath(); ctx.arc(0,0,8.5,0,6.2832); ctx.fill();
    ctx.strokeStyle = "#0d1626"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(-1,3.4); ctx.lineTo(4.4,-3.4); ctx.stroke();
  } else if(k === "rich"){                           /* монета */
    ctx.beginPath(); ctx.ellipse(0,0,8.6,7,0,0,6.2832); ctx.fill();
    ctx.fillStyle = "#0d1626"; text("Б", 0, 3.6, 10, "#0d1626", "center", 700);
  } else if(k === "clean"){                          /* искра */
    ctx.beginPath();
    ctx.moveTo(0,-9); ctx.quadraticCurveTo(1.6,-1.6,9,0);
    ctx.quadraticCurveTo(1.6,1.6,0,9); ctx.quadraticCurveTo(-1.6,1.6,-9,0);
    ctx.quadraticCurveTo(-1.6,-1.6,0,-9); ctx.fill();
  } else if(k === "all"){                            /* корона */
    ctx.beginPath(); ctx.moveTo(-9,6); ctx.lineTo(-9,-6); ctx.lineTo(-4,-1);
    ctx.lineTo(0,-8); ctx.lineTo(4,-1); ctx.lineTo(9,-6); ctx.lineTo(9,6); ctx.closePath(); ctx.fill();
  } else if(k === "last"){                           /* звонок */
    ctx.beginPath(); ctx.moveTo(-7,4); ctx.quadraticCurveTo(-7,-7,0,-8);
    ctx.quadraticCurveTo(7,-7,7,4); ctx.closePath(); ctx.fill();
    ctx.fillRect(-9,4,18,2.4);
    ctx.beginPath(); ctx.arc(0,8.6,2,0,6.2832); ctx.fill();
  } else if(k === "seed"){                           /* кубик */
    rrect(-8,-8,16,16,4); ctx.fill();
    ctx.fillStyle = "#0d1626";
    ctx.beginPath(); ctx.arc(-4,-4,1.7,0,6.2832); ctx.arc(4,4,1.7,0,6.2832);
    ctx.arc(0,0,1.7,0,6.2832); ctx.fill();
  } else if(k === "chaos"){                          /* вихрь */
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-8,-5); ctx.lineTo(8,-5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5,0); ctx.lineTo(7,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7,5); ctx.lineTo(3,5); ctx.stroke();
  } else {                                           /* combo: ×5 */
    text("×5", 0, 5, 14, col, "center", 700);
  }
  ctx.restore();
}
function badgeBy(k){
  for(var i=0;i<BADGES.length;i++) if(BADGES[i].k === k) return BADGES[i];
  return null;
}
function badgeGot(){
  var out = [], i;
  for(i=0;i<BADGES.length;i++) if(BADGES[i].ok()) out.push(BADGES[i]);
  return out;
}
function badgeShown(){                    // выбранный бейдж, если он ещё заслужен
  var b = badgeBy(PROF.badge);
  return (b && b.ok()) ? b : null;
}

/* ================== ПОДАРКИ ==================
   Сервера у игры нет, поэтому приз ездит в самом коде: в нём лежат
   пирожки, булки и пятёрки плюс подпись, чтобы случайный набор букв
   не сработал. Код одноразовый — браузер помнит, что уже открывал. */
var GIFT_SALT = "peremena/arbuz/2026";
function giftSign(body){
  var h = 2166136261, i, str = GIFT_SALT + "|" + body + "|" + GIFT_SALT;
  for(i=0;i<str.length;i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619) >>> 0;
  for(i=0;i<20000;i++){
    h ^= h >>> 13;
    h = Math.imul(h, 2246822519) >>> 0;
    h = ((h << 5) | (h >>> 27)) >>> 0;
  }
  return ("0000" + h.toString(36)).slice(-4).toUpperCase();
}
function giftCode(g){                     // приз -> код, который можно продиктовать
  var body = [(g.p|0).toString(36), (g.b|0).toString(36), (g.s|0).toString(36),
              Math.floor(Math.random()*46655 + 1).toString(36)].join("-").toUpperCase();
  return body + "-" + giftSign(body);
}
function giftRead(code){                  // код -> приз, если подпись сходится
  code = String(code || "").toUpperCase().replace(/[^A-Z0-9-]/g, "");
  var part = code.split("-");
  if(part.length !== 5) return null;
  if(giftSign(part.slice(0, 4).join("-")) !== part[4]) return null;
  var g = { p: parseInt(part[0], 36) || 0,
            b: parseInt(part[1], 36) || 0,
            s: parseInt(part[2], 36) || 0 };
  if(g.p > 9999 || g.b > 99999 || g.s > 999) return null;   // явная подделка
  if(!(g.p || g.b || g.s)) return null;
  return { g:g, id:code };
}
function giftText(g){
  var out = [];
  if(g.p) out.push(g.p + " пирожков");
  if(g.b) out.push(g.b + " булок");
  if(g.s) out.push(g.s + " пятёрок");
  return out.join(" и ");
}
function giftGive(g, why){                // пирожок в кармане — это булка
  if(g.p){ stat("pies", g.p); stat("buns", g.p); }
  if(g.b) stat("buns", g.b);
  if(g.s) STATS.stars = stars() + (g.s | 0);
  statBump();
  toast((why ? why + ": " : "") + "+" + giftText(g));
  sfx.win();
}
function giftUsed(id){
  try{ return (localStorage.getItem("peremena_gifts") || "").split(",").indexOf(id) >= 0; }
  catch(e){ return false; }
}
function giftMark(id){
  try{
    var was = (localStorage.getItem("peremena_gifts") || "").split(",").filter(Boolean);
    was.push(id);
    while(was.length > 60) was.shift();
    localStorage.setItem("peremena_gifts", was.join(","));

}
function giftClaim(code, why){            // открыть код: и по ссылке, и руками
  var got = giftRead(code);
  if(!got){ toast("Код не подошёл"); sfx.hurt(); return false; }
  if(giftUsed(got.id)){ toast("Этот код уже открывали"); sfx.hurt(); return false; }
  giftMark(got.id);
  giftGive(got.g, why || "Подарок");

}

function evTaken(k){ return evList().indexOf(k) >= 0; }
function evTake(ev){
  if(!ev || !ev.gift || evTaken(ev.k) || eventDays(ev) > 0) return;
  var was = evList().slice();
  was.push(ev.k);

  sfx.win();
}
function evSched(ev){                     // вернуть событие на свою дату

  var today = dayKey(new Date());
  if(DAILY.day === today) return;
  var rnd = mulberry(hashSeed("zadaniya/" + today)), pool = TASK_POOL.slice(), picked = [], i;
  for(i=0;i<3 && pool.length;i++) picked.push(pool.splice(Math.floor(rnd()*pool.length), 1)[0]);
  DAILY = { day: today, reward: 50 + 25 * Math.min(7, STATS.days || 1),

function taskReady(){
  var n = 0, i, t, tpl;
  for(i=0;i<DAILY.tasks.length;i++){
    t = DAILY.tasks[i]; tpl = taskBy(t.k);
    if(tpl && !t.taken && t.have >= tpl.v) n++;
  }
  return n;
}
function taskBump(kind, n){
  var hit = false, i, t, tpl, before;
  n = n || 1;
  for(i=0;i<DAILY.tasks.length;i++){
    t = DAILY.tasks[i]; tpl = taskBy(t.k);
    if(!tpl || tpl.s !== kind || t.taken) continue;
    before = t.have;
    t.have = (kind === "combo") ? Math.max(t.have, n) : Math.min(tpl.v, t.have + n);
    if(before < tpl.v && t.have >= tpl.v){ toast("Задание дня выполнено: " + tpl.n); sfx.key(); }
    hit = true;
  }
  if(hit) dailySave();
}

  var i, t, tpl;

    t = DAILY.tasks[i]; tpl = taskBy(t.k);

    t.taken = true;
    STATS.buns += tpl.r;
    stat("tasksDone");
    dailySave(); statBump();
    toast("+" + tpl.r + " булок за задание");
    sfx.win();
    return;
  }
}

}

function stagesAt(n){                       // сколько скинов доросло до этапа n
  var c = 0, i;
  for(i=0;i<SKINS.length;i++) if(skinMaxStage(SKINS[i].k) >= n) c++;
  return c;
}
function achValue(a){
  if(a.s === "skins") return STATS.owned.length;
  if(a.s === "badges") return badgeGot().length;
  if(a.s === "stage2") return stagesAt(2);
  if(a.s === "stage3") return stagesAt(3);
  return STATS[a.s] || 0;
}
function achDone(a){ return STATS.achs.indexOf(a.k) >= 0; }
/* сундуки за количество собранных достижений */
var ACH_CHESTS = [
  { need:5,  buns:150,  st:2  },
  { need:15, buns:400,  st:5  },
  { need:30, buns:900,  st:10 },
  { need:45, buns:2000, st:20, skin:"king" }
];
function chestReady(){
  var n = STATS.achs.length, i, got = STATS.achChest || 0;
  for(i=got;i<ACH_CHESTS.length;i++) if(n >= ACH_CHESTS[i].need) return i;
  return -1;
}
function claimChest(){
  var i = chestReady();
  if(i < 0) return;
  var c = ACH_CHESTS[i];
  STATS.achChest = i + 1;
  STATS.buns += c.buns;
  STATS.stars = stars() + c.st;
  if(c.skin && !owns(c.skin)) STATS.owned.push(c.skin);
  statBump();
  sfx.win();
  toast("Сундук открыт: +" + c.buns + " булок и +" + c.st + " пятёрок" +
        (c.skin ? " и скин «" + skinBy(c.skin).n + "»" : ""));
}
function achBuns(){                       // сколько булок уже принесли достижения
  var sum = 0, i;
  for(i=0;i<ACHS.length;i++) if(achDone(ACHS[i])) sum += ACHS[i].r;
  return sum;
}
function achCheck(){
  var i, a, got = 0;
  for(i=0;i<ACHS.length;i++){
    a = ACHS[i];
    if(achDone(a) || achValue(a) < a.v) continue;
    STATS.achs.push(a.k);
    STATS.buns += a.r;
    if(a.st) STATS.stars = stars() + a.st;
    got++;
    G.achQueue.push(a);
    buzz(40);
  }
  if(G.achQueue.length > 3){                 // пачку показываем коротко, а не по одному
    var extra = G.achQueue.length - 3;
    G.achQueue.length = 3;
    toast("и ещё " + extra + " достижени" + (extra < 5 ? "я" : "й"));
  }
  if(got){ statSave(); sfx.key(); }
  return got;
}
var curSkin = "pupil";
function statLoad(){
  try{
    var raw = JSON.parse(localStorage.getItem("peremena_stats") || "null");
    if(raw){
      for(var k in STATS) if(typeof raw[k] === "number" && typeof STATS[k] === "number") STATS[k] = raw[k];
      if(raw.owned && raw.owned.length) STATS.owned = raw.owned;
      if(raw.achs) STATS.achs = raw.achs;
      if(raw.wear) STATS.wear = raw.wear;
      if(raw.stage) STATS.stage = raw.stage;
      if(raw.upg) STATS.upg = raw.upg;
      if(typeof raw.evPrize === "string") STATS.evPrize = raw.evPrize;
      if(typeof raw.lastDay === "string") STATS.lastDay = raw.lastDay;
    }
    curSkin = localStorage.getItem("peremena_skin") || "pupil";
  }catch(e){}
  if(!owns(curSkin)) curSkin = "pupil";
}
function dayKey(d){ return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function dayStreak(){                    // «захожу каждую перемену» — считаем дни подряд
  var now = new Date(), today = dayKey(now);
  if(STATS.lastDay === today) return;
  var y = new Date(now.getTime() - 86400000);
  STATS.days = (STATS.lastDay === dayKey(y)) ? (STATS.days || 0) + 1 : 1;
  STATS.lastDay = today;
  statSave();
}
function statBump(){ statSave(); achCheck(); }
function statSave(){
  try{
    localStorage.setItem("peremena_stats", JSON.stringify(STATS));
    localStorage.setItem("peremena_skin", curSkin);
  }catch(e){}
}
function stat(k, n){ STATS[k] = (STATS[k] || 0) + (n || 1); }
function skinBy(k){
  for(var i=0;i<SKINS.length;i++) if(SKINS[i].k === k) return SKINS[i];
  return SKINS[0];
}
function owns(k){ return STATS.owned.indexOf(k) >= 0; }
var STAGE_NEED = [0, 5, 15];              // уровней в этом образе для II и III этапа
function skinWear(k){ return STATS.wear[k] || 0; }
function skinMaxStage(k){
  var w = skinWear(k);
  return w >= STAGE_NEED[2] ? 3 : (w >= STAGE_NEED[1] ? 2 : 1);
}
function skinStage(k){
  var pick = STATS.stage[k] || skinMaxStage(k);
  return Math.min(pick, skinMaxStage(k));
}
function setStage(k, n){
  if(n > skinMaxStage(k)){
    toast("Этап откроется после " + STAGE_NEED[n-1] + " уровней в этом образе");
    sfx.hurt();
    return;
  }
  STATS.stage[k] = n;
  if(curSkin !== k && owns(k)) curSkin = k;
  statSave();
  sfx.key();
  toast(skinBy(k).n + " — этап " + ["I","II","III"][n-1]);
}
function skinView(k){                     // скин с учётом выбранного этапа
  var sk = skinBy(k), out = {}, p;
  for(p in sk) out[p] = sk[p];
  out.stage = skinStage(k);
  return out;
}
function buyUpgrade(k){
  var u = upgBy(k), price = upgPrice(k);
  if(!u) return;
  if(price === null){ toast("Уже куплено"); return; }
  if(STATS.buns < price){ toast("Не хватает булок: нужно " + price); sfx.hurt(); return; }
  STATS.buns -= price;
  STATS.spent += price;
  STATS.bought++;
  STATS.upg[k] = upg(k) + 1;
  STATS.upgTotal++;
  statBump();
  sfx.win();
  toast(u.n + " — уровень " + upg(k));
}
function buyStartItem(k){
  if(!ITEMS[k]) return;
  if(startItem === k){ startItemSet(null); toast("Предмет убран из портфеля"); return; }
  var price = ITEM_PRICE[k];
  if(STATS.buns < price){ toast("Не хватает булок: нужно " + price); sfx.hurt(); return; }
  STATS.buns -= price;
  STATS.spent += price;
  STATS.bought++;
  startItemSet(k);
  statBump();
  sfx.box();
  toast(ITEMS[k].n + " — в портфель на старт");
}
function buySkin(sk){
  if(owns(sk.k)){ curSkin = sk.k; statSave(); sfx.key(); toast("Надет: " + sk.n); return; }
  if(STATS.buns < sk.price){ toast("Не хватает булок: нужно " + sk.price); sfx.hurt(); return; }
  STATS.buns -= sk.price;
  STATS.spent += sk.price;
  STATS.owned.push(sk.k);
  curSkin = sk.k;
  statBump();
  sfx.win();
  toast("Куплено: " + sk.n + "!");
}

/* Предмет урока и вопросы должны совпадать: у каждого вопроса свой предмет. */
/* Дорожки диктанта живут под доской и правее учителя — одни числа на всех. */
var NOTE_Y = [288, 334], NOTE_HIT = 264, NOTE_X = 232, NOTE_W = 540;
var QUIZ_SUBJ = (function(){
  var out = [], seen = {}, i;
  for(i=0;i<QUIZ.length;i++) if(!seen[QUIZ[i].s]){ seen[QUIZ[i].s] = 1; out.push(QUIZ[i].s); }
  return out;
})();
function quizPool(subj){
  var out = [], i;
  for(i=0;i<QUIZ.length;i++) if(QUIZ[i].s === subj) out.push(i);
  return out.length >= 3 ? out : null;
}
function shuffleQuestion(src, r){
  var a = src.a.slice(), i, j, t;
  for(i = a.length - 1; i > 0; i--){              // тасуем Фишером — Йетсом
    j = Math.floor(r() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return { q: src.q, a: a, r: a.indexOf(src.a[0]) };   // верный ответ всегда первый в таблице
}
function lessonCfg(){
  return {
    strict: mod("strict"), exam: mod("exam"), easy: mod("easyclass"),
    bonus: mod("favorite") ? 30 : 15,
    pts:   mod("favorite") ? 200 : 100
  };
}
function startLesson(i, force){
  var r = mulberry(hashSeed(curSeed + "les" + i + curDiff.key));
  var kinds = ["copy","quiz","notes","canteen","pushups","sleep","chem","verse"];
  var cfg = lessonCfg();
  var kind = force || kinds[Math.floor(r()*kinds.length)];
  var subjList = (kind === "quiz" ? QUIZ_SUBJ : LESSON_SUBJ[kind]) || LESSON_NAMES;
  var L = { kind: kind, i:i, t:0, done:false, ok:false, endT:0, cfg: cfg,
            subject: subjList[Math.floor(r()*subjList.length)],
            tag: LESSON_TAG[kind] || "урок" };
  if(L.kind === "copy"){
    L.prog = 0; L.phase = "away"; L.pt = 100; L.strikes = 0; L.stun = 0;
    L.limit = (cfg.strict ? 28 : 34)*60;
    L.maxStrikes = cfg.exam ? 2 : (cfg.easy ? 5 : 3);
  } else if(L.kind === "quiz"){
    L.qs = []; L.used = {};
    var pool = quizPool(L.subject);                  // вопросы строго по предмету урока
    while(L.qs.length < 3){
      var qi = pool ? pool[Math.floor(r()*pool.length)] : Math.floor(r()*QUIZ.length);
      if(L.used[qi]) continue;
      L.used[qi] = 1;
      L.qs.push(shuffleQuestion(QUIZ[qi], r));       // варианты каждый раз в новом порядке
    }
    L.qi = 0; L.right = 0; L.per = cfg.strict ? 6*60 : 9*60; L.qt = L.per; L.pick = -1; L.pickT = 0;
    L.need = cfg.exam ? 3 : (cfg.easy ? 1 : 2);
  } else if(L.kind === "notes"){
    L.notes = []; L.spawn = 20; L.left = 12; L.hits = 0; L.miss = 0; L.pop = 0; L.popT = 0;
    L.need = cfg.exam ? 10 : (cfg.easy ? 5 : 8);
    L.speed = cfg.strict ? 4.1 : 3.1;
  } else if(L.kind === "canteen"){
    L.need = cfg.exam ? 12 : (cfg.easy ? 5 : 9);
    L.tray = VW/2; L.items = []; L.caught = 0; L.bad = 0;
    L.left = L.need + 6;                      // с запасом на тряпки и промахи
    L.spawn = 25; L.fall = cfg.strict ? 3.6 : 2.8;
  } else if(L.kind === "chem"){
    /* Лабораторная: метка бегает по шкале, капать надо в зелёной зоне. */
    L.need = cfg.exam ? 5 : (cfg.easy ? 2 : 4);
    L.hits = 0; L.miss = 0; L.pos = 0; L.vel = cfg.strict ? 0.017 : 0.013;
    L.zone = cfg.easy ? 0.22 : (cfg.exam ? 0.12 : 0.17);
    L.mid = 0.5; L.flashT = 0; L.good = false;
    L.limit = (cfg.strict ? 22 : 30)*60;
    L.maxMiss = cfg.exam ? 1 : (cfg.easy ? 5 : 3);
  } else if(L.kind === "verse"){
    /* Наизусть: учитель показывает строчку жестами, её надо повторить. */
    L.seq = []; L.step = 0; L.showI = 0; L.round = 0;
    L.rounds = cfg.exam ? 4 : (cfg.easy ? 2 : 3);
    L.len = cfg.strict ? 4 : 3;
    L.phase = "show"; L.pt = 40; L.bad = 0; L.lit = -1; L.litT = 0;
    L.maxBad = cfg.exam ? 0 : (cfg.easy ? 3 : 1);
    L.limit = (cfg.strict ? 26 : 36)*60;
  } else if(L.kind === "pushups"){
    L.reps = 0; L.down = 0; L.next = "left";
    L.limit = (cfg.strict ? 16 : 22)*60;
    L.need = cfg.exam ? 18 : (cfg.easy ? 8 : 13);
  } else {
    L.eye = 100; L.blink = 0; L.zzz = 0;
    L.limit = (cfg.strict ? 28 : 22)*60;
    L.drain = cfg.strict ? 0.42 : 0.3;
  }
  G.lesson = L;
  G.state = "lesson";
  G.wipe = 26;
}
function lessonEnd(ok){
  var L = G.lesson;
  if(L.done) return;
  L.done = true; L.ok = ok; L.endT = 100;
  if(ok){ G.timeLeft += L.cfg.bonus; G.bonusPts += L.cfg.pts; stat("lessonsOk");
          if(L.kind === "chem") stat("chemOk");
          if(L.kind === "verse") stat("verseOk");
          taskBump("lessons"); sfx.win(); }
  else { G.timeLeft = Math.max(8, G.timeLeft - 10); stat("lessonsBad"); sfx.fail(); }
  statBump();
}
function lessonAnswer(n){
  var L = G.lesson;
  if(!L || L.kind !== "quiz" || L.done || L.pickT > 0) return;
  if(L.qi >= L.qs.length) return;
  var q = L.qs[L.qi];
  L.pick = n; L.pickT = 45;
  if(n === q.r){ L.right++; stat("quizOk"); buzz(10); sfx.coin(); }
  else { G.shake = 5; buzz(35); sfx.hurt(); }
}
function lessonPress(k){
  var L = G.lesson;
  if(!L || L.done) return;
  if(L.kind === "pushups" && (k === "left" || k === "right")){
    if(k === L.next){
      L.reps++; L.down = 12;
      L.next = (k === "left") ? "right" : "left";
      puff(VW/2, 330, 4, "#8bffcf", 2);
      tone(300 + (L.reps % 6)*30, 0.06, "square", 0.05, 80);
      if(L.reps >= L.need) lessonEnd(true);
    } else {
      G.shake = 5; sfx.hurt();
    }
    return;
  }
  if(L.kind === "chem" && k === "jump"){
    var d = Math.abs(L.pos - L.mid);
    if(d <= L.zone/2){
      L.hits++; L.flashT = 14; L.good = true;
      L.mid = 0.2 + Math.random()*0.6;            // зона переезжает
      L.vel *= 1.06;
      puff(VW/2, 300, 8, "#8bffcf", 2.4);
      tone(520 + L.hits*40, 0.08, "triangle", 0.05, 90);
      if(L.hits >= L.need) lessonEnd(true);
    } else {
      L.miss++; L.flashT = 14; L.good = false;
      G.shake = 7; sfx.hurt();
      if(L.miss >= L.maxMiss) lessonEnd(false);
    }
    return;
  }
  if(L.kind === "verse" && L.phase === "say" &&
     (k === "left" || k === "right" || k === "jump")){
    L.lit = ["left","jump","right"].indexOf(k); L.litT = 12;
    if(k === L.seq[L.step]){
      L.step++;
      tone(520 + L.step*40, 0.06, "triangle", 0.05);
      if(L.step >= L.seq.length){
        L.round++;
        if(L.round >= L.rounds){ lessonEnd(true); return; }
        L.seq = []; L.phase = "show"; L.pt = 40;
        pop(VW/2, 220, "ВЕРНО!", "#8bffcf", 18);
      }
    } else {
      L.bad++; G.shake = 8; sfx.hurt();
      if(L.bad > L.maxBad){ lessonEnd(false); return; }
      L.seq = []; L.phase = "show"; L.pt = 40; L.step = 0;
      pop(VW/2, 220, "не та строчка", "#ff8a8a", 15);
    }
    return;
  }
  if(L.kind === "sleep" && k === "jump"){
    L.eye = Math.min(100, L.eye + 11);
    L.blink = 8;
    tone(520, 0.05, "triangle", 0.04, 120);
    return;
  }
  if(L.kind === "notes" && (k === "left" || k === "right")){
    var lane = (k === "left") ? 0 : 1, i, nt, best = -1, bd = 99, d;
    for(i=0;i<L.notes.length;i++){
      nt = L.notes[i];
      if(nt.lane !== lane || nt.hit) continue;
      d = Math.abs(nt.x - NOTE_HIT);
      if(d < bd){ bd = d; best = i; }
    }
    if(best >= 0 && bd < 40){
      L.notes[best].hit = true; L.hits++;
      L.pop = 1; L.popT = 18;
      puff(NOTE_HIT, NOTE_Y[lane], 8, "#8bffcf", 2.4);
      sfx.coin();
    } else {
      L.miss++; L.pop = -1; L.popT = 18; sfx.hurt();
    }
  }
}
function lessonUpdate(){
  var L = G.lesson, i, nt;
  if(!L) return;
  L.t++;
  if(L.done){
    if(--L.endT <= 0){
      if(mod("dbllesson") && !L.second){ startLesson(L.i + 100, null); G.lesson.second = true; }
      else { G.state = "play"; G.wipe = 26; }
    }
    return;
  }
  if(L.kind === "copy"){
    if(L.stun > 0) L.stun--;
    if(--L.pt <= 0){
      if(L.phase === "away"){ L.phase = "turn"; L.pt = L.cfg.strict ? 20 : 32; }
      else if(L.phase === "turn"){ L.phase = "watch"; L.pt = (L.cfg.strict ? 80 : 60) + Math.floor(Math.random()*70); }
      else { L.phase = "away"; L.pt = (L.cfg.strict ? 50 : 80) + Math.floor(Math.random()*90); }
    }
    if(input.jump && L.stun <= 0){
      if(L.phase === "watch"){
        L.strikes++; L.stun = 40;
        L.prog = Math.max(0, L.prog - 16);
        G.shake = 12; sfx.hurt();
        toast(L.strikes >= L.maxStrikes ? "Попался!" : "Учитель смотрит!");
        if(L.strikes >= L.maxStrikes) lessonEnd(false);
      } else {
        L.prog += 0.8;
        if(L.t % 6 === 0) puff(VW/2 + rnd(-40,40), 336, 2, "#ffd166", 1);
        if(L.prog >= 100) lessonEnd(true);
      }
    }
    if(--L.limit <= 0) lessonEnd(false);
  } else if(L.kind === "quiz"){
    if(L.pickT > 0){
      if(--L.pickT <= 0){
        L.pick = -1; L.qi++; L.qt = L.per;
        if(L.qi >= L.qs.length) lessonEnd(L.right >= L.need);
      }
      return;
    }
    if(--L.qt <= 0){ L.pick = 9; L.pickT = 45; sfx.hurt(); }
  } else if(L.kind === "canteen"){
    var it, k2;
    L.tray += ((input.right?1:0) - (input.left?1:0)) * 6;
    L.tray = clamp(L.tray, 70, VW-70);
    if(L.left > 0 && --L.spawn <= 0){
      L.spawn = (L.cfg.strict ? 20 : 28) + Math.floor(Math.random()*16);
      L.items.push({ x: rnd(90, VW-90), y:-20, bad: Math.random() < 0.18, sp:0 });
      L.left--;
    }
    for(k2=L.items.length-1; k2>=0; k2--){
      it = L.items[k2];
      it.y += L.fall; it.sp += 0.08;
      if(it.y > VH-158 && it.y < VH-116 && Math.abs(it.x - L.tray) < 48){
        L.items.splice(k2,1);
        if(it.bad){
          L.bad++; L.caught = Math.max(0, L.caught - 1);
          G.shake = 6; sfx.hurt(); toast("Тряпка в подносе!");
        } else {
          L.caught++; sfx.coin();
          puff(it.x, VH-140, 7, "#ffd166", 2.2);
        }
        continue;
      }
      if(it.y > VH + 20) L.items.splice(k2,1);
    }
    if(L.left <= 0 && !L.items.length) lessonEnd(L.caught >= L.need);
  } else if(L.kind === "chem"){
    L.pos += L.vel;
    if(L.pos > 1){ L.pos = 1; L.vel = -L.vel; }
    if(L.pos < 0){ L.pos = 0; L.vel = -L.vel; }
    if(L.flashT > 0) L.flashT--;
    if(--L.limit <= 0) lessonEnd(L.hits >= L.need);
  } else if(L.kind === "verse"){
    if(L.litT > 0 && --L.litT <= 0) L.lit = -1;
    if(L.phase === "show"){
      if(--L.pt <= 0){
        if(!L.seq.length){                       // новая строчка
          var q, abc = ["left","jump","right"];
          for(q=0;q<L.len + L.round;q++) L.seq.push(abc[Math.floor(Math.random()*3)]);
          L.showI = 0; L.pt = 26;
        } else if(L.showI < L.seq.length){
          L.lit = ["left","jump","right"].indexOf(L.seq[L.showI]);
          L.litT = 20; L.showI++; L.pt = 30;
          tone(420 + L.lit*110, 0.09, "triangle", 0.05);
        } else {
          L.phase = "say"; L.step = 0; L.pt = 0; L.lit = -1;
        }
      }
    }
    if(--L.limit <= 0) lessonEnd(L.round >= L.rounds);
  } else if(L.kind === "pushups"){
    if(L.down > 0) L.down--;
    if(--L.limit <= 0) lessonEnd(L.reps >= L.need);
  } else if(L.kind === "sleep"){
    if(L.blink > 0) L.blink--;
    L.eye -= L.drain;
    if(L.eye < 40 && L.t % 24 === 0){
      G.parts.push({ x:VW/2 + rnd(-30,30), y:250, vx:rnd(-0.3,0.3), vy:-0.7,
                     life:60, max:60, col:"#9fd8ff", s:4, g:0 });
    }
    if(L.eye <= 0) lessonEnd(false);
    else if(--L.limit <= 0) lessonEnd(true);
  } else {
    if(L.popT > 0) L.popT--;
    if(L.left > 0 && --L.spawn <= 0){
      L.spawn = 34 + Math.floor(Math.random()*16);
      L.notes.push({ lane: Math.random() < 0.5 ? 0 : 1, x: VW + 30, hit:false });
      L.left--;
    }
    for(i=L.notes.length-1; i>=0; i--){
      nt = L.notes[i];
      nt.x -= L.speed;
      if(nt.hit && nt.x < NOTE_HIT - 20){ L.notes.splice(i,1); continue; }
      if(!nt.hit && nt.x < NOTE_HIT - 46){ L.notes.splice(i,1); L.miss++; L.pop = -1; L.popT = 14; }
    }
    if(L.left <= 0 && !L.notes.length) lessonEnd(L.hits >= L.need);
  }
}

var ITEM_KEYS = ["soda","gum","bag","watch","pass","whistle","umbrella","magnetit"];
function rollItem(rnd){
  var total = 0, i, r;
  for(i=0;i<ITEM_KEYS.length;i++) total += ITEMS[ITEM_KEYS[i]].w;

var fancyNow = true, frameAvg = 16.7, slowT = 0, fastT = 0;

function gfxWatch(ms){
  frameAvg += (ms - frameAvg) * 0.08;
  if(frameAvg > 23){ slowT++; fastT = 0; } else if(frameAvg < 15){ fastT++; slowT = 0; }
  if(slowT > 90 && fancyNow){ fancyNow = false; slowT = 0; }

}
function tone(f, dur, type, vol, slide, delay){
  if(muted) return;
  vol = (vol || 0.07) * volK();
  var c = actx(); if(!c) return;
  var t0 = c.currentTime + (delay||0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(f, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(50, f+slide), t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}

   Открывается четырьмя нажатиями на заголовок в меню и кодом 2020.
   Всё, что она делает, помечает забег как читерский: рекорд не пишется. */
/* Кода в файле нет: сверяется только отпечаток, обратно он не разворачивается.
   Считается медленно (≈5 мс), чтобы перебор всех комбинаций не был мгновенным. */
var DEV_SALT = "peremena/zamok/2026";
var DEV_HASH = "e4b8eba1";
var DEV_LEN = 6;                         // шесть цифр — миллион вариантов вместо десяти тысяч
function codeHash(str){
  var h = 2166136261, i;
  str = DEV_SALT + "|" + str + "|" + DEV_SALT;
  for(i=0;i<str.length;i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619) >>> 0;
  for(i=0;i<1200000;i++){
    h ^= h >>> 15;
    h = Math.imul(h, 2246822519) >>> 0;
    h = ((h << 7) | (h >>> 25)) >>> 0;
  }
  return ("0000000" + h.toString(16)).slice(-8);
}

(function touchSetup(){
  isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if(!isTouch) return;
  document.body.classList.add("touch");

  /* Зона бега целиком: палец ездит между ◀ и ▶ не отрываясь от стекла,
     а промах мимо кружка на пару сантиметров всё равно считается. */
  var padL = document.getElementById("padL");
  var runKeys = padL.querySelectorAll(".btn"), runPtr = null;
  function dirAt(x, y){
    var i, r, best = null, bestD = 1e9, cx, d;
    for(i=0;i<runKeys.length;i++){
      r = runKeys[i].getBoundingClientRect();
      if(y < r.top - 60 || y > r.bottom + 60) continue;
      cx = (r.left + r.right) / 2;
      d = Math.abs(x - cx);
      if(x >= r.left - 30 && x <= r.right + 30 && d < bestD){ bestD = d; best = runKeys[i]; }
    }
    return best ? best.getAttribute("data-k") : null;
  }
  function setDir(k){
    if(input.left !== (k === "left")) setKey("left", k === "left");
    if(input.right !== (k === "right")) setKey("right", k === "right");
    for(var i=0;i<runKeys.length;i++)
      runKeys[i].classList.toggle("on", runKeys[i].getAttribute("data-k") === k);
  }
  padL.addEventListener("pointerdown", function(e){
    e.preventDefault();
    runPtr = e.pointerId;
    try{ padL.setPointerCapture(e.pointerId); }catch(err){}
    setDir(dirAt(e.clientX, e.clientY));
  });
  padL.addEventListener("pointermove", function(e){
    if(e.pointerId !== runPtr) return;
    setDir(dirAt(e.clientX, e.clientY));
  });
  function offRun(e){
    if(e.pointerId !== runPtr) return;
    runPtr = null; setDir(null);
  }
  padL.addEventListener("pointerup", offRun);
  padL.addEventListener("pointercancel", offRun);
  padL.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  var btns = document.querySelectorAll("#padR .btn");
  Array.prototype.forEach.call(btns, function(b){
    var k = b.getAttribute("data-k");
    b.addEventListener("pointerdown", function(e){
      e.preventDefault();
      try{ b.setPointerCapture(e.pointerId); }catch(err){}   // палец съехал — кнопка не залипнет
      b.classList.add("on"); setKey(k, true);
    });
    function off(){ b.classList.remove("on"); setKey(k, false); }
    b.addEventListener("pointerup", off);
    b.addEventListener("pointercancel", off);
    b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  });
})();

function buildLevel(def){
  var w = 0, i, j;
  for(i=0;i<def.rows.length;i++) w = Math.max(w, def.rows[i].length);
  var grid = [];
  for(i=0;i<def.rows.length;i++){
    var row = def.rows[i];
    while(row.length < w) row += ".";
    grid.push(row.split(""));
  }
  var lv = { name:def.name, theme:themeOf(def),
             hint:(isTouch && def.hintTouch) ? def.hintTouch : def.hint, w:w, h:grid.length, grid:grid,
             coins:[], enemies:[], pads:[], spikes:[], movers:[], lockers:[], stands:[],
             balls:[], bells:[], door:null,
             crack:{}, broke:{},
             shots:[],
             key:null, needKey: !!mod("locked"), start:{x:64,y:64}, coinTotal:0 };

  for(i=0;i<lv.h;i++) for(j=0;j<w;j++){
    var ch = grid[i][j], px = j*TS, py = i*TS;
    if(ch === "o"){ lv.coins.push({x:px+8, y:py+8, w:16, h:16, got:false, ph:rnd(0,6.28)}); grid[i][j]="."; }
    else if(ch === "@"){ lv.start = {x:px+6, y:py+4}; grid[i][j]="."; }
    else if(ch === "E"){
      lv.door = { x:px+3, y:py-14, w:26, h:46, cx:px+16 };
      /* вход засчитывается по всей колонке двери: перепрыгнуть выход нельзя.
         Поэтому над дверью в карте ничего не ставим. */
      lv.doorHit = { x:px, y:0, w:32, h:py+TS };
      grid[i][j]=".";
    }
    else if(ch === "K"){ lv.key = {x:px+8, y:py+10, w:16, h:14, got:false, ph:0}; lv.needKey=true; grid[i][j]="."; }
    else if(ch === "J"){ lv.pads.push({x:px+2, y:py+18, w:28, h:14, t:0}); grid[i][j]="."; }
    else if(ch === "x"){ if(!mod("empty")) lv.enemies.push(makeEnemy(px+3, py+4, "walk")); grid[i][j]="."; }
    else if(ch === "v"){ if(!mod("empty")) lv.enemies.push(makeEnemy(px+2, py+6, "fly")); grid[i][j]="."; }
    else if(ch === "g"){ if(!mod("empty")) lv.enemies.push(makeEnemy(px+2, py+2, "guard")); grid[i][j]="."; }
    else if(ch === "z"){ if(!mod("empty")) lv.enemies.push(makeEnemy(px+3, py+4, "sleep")); grid[i][j]="."; }
    else if(ch === "j"){ if(!mod("empty")) lv.enemies.push(makeEnemy(px+3, py+4, "throw")); grid[i][j]="."; }
    else if(ch === "^"){ lv.spikes.push({x:px+2, y:py+18, w:28, h:14}); }
    else if(STAND_INFO[ch]){ lv.stands.push({ x:px-6, y:py-40, w:44, h:72, kind:ch }); grid[i][j]="."; }
    else if(ch === "m"){ lv.balls.push({ x:px+6, y:py+8, w:20, h:20, vx:0, vy:0, spin:0, cool:0 }); grid[i][j]="."; }
    else if(ch === "B"){ lv.bells.push({ x:px+4, y:py+2, w:24, h:26, used:false, t:0 }); grid[i][j]="."; }
    else if(ch === "?"){ lv.lockers.push({ x:px+3, y:py+1, w:26, h:31, open:false, t:0, item:null }); grid[i][j]="."; }
  }
  lv.coinTotal = lv.coins.length;

  /* если шкафчиков в карте нет — ставим пару на свободную землю */
  if(lv.lockers.length < 2 && !mod("nobox") && !lv.stands.length){
    var lrnd = mulberry(hashSeed(def.name + "lockers")), put = 2 - lv.lockers.length, guard = 0;
    while(put > 0 && guard++ < 300){
      var lx = 5 + Math.floor(lrnd()*(w-10));
      if(grid[12][lx] !== "." || grid[13][lx] !== "#") continue;
      if(Math.abs(lx*TS - lv.start.x) < TS*3) continue;
      if(lv.door && Math.abs(lx*TS - lv.door.cx) < TS*3) continue;
      var busy = false, q;
      for(q=0;q<lv.lockers.length;q++) if(Math.abs(lv.lockers[q].x - lx*TS) < TS*6) busy = true;
      for(q=0;q<lv.spikes.length;q++) if(Math.abs(lv.spikes[q].x - lx*TS) < TS*2) busy = true;
      if(busy) continue;
      lv.lockers.push({ x:lx*TS+3, y:12*TS+1, w:26, h:31, open:false, t:0, item:null });
      put--;
    }
  }
  if(mod("nobox") || curDiff.brutal) lv.lockers = [];   // «Последний звонок»: карманы пустые

  /* мяч и кнопка звонка — школьные приколы, ставим на свободную землю */
  function freeSpot(seed, minFrom){
    var r = mulberry(hashSeed(def.name + seed)), guard = 0, gx, q, ok;
    while(guard++ < 260){
      gx = 5 + Math.floor(r()*(w-10));
      if(grid[12][gx] !== "." || grid[13][gx] !== "#") continue;
      if(Math.abs(gx*TS - lv.start.x) < TS*(minFrom || 3)) continue;
      if(lv.door && Math.abs(gx*TS - lv.door.cx) < TS*3) continue;
      ok = true;
      for(q=0;q<lv.lockers.length;q++) if(Math.abs(lv.lockers[q].x - gx*TS) < TS*3) ok = false;
      for(q=0;q<lv.spikes.length;q++) if(Math.abs(lv.spikes[q].x - gx*TS) < TS*2) ok = false;
      for(q=0;q<lv.balls.length;q++) if(Math.abs(lv.balls[q].x - gx*TS) < TS*4) ok = false;
      for(q=0;q<lv.bells.length;q++) if(Math.abs(lv.bells[q].x - gx*TS) < TS*4) ok = false;
      if(ok) return gx;
    }
    return -1;
  }
  if(mod("locked") && !lv.key && !lv.stands.length){
    var klx = freeSpot("lockedkey", 6);
    if(klx > 0) lv.key = { x:klx*TS+8, y:12*TS+10, w:16, h:14, got:false, ph:0 };
    else lv.needKey = false;                  // некуда положить — дверь не запираем
  }
  if(!lv.stands.length){
    if(!lv.balls.length){
      var bx = freeSpot("ball", 5);
      if(bx > 0) lv.balls.push({ x:bx*TS+6, y:12*TS+8, w:20, h:20, vx:0, vy:0, spin:0, cool:0 });
    }
    if(!lv.bells.length && lv.enemies.length >= 2){
      var kx = freeSpot("bell", 4);
      if(kx > 0) lv.bells.push({ x:kx*TS+4, y:12*TS+2, w:24, h:26, used:false, t:0 });
    }
  }

  /* «Толпа на перемене»: досыпаем завучей на свободные куски земли */
  if(mod("crowd") && !mod("empty")){
    var crnd = mulberry(hashSeed(def.name + "crowd")), extra = 2 + Math.round(lv.enemies.length * 0.6), tries = 0;
    var occupied = function(cx, cy){
      var k, e;
      for(k=0;k<lv.enemies.length;k++){ e = lv.enemies[k]; if(Math.abs(e.x - cx*TS) < TS*3 && Math.abs(e.y - cy*TS) < TS*2) return true; }
      for(k=0;k<lv.spikes.length;k++) if(Math.abs(lv.spikes[k].x - cx*TS) < TS*2) return true;
      if(lv.door && Math.abs(lv.door.cx - cx*TS) < TS*3) return true;
      return Math.abs(lv.start.x - cx*TS) < TS*4;
    };
    while(extra > 0 && tries++ < 400){
      var cx = 4 + Math.floor(crnd()*(w-8)), cy = 0;
      for(cy=1; cy<lv.h-1; cy++){
        if(!isSolidChar(grid[cy][cx]) || grid[cy][cx] === "=") continue;
        if(isSolidChar(grid[cy-1][cx]) || isSolidChar(grid[cy-2] ? grid[cy-2][cx] : ".")) continue;
        if(occupied(cx, cy-1)) continue;
        lv.enemies.push(makeEnemy(cx*TS+3, (cy-1)*TS+4, "walk"));
        extra--;
        break;
      }
    }
  }

  var ms = def.movers || [];
  for(i=0;i<ms.length;i++){
    var m = ms[i];
    lv.movers.push({ ox:m.tx*TS, oy:m.ty*TS, x:m.tx*TS, y:m.ty*TS,
      w:m.tw*TS, h:14, axis:m.axis, dist:m.dist*TS, speed:m.speed,
      t:m.phase||0, dx:0, dy:0, isMover:true });
  }
  if(mod("hunter")){
    for(i=0;i<lv.enemies.length;i++){
      var he = lv.enemies[i];
      if(he.fly || he.kind === "throw") continue;
      he.hunt = true; he.kind = "walk"; he.wake = 1;
      he.base = 1.05 * curDiff.enemy * (mod("fast") ? 1.4 : 1);
      he.vx = he.base;
      he.range = 999999;
      break;
    }
  }
  lv.uid = ++lvSeq;
  return lv;
}

/* Виды школьной охраны. Обычный завуч ходит взад-вперёд, остальные —
   каждый со своим характером: охранник в каске (на голову не прыгнуть),
   дремлющий стоит, пока не подойдёшь, а дежурный с журналом кидается им. */
var FOES = {
  walk:  { w:26, h:28, sp:0.85, tough:false, n:"Завуч" },
  fly:   { w:28, h:18, sp:1.50, tough:false, n:"Самолётик" },
  guard: { w:28, h:30, sp:0.58, tough:true,  n:"Охранник" },
  sleep: { w:26, h:28, sp:0.00, tough:false, n:"Дремлющий завуч" },
  throw: { w:26, h:28, sp:0.00, tough:false, n:"Дежурный с журналом" }
};
function makeEnemy(x, y, kind){
  if(kind === true) kind = "fly";                 // старый вызов: makeEnemy(x, y, true)
  if(kind === false || !kind) kind = "walk";
  var d = FOES[kind] || FOES.walk, fly = kind === "fly";
  var v = d.sp * (fly ? curDiff.fly : curDiff.enemy) * (mod("fast") ? 1.4 : 1);
  return { x:x, y:y, w:d.w, h:d.h,
           vx:v, base:v, vy:0, kind:kind, tough:d.tough,
           fly:fly, homeX:x,
           range: fly ? 999999 : TS*curDiff.range*(kind === "guard" ? 0.6 : 1),
           dead:false, deadT:0,
           dir:1, anim:0, hitWall:false, hunt:false,
           wake:0, cool:40 + Math.floor(Math.random()*60) };
}

/* ================== КОЛЛИЗИИ ================== */
function tileChar(cx, cy){
  var lv = G.level;
  if(cx < 0 || cx >= lv.w) return "#";           // невидимые стены по краям уровня
  if(cy < 0 || cy >= lv.h) return ".";           // сверху небо, снизу пропасть
  var ch = lv.grid[cy][cx];
  if(ch === "=" && lv.broke[cx + "," + cy] > 0) return ".";
  return ch;
}
function solidAt(cx, cy){ return isSolidChar(tileChar(cx, cy)); }
function solidAtPx(px, py){ return solidAt(Math.floor(px/TS), Math.floor(py/TS)); }

function collideTiles(e, axis){
  var x0 = Math.floor(e.x/TS), x1 = Math.floor((e.x+e.w-0.01)/TS);
  var y0 = Math.floor(e.y/TS), y1 = Math.floor((e.y+e.h-0.01)/TS);
  var cx, cy, hit = false;
  for(cy=y0; cy<=y1; cy++) for(cx=x0; cx<=x1; cx++){
    var ch = tileChar(cx,cy);
    if(!isSolidChar(ch)) continue;
    if(ch === "="){                              // доска: стоим сверху, снизу пролетаем насквозь
      if(axis === "x" || e.vy <= 0) continue;
      if(e.y + e.h - e.vy > cy*TS + 4) continue;
    }
    hit = true;
    if(axis === "x"){
      if(e.vx > 0) e.x = Math.min(e.x, cx*TS - e.w);
      else if(e.vx < 0) e.x = Math.max(e.x, (cx+1)*TS);
    } else {
      if(e.vy > 0){ e.y = Math.min(e.y, cy*TS - e.h); e.grounded = true; }
      else if(e.vy < 0) e.y = Math.max(e.y, (cy+1)*TS);
    }
  }
  if(hit){ if(axis === "x"){ e.vx = 0; e.hitWall = true; } else e.vy = 0; }
}

function collideMovers(e, axis){
  var ms = G.level.movers, i, m;
  for(i=0;i<ms.length;i++){
    m = ms[i];
    if(!overlap(e, m)) continue;
    if(axis === "x"){
      if(e.vx > 0) e.x = Math.min(e.x, m.x - e.w);
      else if(e.vx < 0) e.x = Math.max(e.x, m.x + m.w);
      e.vx = 0; e.hitWall = true;
    } else {
      if(e.vy > 0){ e.y = Math.min(e.y, m.y - e.h); e.grounded = true; e.standing = m; }
      else if(e.vy < 0) e.y = Math.max(e.y, m.y + m.h);
      e.vy = 0;
    }
  }
}

function puff(x, y, n, col, spd){

function ring(x, y, col, r){                  // короткая ударная волна

/* Отдача в телефоне: короткая вибрация на каждое заметное событие. */

function recKey(dk){ return dk + (curSrc === "seed" ? "_" + curSeed : ""); }
function syncSeedUrl(){
  try{
    localStorage.setItem("peremena_seed", curSeed);
    localStorage.setItem("peremena_src", curSrc);
  }catch(e){}
  try{ location.hash = (curSrc === "seed") ? ("s=" + curSeed) : "classic"; }catch(e){}
}
function applySource(){                 // пересобрать набор уровней под текущий выбор
  LEVELS = (curSrc === "seed") ? genLevels(curSeed) : CAMPAIGN;
  syncSeedUrl();
  if(G && G.state === "menu"){
    G.level = buildLevel(LEVELS[0]);
    G.coinsMax = 0;
    for(var i=0;i<LEVELS.length;i++) G.coinsMax += buildLevel(LEVELS[i]).coinTotal;
    G.cam = 0;
  }
}
function setSeed(sd, src){
  sd = cleanSeed(sd);
  if(!sd) return;
  curSeed = sd;
  curSrc = src || "seed";
  applySource();
}
window.addEventListener("hashchange", function(){
  var h = "";
  try{ h = (location.hash || "").replace(/^#/, ""); }catch(e){ return; }
  if(/^g=/i.test(h)){ giftFromUrl(h.slice(2)); return; }
  if(/^s=/i.test(h)){
    var sd = cleanSeed(h.slice(2));
    if(sd && (sd !== curSeed || curSrc !== "seed")) setSeed(sd, "seed");
  } else if(/^classic$/i.test(h) && curSrc !== "classic"){
    curSrc = "classic"; applySource();
  }
});
function startRun(mode, src){
  var st = G ? G.state : "menu";
  var wipe = 34;
  curDiff = DIFFS[mode] || DIFFS[(G && G.pick) || "normal"];
  if(src) curSrc = src;
  if(curDiff.endless) curSrc = "seed";           // бесконечный всегда по сиду
  LEVELS = (curSrc === "seed") ? genLevels(curSeed) : CAMPAIGN;
  syncSeedUrl();
  var pick = curDiff.key;
  G = newGame();
  G.pick = pick;
  G.reviveLeft = upg("revive") + (starBuff.life|0);
  if(starBuff.life){ starBuff.life = 0; starBuffSave(); toast("Запасное дыхание наготове"); }
  G.dblBuns = starBuff.double;
  if(starBuff.double){ starBuff.double = false; starBuffSave(); toast("Двойные булки на этот забег"); }
  if(devGod || powOn()) G.cheated = true;   // с читами рекорд не в счёт
  try{ localStorage.setItem("peremena_mode", pick); }catch(e){}
  G.state = "play";
  G.coinsMax = 0;
  for(var i=0;i<LEVELS.length;i++) G.coinsMax += buildLevel(LEVELS[i]).coinTotal;
  if(startItem && ITEMS[startItem]){        // купленный в магазине предмет
    G.item = startItem;
    startItem = null;
    try{ localStorage.removeItem("peremena_startitem"); }catch(e){}
    toast("В руках: " + ITEMS[G.item].n);
  }
  if(curDiff.endless){
    G.erng = mulberry(hashSeed(curSeed + "endless"));
    G.floor = 1;
  }
  beginLevel(0);
  if(G.state !== "lesson") G.wipe = wipe;
  if(st === "menu") sfx.door();
}
function enterHub(){
  statSave();
  var keep = G ? G.pick : "normal";
  curDiff = DIFFS[keep] || DIFFS.normal;
  G = newGame();
  G.pick = keep;
  G.state = "hub";
  G.wipe = 30;
  G.level = buildLevel(HUB);
  G.hintT = 260;
  for(var i=0;i<LEVELS.length;i++) G.coinsMax += buildLevel(LEVELS[i]).coinTotal;
  spawnPlayer();
  G.cam = camTarget();
}
function hubNear(){
  var st = G.level.stands, p = G.player, i;
  if(!p) return null;
  for(i=0;i<st.length;i++)
    if(Math.abs((p.x + p.w/2) - (st[i].x + st[i].w/2)) < 34) return st[i];
  return null;
}
function hubUse(){
  var st = hubNear();
  if(!st) return;
  var info = STAND_INFO[st.kind];
  sfx.box();
  if(info.s === "start"){ startRun(G.pick); return; }
  G.back = "hub";
  G.state = info.s;
}
function beginLevel(i){
  loadLevel(i);
  if(mod("skipclass")){ G.state = "play"; return; }
  startLesson(i);
}
function loadLevel(i){
  G.levelIndex = i;
  G.level = buildLevel(LEVELS[i]);
  G.hasKey = false;
  G.hintT = 240;
  G.banner = 0;
  G.parts = [];
  spawnPlayer();
}
function spawnPlayer(){
  if(mod("startbag") || upg("bag")) G.shield = true;
  var s = G.level.start;
  var small = mod("tiny");
  G.player = { x:s.x, y:s.y + (small ? 6 : 0), w:small ? 15 : 20, h:small ? 21 : 28,
               small:small, vx:0, vy:0, dir:1, grounded:false,
               coyote:0, jumpBuf:0, anim:0, sqx:1, sqy:1, dead:false, deadT:0,
               standing:null, hitWall:false, spawnT:18, jumping:false, air:0, fall:0 };
  G.cam = camTarget();
}
function camTarget(){
  var lv = G.level, p = G.player;
  if(!lv || !p) return G.cam || 0;
  var max = Math.max(0, lv.w*TS - VW);
  var want = clamp(p.vx * 17, -74, 74);          // на бегу видно дальше по курсу
  G.lead += (want - G.lead) * 0.05;
  return clamp(p.x + p.w/2 - VW/2 + G.lead, 0, max);
}

function goOver(reason){
  G.state = "over"; G.overReason = reason;
  var sc = runScore();
  if(sc > STATS.best) STATS.best = sc;
  statBump();
}
function toast(msg){ G.toast = msg; G.toastT = 110; }
function useItem(){
  if(G.state !== "play" || !G.item || !G.player || G.player.dead) return;
  var k = G.item;
  G.item = G.item2 || null;              // второй карман подаёт следующий
  G.item2 = null;
  stat("items"); taskBump("items");
  if(k === "watch"){ G.timeLeft += 20; G.flash = 14; toast("+20 секунд"); }
  else if(k === "bag"){ G.shield = true; toast("Портфель наготове"); }
  else if(k === "whistle"){                       // свисток слышно на весь этаж
    G.freeze = Math.max(G.freeze, 420);
    if(G.level && G.level.shots) G.level.shots.length = 0;
    G.flash = 10; G.shake = 6;
    ring(G.player.x+10, G.player.y+14, "rgba(255,156,90,.8)", 90);
    toast("Свисток! Все замерли");
  }
  else { G.buff[k] = ITEMS[k].t; toast(ITEMS[k].n + " действует"); }
  puff(G.player.x+10, G.player.y+14, 14, ITEMS[k].c, 3);
  sfx.item();
}
function hurtPlayer(){                 // урон с учётом портфеля-щита
  hitStop(7); buzz(45);
  if(G.invul > 0 || devGod) return;
  if(G.shield){
    G.shield = false;
    G.flash = 10; G.shake = 8;
    G.invul = 80;                      // пара секунд, чтобы выбраться из шипов
    G.player.vy = -9; G.player.spawnT = 80;
    puff(G.player.x+10, G.player.y+14, 18, "#9b6bf0", 4);
    toast("Портфель принял удар");
    sfx.stomp();
    return;
  }
  killPlayer();
}
function killPlayer(silent){
  if(!silent && G.player && !G.player.dead && G.reviveLeft > 0){   // «Второе дыхание»
    G.reviveLeft--;
    G.invul = 90;
    G.player.x = G.level.start.x; G.player.y = G.level.start.y;
    G.player.vx = 0; G.player.vy = 0; G.player.fall = 0;
    G.cam = camTarget();
    ring(G.player.x+10, G.player.y+14, "#8bffcf", 60);
    puff(G.player.x+10, G.player.y+14, 18, "#8bffcf", 3.2);
    toast("Второе дыхание! Падение не засчитано");
    sfx.win();
    return;
  }
  var p = G.player;
  if(p.dead) return;
  if(devGod && !silent){              // в режиме бессмертия просто возвращаем на старт
    p.x = G.level.start.x; p.y = G.level.start.y;
    p.vx = 0; p.vy = 0; G.invul = 40;
    return;
  }
  p.dead = true; p.deadT = 0; p.vy = -7; p.vx = 0;
  if(!silent){
    G.deaths++; stat("falls");       // рестарт по R не считается падением
    if(curDiff.deathCost){ G.timeLeft = Math.max(0, G.timeLeft - curDiff.deathCost); G.penalty = 75; }
  }
  G.shake = 14;
  puff(p.x+p.w/2, p.y+p.h/2, 22, "#ff6b6b", 4.5);
  ring(p.x+p.w/2, p.y+p.h/2, "rgba(255,107,107,.8)", 46);
  if(!silent){ hitStop(6); buzz(60); sfx.hurt(); }
}

function updatePlayer(dt){
  var p = G.player, lv = G.level, i;
  if(!p || !lv) return;                 // экран без игрока (меню, конец забега)

  if(p.dead){
    p.deadT++;
    p.vy = Math.min(p.vy + powGrav(), MAXFALL);
    p.y += p.vy;
    if(p.deadT > 46){
      if(oneLife()){ goOver("dead"); sfx.fail(); }
      else spawnPlayer();
    }
    return;
  }
  if(p.spawnT > 0) p.spawnT--;

  /* едем на платформе */
  if(p.standing && p.standing.isMover){
    p.x += p.standing.dx;
    p.y += p.standing.dy;
  }
  p.standing = null;
  p.grounded = false;
  p.hitWall = false;

  var ix = (input.right?1:0) - (input.left?1:0);
  if(mod("wind")) p.vx += windNow() * 0.09;      // сквозняк тянет всё время
  var slip = mod("ice");
  var acc = slip ? 0.42 : 0.85;
  if(ix){ p.vx += acc*ix; p.dir = ix; }
  else { p.vx *= p.grounded && slip ? 0.975 : 0.80; if(Math.abs(p.vx) < 0.06) p.vx = 0; }
  p.vx = clamp(p.vx, -runMax(), runMax());

  p.vy = Math.min(p.vy + powGrav(), MAXFALL);
  if(G.buff.umbrella > 0 && p.vy > 1.6) p.vy = 1.6 + (p.vy - 1.6) * 0.18;   // зонтик держит
  if(POW.fly){                                   // полёт: пробел тянет вверх, иначе зависаем
    p.vy = input.jump ? -4.8 : p.vy * 0.55;
    p.jumping = false; p.jumpBuf = 0;
  }
  if(p.coyote > 0) p.coyote--;
  if(p.jumpBuf > 0) p.jumpBuf--;

  if(p.jumpBuf > 0 && p.coyote > 0){
    p.vy = jumpV(); p.jumpBuf = 0; p.coyote = 0; p.jumping = true;
    p.sqx = 0.78; p.sqy = 1.28;
    puff(p.x+p.w/2, p.y+p.h, 6, "#ffffff", 1.8);
    ring(p.x+p.w/2, p.y+p.h, "rgba(255,255,255,.6)", 16);
    stat("jumps"); buzz(6);
    sfx.jump();
  } else if(p.jumpBuf > 0 && !p.grounded && p.air > 0 && canDouble()){
    p.vy = jumpV() * 0.92; p.jumpBuf = 0; p.air--; p.jumping = true;
    p.sqx = 0.8; p.sqy = 1.25;
    puff(p.x+p.w/2, p.y+p.h, 10, "#ff9ff3", 2.4);
    ring(p.x+p.w/2, p.y+p.h, "rgba(255,159,243,.8)", 22);
    stat("jumps"); buzz(8);
    sfx.jump();
  }
  if(p.jumping && !input.jump && p.vy < -4.2){ p.vy = -4.2; p.jumping = false; }  // короткий прыжок

  /* движение + столкновения */
  p.x += p.vx;
  if(!POW.ghost){ collideTiles(p,"x"); collideMovers(p,"x"); }
  var wasAir = !p.grounded;
  p.y += p.vy;
  if(!POW.ghost){ collideTiles(p,"y"); collideMovers(p,"y"); }
  else if(POW.fly || POW.ghost) p.x = clamp(p.x, 0, lv.w*TS - p.w);

  if(p.grounded){
    p.jumping = false;
    p.air = (canDouble() ? 1 : 0) + POW.air;
    p.coyote = curDiff.coyote;
    if(wasAir && p.fall > 7){                    // тяжёлое приземление слышно и видно
      var hard = Math.min(1, (p.fall - 7) / 6);
      p.sqx = 1.22 + 0.2*hard; p.sqy = 0.8 - 0.14*hard;
      puff(p.x+p.w/2, p.y+p.h, 6 + Math.round(10*hard), "#ffffff", 1.6 + 1.6*hard);
      ring(p.x+p.w/2, p.y+p.h, "rgba(255,255,255,.5)", 20 + 22*hard);
      G.shake = Math.max(G.shake, 3 + 4*hard);
      G.landT = 6;
      if(hard > 0.4){ tone(150, 0.07, "square", 0.04*hard, -60); buzz(10 + 14*hard); }
    } else if(p.sqy > 1){
      p.sqx = 1.22; p.sqy = 0.8; puff(p.x+p.w/2, p.y+p.h, 5, "#ffffff", 1.6);
    }
    p.fall = 0;
  } else {
    p.fall = Math.max(p.fall || 0, p.vy);
  }
  if(G.landT > 0) G.landT--;
  if(!fancy()){ }
  else if(Math.abs(p.vx) > 3.4 && p.grounded && G.tick % 3 === 0)
    G.trail.push({ x:p.x, y:p.y, w:p.w, h:p.h, col:"#9fd8ff", life:10, max:10 });
  else if(G.buff.soda > 0 && G.tick % 2 === 0)
    G.trail.push({ x:p.x, y:p.y, w:p.w, h:p.h, col:"#ff8a85", life:12, max:12 });
  p.sqx += (1 - p.sqx) * 0.18;
  p.sqy += (1 - p.sqy) * 0.18;
  p.anim += Math.abs(p.vx) * 0.22;

  if(mod("bounce") && p.grounded && wasAir){           // «Пружинящие доски»
    var by = Math.floor((p.y + p.h + 1)/TS), bc;
    for(bc = Math.floor((p.x+2)/TS); bc <= Math.floor((p.x+p.w-2)/TS); bc++){
      if(lv.grid[by] && lv.grid[by][bc] === "="){
        p.vy = jumpV() * 0.86; p.grounded = false; p.jumping = true;
        p.sqx = 0.8; p.sqy = 1.26;
        puff(p.x+p.w/2, p.y+p.h, 7, "#8bffcf", 2.2);
        sfx.jump();
        break;
      }
    }
  }
  if(mod("glass") && p.grounded){                      // «Стеклянные доски»
    var fy = Math.floor((p.y + p.h + 1)/TS), cc;
    for(cc = Math.floor((p.x+2)/TS); cc <= Math.floor((p.x+p.w-2)/TS); cc++){
      if(lv.grid[fy] && lv.grid[fy][cc] === "="){
        var kk = cc + "," + fy;
        if(!lv.crack[kk] && !lv.broke[kk]) lv.crack[kk] = 34;
      }
    }
  }

  /* батуты */
  for(i=0;i<lv.pads.length;i++){
    var pad = lv.pads[i];
    if(pad.t > 0) pad.t--;
    if(p.vy >= 0 && overlap(p, pad) && p.y + p.h <= pad.y + 14){
      p.y = pad.y - p.h; p.vy = PAD_V; p.coyote = 0; p.jumping = false; pad.t = 14;
      p.sqx = 0.7; p.sqy = 1.4; p.fall = 0;
      puff(pad.x+pad.w/2, pad.y, 10, "#7ef7c0", 3);
      ring(pad.x+pad.w/2, pad.y, "#7ef7c0", 34);
      G.shake = Math.max(G.shake, 4);
      stat("pads"); buzz(14);
      sfx.pad();
    }
  }

  /* шипы */
  var body = { x:p.x+3, y:p.y+4, w:p.w-6, h:p.h-4 };
  if(G.invul <= 0 && !POW.ghost)
    for(i=0;i<lv.spikes.length;i++) if(overlap(body, lv.spikes[i])){ hurtPlayer(); return; }

  /* падение в пропасть */
  if(p.y > lv.h*TS + 40){
    if(POW.fly || POW.ghost){ p.y = 0; p.vy = 0; }      // с полётом вниз не проваливаемся
    else { killPlayer(); return; }
  }

  /* пирожки */
  for(i=0;i<lv.coins.length;i++){
    var c = lv.coins[i];
    if(c.got) continue;
    c.ph += 0.09;
    var mr = Math.max(mod("magnet") ? 120 : 0, POW.magnet, 60*upg("magnet"),
                      G.buff.magnetit > 0 ? 150 : 0);
    if(mr > 0){                                         // магнит: пирожки тянутся к игроку
      var dx = (p.x + p.w/2) - (c.x + 8), dy = (p.y + p.h/2) - (c.y + 8);
      var dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < mr && dist > 1){
        var pull = POW.magnet ? 6 : 3.2;
        c.x += dx/dist * pull; c.y += dy/dist * pull;
      }
    }
    if(overlap(p, c)){
      c.got = true; G.coins++; stat("pies");
      var mul = (G.dblBuns || evDouble()) ? 2 : 1;
      stat("buns", mul); G.runBuns += mul;
      G.combo = (G.comboT > 0) ? Math.min(5, G.combo + 1) : 1;
      G.comboT = 110;
      G.comboPts += 10 * (G.combo - 1);
      if(G.combo > STATS.maxCombo) STATS.maxCombo = G.combo;
      taskBump("pies"); taskBump("combo", G.combo);
      if(G.combo > 1) toast("×" + G.combo + " подряд");
      pop(c.x+8, c.y+2, "+" + (10 * G.combo), G.combo > 1 ? "#8bffcf" : "#ffd166", 12 + G.combo);
      puff(c.x+8, c.y+8, 10, "#ffd166", 2.6);
      ring(c.x+8, c.y+8, "rgba(255,209,102,.8)", 18);
      buzz(5);
      tone(860 + G.combo*110, 0.07, "square", 0.05, 0);
      tone(1300 + G.combo*110, 0.10, "square", 0.045, 0, 0.06);
    }
  }
  /* шкафчики */
  for(i=0;i<lv.lockers.length;i++){
    var lk = lv.lockers[i];
    var free = !G.item || (upg("pockets") && !G.item2);
    if(lk.open || !free) continue;
    if(!overlap(p, lk)) continue;
    lk.open = true; lk.t = 16;
    lk.item = rollItem(mulberry(hashSeed(lv.name + "#" + Math.round(lk.x))));
    if(!G.item) G.item = lk.item; else G.item2 = lk.item;
    toast(ITEMS[lk.item].n + " — " + ITEMS[lk.item].d);
    pop(lk.x+13, lk.y+2, ITEMS[lk.item].n, ITEMS[lk.item].c, 12);
    puff(lk.x+13, lk.y+14, 12, ITEMS[lk.item].c, 2.6);
    ring(lk.x+13, lk.y+14, ITEMS[lk.item].c, 30);
    stat("lockers"); taskBump("lockers"); buzz(12);
    sfx.box();
  }
  /* ключ */
  if(lv.key && !lv.key.got){
    lv.key.ph += 0.08;
    if(overlap(p, lv.key)){
      lv.key.got = true; G.hasKey = true; G.flash = 12; taskBump("keys");
      pop(lv.key.x+8, lv.key.y, "КЛЮЧ!", "#ffe066", 14);
      puff(lv.key.x+8, lv.key.y+7, 16, "#ffe066", 3);
      ring(lv.key.x+8, lv.key.y+7, "#ffe066", 40);
      stat("keys"); hitStop(4); buzz(20);
      sfx.key();
    }
  }
  /* враги */
  for(i=0;i<lv.enemies.length;i++){
    var en = lv.enemies[i];
    if(en.dead) continue;
    if(!overlap(body, en)) continue;
    if(G.buff.pass > 0 || G.invul > 0) continue;        // «Пропуск» и неуязвимость после удара
    if(!en.fly && !en.tough && !mod("nostomp") && p.vy > 1.2 && (p.y + p.h) - en.y < 18){
      en.dead = true; en.deadT = 0; stat("stomps"); taskBump("stomps");
      p.vy = -8.4; p.sqx = 1.2; p.sqy = 0.82; p.fall = 0;
      G.shake = 9;
      pop(en.x+en.w/2, en.y, "БАМ!", "#ffffff", 15);
      puff(en.x+en.w/2, en.y+en.h/2, 16, "#c8d6e5", 3.4);
      ring(en.x+en.w/2, en.y+en.h/2, "rgba(255,255,255,.75)", 34);
      hitStop(5); buzz(22);
      sfx.stomp();
    } else { hurtPlayer(); return; }
  }
  /* дверь */
  if(lv.doorHit && overlap(p, lv.doorHit) && doorOpen()){
    ring(lv.door.cx, lv.door.y + 20, "#8bffcf", 60);
    hitStop(6); buzz(30);
    nextLevel();
  }
}

function coinsLeft(){
  var lv = G.level, n = 0, i;
  for(i=0;i<lv.coins.length;i++) if(!lv.coins[i].got) n++;
  return n;
}
function doorOpen(){
  if(G.level.needKey && !G.hasKey) return false;
  if(mod("hungry") && coinsLeft() > 0) return false;
  return true;
}
function updateBalls(){
  var lv = G.level, p = G.player, i, j, bl, en;
  if(!lv || !p) return;
  for(i=0;i<lv.balls.length;i++){
    bl = lv.balls[i];
    if(bl.cool > 0) bl.cool--;
    bl.vy = Math.min(bl.vy + GRAV*0.8, 12);
    bl.grounded = false;
    bl.x += bl.vx; collideTiles(bl, "x");
    if(bl.hitWall){ bl.vx = -bl.vxPrev * 0.55; bl.hitWall = false; }
    bl.vxPrev = bl.vx;
    bl.y += bl.vy; collideTiles(bl, "y");
    if(bl.grounded){
      if(bl.vyPrev > 3.5) bl.vy = -bl.vyPrev * 0.42;   // отскок
      bl.vx *= 0.975;
      if(Math.abs(bl.vx) < 0.05) bl.vx = 0;
    }
    bl.vyPrev = bl.vy;
    bl.spin += bl.vx * 0.06;
    if(bl.y > lv.h*TS + 60){                            // укатился в яму — возвращаем
      bl.x = lv.start.x + 60; bl.y = lv.start.y; bl.vx = bl.vy = 0;
    }
    /* пинок игроком */
    if(p && !p.dead && bl.cool <= 0 && overlap(p, bl)){
      var dir = (p.x + p.w/2 < bl.x + bl.w/2) ? 1 : -1;
      bl.vx = dir * (4 + Math.abs(p.vx) * 1.3);
      bl.vy = -3.4;
      bl.cool = 8;
      puff(bl.x+10, bl.y+18, 5, "#ffffff", 1.6);
      tone(320, 0.07, "square", 0.05, 120);
    }
    /* мяч сбивает завуча */
    if(Math.abs(bl.vx) > 2.4){
      for(j=0;j<lv.enemies.length;j++){
        en = lv.enemies[j];
        if(en.dead || !overlap(bl, en)) continue;
        en.dead = true; en.deadT = 0; stat("stomps"); stat("goals");
        taskBump("stomps"); taskBump("goals");
        G.bonusPts += 20;
        G.shake = 7;
        bl.vx *= -0.5;
        puff(en.x+13, en.y+14, 16, "#c8d6e5", 3.4);
        toast("ГОООЛ! +20");
        sfx.stomp();
      }
    }
  }
}
function ringBell(){
  var lv = G.level, p = G.player, i, bl;
  for(i=0;i<lv.bells.length;i++){
    bl = lv.bells[i];
    if(bl.used || !p) continue;
    if(Math.abs((p.x + p.w/2) - (bl.x + bl.w/2)) > 40) continue;
    bl.used = true; bl.t = 30; stat("bells");
    G.freeze = 260;
    G.flash = 10;
    toast("Ты нажал звонок! Все замерли");
    sfx.bell();
    return true;
  }
  return false;
}
function tickGlass(){
  var lv = G.level, k, parts;
  for(k in lv.crack){
    lv.crack[k]--;
    if(lv.crack[k] <= 0){
      delete lv.crack[k];
      lv.broke[k] = 220;
      parts = k.split(",");
      puff(+parts[0]*TS + 16, +parts[1]*TS + 7, 10, "#d6a15a", 2.6);
      ring(+parts[0]*TS + 16, +parts[1]*TS + 7, "rgba(214,161,90,.7)", 26);
      stat("glass"); buzz(10);
      tone(200, 0.1, "square", 0.05, -90);
    }
  }
  for(k in lv.broke){ lv.broke[k]--; if(lv.broke[k] <= 0) delete lv.broke[k]; }
}
function updateEnemies(){
  var lv = G.level, i, p = G.player;
  if(G.freeze > 0) G.freeze--;
  var rush = alarmOn() ? 1.9 : 1;                      // «Учебная тревога»
  for(i=0;i<lv.enemies.length;i++){
    var e = lv.enemies[i];
    if(e.dead){ e.deadT++; continue; }
    if(G.freeze > 0) continue;                         // звонок: все замерли
    e.hitWall = false;
    e.anim += Math.abs(e.vx) * 0.2;

    if(e.kind === "sleep"){                            // спит, пока не подойдёшь
      var near = p && !p.dead && Math.abs(p.x - e.x) < 118 && Math.abs(p.y - e.y) < 70;
      if(!e.wake && near){
        e.wake = 1;
        e.vx = e.base = 1.25 * curDiff.enemy * (mod("fast") ? 1.4 : 1);
        e.vx *= (p.x > e.x) ? 1 : -1;
        pop(e.x + e.w/2, e.y - 4, "!", "#ff8a8a", 16);
        stat("wakes"); taskBump("wakes");
        sfx.hurt();
      }
      if(!e.wake){ e.vy = Math.min(e.vy + GRAV, MAXFALL); e.y += e.vy; collideTiles(e,"y"); continue; }
    }
    if(e.kind === "throw"){                            // стоит и кидается журналом
      e.vy = Math.min(e.vy + GRAV, MAXFALL); e.y += e.vy; collideTiles(e,"y");
      if(p && !p.dead) e.dir = (p.x > e.x) ? 1 : -1;
      if(--e.cool <= 0){
        e.cool = Math.round((mod("fast") ? 96 : 140) / (alarmOn() ? 1.9 : 1));
        var seeX = p ? Math.abs(p.x - e.x) : 999;
        if(seeX < 300 && lv.shots.length < 14){
          lv.shots.push({ x:e.x + e.w/2 - 7, y:e.y + 6, w:14, h:11,
                          vx: e.dir * 3.1 * (mod("fast") ? 1.3 : 1), spin:0, life:260 });
          sfx.key();
        }
      }
      continue;
    }
    if(e.hunt && p && !p.dead){                        // охотник правит курс на игрока
      var want = (p.x > e.x) ? 1 : -1;
      if(e.vx === 0) e.vx = e.base * want;
      else if((e.vx > 0) !== (want > 0) && Math.abs(p.x - e.x) > 10) e.vx = -e.vx;
    }
    e.dir = e.vx > 0 ? 1 : -1;

    var step = e.vx * rush;
    e.x += step; collideTiles(e,"x"); collideMovers(e,"x");
    if(e.hitWall) e.vx = e.dir * e.base;               // скорость не теряется после стены
    if(!e.fly){
      e.vy = Math.min(e.vy + GRAV, MAXFALL);
      e.grounded = false;
      e.y += e.vy; collideTiles(e,"y"); collideMovers(e,"y");
      var aheadX = e.dir > 0 ? e.x + e.w + 3 : e.x - 3;
      var noFloor = !solidAtPx(aheadX, e.y + e.h + 4);
      if(e.tough && !e.passed && p && !p.dead && p.x > e.x + e.w + 6){
        e.passed = true; stat("guards"); taskBump("guards");
      }
      var away = !e.hunt && Math.abs(e.x - e.homeX) > e.range;
      if(e.hitWall || noFloor || away){
        e.vx = -e.dir * e.base;
        e.x += e.vx * 1.5;
      }
      if(e.y > lv.h*TS + 60) e.dead = true;
    } else {
      if(e.hitWall || Math.abs(e.x - e.homeX) > TS*7) { e.vx = -e.vx; e.x += e.vx*1.5; }
      e.y += Math.sin((G.tick + i*40) * 0.06) * 0.5;
    }
  }
}

function updateShots(){                   // брошенные журналы
  var lv = G.level, p = G.player, i, sh;
  if(!lv || !lv.shots) return;
  for(i=lv.shots.length-1;i>=0;i--){
    sh = lv.shots[i];
    if(G.freeze > 0) continue;
    sh.x += sh.vx; sh.spin += sh.vx * 0.09;
    sh.life--;
    if(sh.life <= 0 || solidAtPx(sh.x + sh.w/2, sh.y + sh.h/2)){
      puff(sh.x + sh.w/2, sh.y + sh.h/2, 6, "#e8eef7", 1.8);
      stat("dodged"); taskBump("dodged");
      lv.shots.splice(i, 1); continue;
    }
    if(p && !p.dead && G.buff.pass <= 0 && G.invul <= 0 && overlap(p, sh)){
      lv.shots.splice(i, 1);
      hurtPlayer();
      return;
    }
  }
}
function updateMovers(){
  var ms = G.level.movers, i;
  for(i=0;i<ms.length;i++){
    var m = ms[i];
    m.t += m.speed;
    var ph = (Math.sin(m.t) + 1) / 2;
    var nx = m.ox + (m.axis === "x" ? m.dist*ph : 0);
    var ny = m.oy + (m.axis === "y" ? m.dist*ph : 0);
    m.dx = nx - m.x; m.dy = ny - m.y;
    m.x = nx; m.y = ny;
  }
}

function updateParts(){
  var i;
  for(i=G.parts.length-1;i>=0;i--){
    var q = G.parts[i];
    q.x += q.vx; q.y += q.vy; q.vy += q.g; q.vx *= 0.98; q.life--;
    if(q.life <= 0) G.parts.splice(i,1);
  }
  for(i=G.pops.length-1;i>=0;i--){
    var o = G.pops[i];
    o.t++; o.y -= 1.35 - Math.min(1, o.t/22);
    if(o.t >= o.life) G.pops.splice(i,1);
  }
  for(i=G.rings.length-1;i>=0;i--){
    var rg = G.rings[i];
    rg.t++;
    if(rg.t >= rg.life) G.rings.splice(i,1);
  }
  for(i=G.trail.length-1;i>=0;i--){
    G.trail[i].life--;
    if(G.trail[i].life <= 0) G.trail.splice(i,1);
  }
}

function endlessPush(){                           // дорисовываем этаж на лету
  var n = LEVELS.length;
  var idx = Math.min(6, 1 + Math.floor(n/3));
  var nm = GEN_NAMES[Math.floor(G.erng()*GEN_NAMES.length)] + " " + (n+1);
  LEVELS.push(genLevel(G.erng, idx, nm, G.erng() < 0.25));
  G.coinsMax += buildLevel(LEVELS[n]).coinTotal;
}
function nextLevel(){
  stat("levels");
  taskBump("levels");
  if(mod("wind")) stat("windLv");
  if(upg("wallet") && G.coins){             // кошелёк доплачивает за собранное
    var extra = Math.floor(G.coins * 0.25 * upg("wallet")) - G.walletPaid;
    if(extra > 0){
      STATS.buns += extra;
      G.walletPaid += extra;
      G.runBuns += extra;
      if(G.player) pop(G.player.x+10, G.player.y-26, "+" + extra + " булок", "#ffd166", 13);
    }
  }
  STATS.wear[curSkin] = (STATS.wear[curSkin] || 0) + 1;    // образ растёт вместе с игроком
  if(curDiff.endless && (G.floor || 1) > STATS.maxFloor) STATS.maxFloor = G.floor || 1;
  if(Math.round(modMult()*100) > STATS.bestMult) STATS.bestMult = Math.round(modMult()*100);
  statBump();                         // копилка булок не должна теряться посреди забега
  if(coinsLeft() === 0 && G.level.coinTotal > 0){
    G.bonusPts += 50; G.allPies++; stat("clean"); taskBump("clean");
    toast("Все пирожки на уровне! +50");
    if(G.player) pop(G.player.x + G.player.w/2, G.player.y - 10, "+50 ЧИСТО", "#8bffcf", 15);
  }
  sfx.door();
  if(curDiff.endless){
    G.timeLeft += curDiff.bonus;
    G.floor = (G.floor || 1) + 1;
    toast("Этаж пройден! +" + curDiff.bonus + " сек");
    if(G.levelIndex + 1 >= LEVELS.length) endlessPush();
  }
  G.banner = 70;
  G.state = "clear";
}
function runPoints(){
  var done = (G.state === "win") ? LEVELS.length : G.levelIndex;
  return Math.max(0, done*100 + G.coins*10 + G.comboPts + G.bonusPts +
                     Math.floor(G.timeLeft)*2 - G.deaths*20);
}
function runScore(){ return Math.round(runPoints() * modMult()); }
function finishRun(){
  G.state = "win";
  sfx.win();
  stat("runs");
  if(curDiff.oneLife) stat("hardRuns");
  if(curDiff.brutal) stat("lastRuns");
  if(curDiff.endless) stat("endRuns");
  if(curSrc === "seed") stat("seedRuns");
  if(G.deaths === 0) stat("noFall");
  if(modCount() >= 5) stat("modRun");
  if(!G.cheated && (curDiff.time - G.timeLeft) < 300) STATS.fastRun = 1;
  if(G.deaths === 0) taskBump("nofall");
  var used = curDiff.time - G.timeLeft;
  var best = bestScore(recKey(curDiff.key));
  var sc = runScore();
  if(sc > STATS.best) STATS.best = sc;
  statBump();
  if(!G.cheated && (!best || sc > (best.score || 0))){
    G.record = true;
    try{ localStorage.setItem("peremena_best_" + recKey(curDiff.key),
      JSON.stringify({ time:used, coins:G.coins, deaths:G.deaths, score:sc })); }catch(e){}
  }
  G.best = best;
}
function bestScore(key){
  try{ return JSON.parse(localStorage.getItem("peremena_best_" + key) || "null"); }catch(e){ return null; }
}

function update(dtSec){
  G.tick++;
  if(G.hitStop > 0){ G.hitStop--; if(G.shake > 0) G.shake *= 0.92; return; }
  if(G.shake > 0) G.shake *= 0.88;
  if(G.flash > 0) G.flash--;
  if(G.hintT > 0) G.hintT--;
  if(G.hotT > 0) G.hotT--;
  if(G.secretT > 0) G.secretT--;
  if(G.codeBad > 0) G.codeBad--;
  if(G.codeLock > 0) G.codeLock--;
  if(G.confirmT > 0){ G.confirmT--; if(!G.confirmT) G.confirmId = null; }
  if(G.state !== G.lastState){ G.lastState = G.state; G.stateT = 0; }
  G.stateT++;
  if(G.wipe > 0) G.wipe--;
  if(G.penalty > 0) G.penalty--;

  if(G.toastT > 0) G.toastT--;
  if(G.achT > 0) G.achT--;
  else if(G.achQueue.length){ G.achShow = G.achQueue.shift(); G.achT = 150; }
  if(G.invul > 0) G.invul--;
  if(G.state === "play"){
    if(G.comboT > 0){ G.comboT--; if(!G.comboT) G.combo = 0; }
    if(G.buff.soda > 0) G.buff.soda--;
    if(G.buff.gum > 0) G.buff.gum--;
    if(G.buff.pass > 0) G.buff.pass--;
    if(G.buff.umbrella > 0) G.buff.umbrella--;
    if(G.buff.magnetit > 0) G.buff.magnetit--;
    tickGlass();
    updateBalls();
    if(!POW.freeze) G.timeLeft -= dtSec;
    if(G.timeLeft <= 0){
      G.timeLeft = 0; goOver("bell"); sfx.bell(); G.shake = 20;
    }
    updateMovers();
    updatePlayer(dtSec);
    updateEnemies();
    updateShots();
    updateParts();
    G.cam += (camTarget() - G.cam) * 0.14;
  } else if(G.state === "lesson"){
    lessonUpdate();
    updateParts();
  } else if(G.state === "hub"){
    updateMovers();
    updatePlayer(dtSec);
    updateParts();
    G.cam += (camTarget() - G.cam) * 0.14;
  } else if(G.state === "clear"){
    updateMovers(); updateEnemies(); updateShots(); updateParts();
    G.banner--;
    if(G.banner <= 0){
      if(!curDiff.endless && G.levelIndex + 1 >= LEVELS.length){ finishRun(); }
      else beginLevel(G.levelIndex + 1);
    }
  } else {
    updateParts();
    if(G.state === "menu" || G.state === "mods" || G.state === "skins" ||
       G.state === "iteminfo" || G.state === "records") menuDrift();
  }
}

/* ================== ОТРИСОВКА ================== */
function rrect(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);   // узкая полоска не должна крючиться
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
/* Градиенты стоят дорого, а повторяются каждый кадр — держим их в словаре. */
var gradCache = {};
function vGrad(key, x0, y0, x1, y1, stops){
  var g = (ctx === mainCtx) ? gradCache[key] : null, i;
  if(!g){
    g = ctx.createLinearGradient(x0, y0, x1, y1);
    for(i=0;i<stops.length;i+=2) g.addColorStop(stops[i], stops[i+1]);
    if(ctx === mainCtx) gradCache[key] = g;
  }
  return g;
}
function rGrad(key, x0, y0, r0, x1, y1, r1, stops){
  var g = gradCache[key], i;
  if(!g){
    g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
    for(i=0;i<stops.length;i+=2) g.addColorStop(stops[i], stops[i+1]);
    gradCache[key] = g;
  }
  return g;
}
function text(str, x, y, size, col, align, weight){
  ctx.font = (weight||700) + " " + size + "px 'Segoe UI', system-ui, Arial, sans-serif";
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = col;
  ctx.fillText(str, x, y);
}
function hintPlate(str, y, size, col){          // подсказка на своей плашке
  ctx.font = "700 " + size + "px 'Segoe UI', system-ui, Arial, sans-serif";
  var w = ctx.measureText(str).width + 26;
  ctx.fillStyle = "rgba(6,12,24,.6)";
  rrect(VW/2 - w/2, y - size - 4, w, size + 14, 9); ctx.fill();
  text(str, VW/2, y, size, col || "#ffffff", "center");
}
var fitCache = {}, fitKeys = [];
function textFit(str, x, y, size, col, align, weight, maxW){
  var key = str + "|" + size + "|" + (weight || 700) + "|" + Math.round(maxW);
  var sz = fitCache[key];
  if(sz === undefined){
    sz = size;                                     // подпись ужимается, а не лезет на соседа
    while(sz > 7){
      ctx.font = (weight||700) + " " + sz + "px 'Segoe UI', system-ui, Arial, sans-serif";
      if(ctx.measureText(str).width <= maxW) break;
      sz -= 0.5;
    }
    fitCache[key] = sz;
    fitKeys.push(key);
    if(fitKeys.length > 900) delete fitCache[fitKeys.shift()];
  }
  text(str, x, y, sz, col, align, weight);
}
function shadowText(str, x, y, size, col, align){
  text(str, x+2, y+2, size, "rgba(0,0,0,.45)", align);
  text(str, x, y, size, col, align);
}

function hsh(i){ var x = Math.sin(i*127.1 + 11.3) * 43758.5453; return x - Math.floor(x); }
var curDeco = "";                          // какой фон рисуем — часть ключа кэша
function bgLoop(cam, par, step, fn, live){ // ряд объектов с параллаксом
  var off = -cam*par, first, i;
  if(!live && step >= 24 && step <= 1200){
    var reps = Math.max(2, Math.ceil(1700/step));
    var period = step * reps;
    var img = cachedImg("bg" + curDeco + "_" + par + "_" + step, period, VH, function(){
      for(var j=-1; j<=reps; j++) fn(j*step, ((j % reps) + reps) % reps);
    });
    var start = Math.floor(-off / period) - 1;
    for(i = start; i <= start + Math.ceil(VW/period) + 1; i++)
      ctx.drawImage(img, Math.round(i*period + off), 0);
    return;
  }
  first = Math.floor(-off/step) - 1;
  for(i = first; i < first + Math.ceil(VW/step) + 3; i++) fn(i*step + off, i);
}
function sunImg(key, r, c1, c2, coreR, coreCol){    // солнце с ореолом — тоже картинка
  return cachedImg("sun" + key, r*2, r*2, function(){
    var g = ctx.createRadialGradient(r, r, 10, r, r, r);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(r, r, r, 0, 6.2832); ctx.fill();
    ctx.fillStyle = coreCol; ctx.beginPath(); ctx.arc(r, r, coreR, 0, 6.2832); ctx.fill();
  });
}
var cloudImg = null;
function drawCloud(x, y){
  if(!cloudImg) cloudImg = cachedImg("cloud", 120, 80, function(){
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath();
    ctx.arc(50, 40, 26, 0, 6.2832); ctx.arc(76, 46, 20, 0, 6.2832);
    ctx.arc(26, 48, 18, 0, 6.2832); ctx.arc(56, 26, 18, 0, 6.2832);
    ctx.fill();
  });
  ctx.drawImage(cloudImg, Math.round(x - 50), Math.round(y - 40));
}
function poster(x, y, w, h, str, col){
  ctx.fillStyle = "rgba(255,255,255,.9)";
  rrect(x, y, w, h, 3); ctx.fill();
  ctx.fillStyle = col || "#c0392b";
  ctx.fillRect(x+4, y+4, w-8, 3);
  ctx.save();
  ctx.font = "700 9px 'Segoe UI', system-ui, Arial, sans-serif";
  ctx.textAlign = "center"; ctx.fillStyle = "#2b3850";
  var words = str.split(" "), line = "", lines = [], k;
  for(k=0;k<words.length;k++){
    var test = line ? line + " " + words[k] : words[k];
    if(ctx.measureText(test).width > w-8 && line){ lines.push(line); line = words[k]; }
    else line = test;
  }
  lines.push(line);
  for(k=0;k<lines.length && k<3;k++) ctx.fillText(lines[k], x+w/2, y+20+k*10);
  ctx.restore();
}

  ctx.drawImage(cachedImg("sky" + th.sky[0] + th.sky[1] + th.sky[2], VW, VH, function(){
    var g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, th.sky[0]); g.addColorStop(0.45, th.sky[1]); g.addColorStop(1, th.sky[2]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  }), 0, 0);
  if(th.deco === "yard") decoYard(cam, th);
  else if(th.deco === "roof") decoRoof(cam, th);
