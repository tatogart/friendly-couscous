function drawBanner(){
  var k = 1 - Math.abs(G.banner - 35)/35;
  ctx.save();
  ctx.globalAlpha = Math.min(1, k*2);
  ctx.fillStyle = "rgba(6,12,26,.65)";
  rrect(VW/2-190, VH/2-46, 380, 92, 16); ctx.fill();
  gradText(G.allPies && coinsLeft() === 0 ? "Всё собрано!" : "Уровень пройден!",
           VW/2, VH/2-4, 30, "#dfffe8", "#3fd39a");
  text(G.levelIndex+1 < LEVELS.length ? "Дальше: " + LEVELS[G.levelIndex+1].name : "Последний рывок…",
       VW/2, VH/2+26, 15, "#dbe8ff", "center", 600);
  ctx.restore();
}

function rankOf(used, coins, deaths){
  if(coins === G.coinsMax && deaths === 0) return ["ОТЛИЧНИК С МЕДАЛЬЮ", "#ffd166"];
  if(coins >= G.coinsMax*0.8 && used < curDiff.time*0.55) return ["ОТЛИЧНИК", "#8bffcf"];
  if(coins >= G.coinsMax*0.5) return ["ХОРОШИСТ", "#9fd8ff"];
  return ["ТРОЕЧНИК, НО ЖИВОЙ", "#ffb3b3"];
}

function endButtons(y){
  uiButton("again", 120, y, 200, 60, "ЕЩЁ РАЗ", null, { size:19, selBg:"rgba(255,255,255,.2)" });
  uiButton("to_hub", 330, y, 160, 60, "В ХОЛЛ", null, { size:17, selBorder:"#ff9ff3" });
  uiButton("menu", 500, y, 180, 60, "В МЕНЮ", null, { size:19 });
}

function drawWin(){
  ctx.fillStyle = "rgba(4,10,22,.66)"; ctx.fillRect(0,0,VW,VH);
  panel(620, 430);
  var used = curDiff.time - G.timeLeft;
  var r = rankOf(used, G.coins, G.deaths);
  gradText("УСПЕЛ!", VW/2, 106, 46, "#dfffe8", "#3fd39a");
  text(curDiff.key === "hard" ? "И это на ХАРДКОРЕ. Уважение." : "Звонок ещё не прозвенел, а ты уже герой перемены.",
       VW/2, 134, 15, "#dbe8ff", "center", 600);
  text("Время " + fmtTime(used) + "   ·   пирожков " + G.coins + "/" + G.coinsMax +
       "   ·   падений " + G.deaths +
       (G.allPies ? "   ·   уровней подчистую " + G.allPies : ""),
       VW/2, 172, 14, "#dbe8ff", "center", 600);
  var target = runScore();
  G.scoreShown = G.scoreShown || 0;
  G.scoreShown += (target - G.scoreShown) * 0.14;
  if(target - G.scoreShown < 1) G.scoreShown = target;
  gradText(Math.round(G.scoreShown) + " ОЧКОВ", VW/2, 214, 34, "#fff3c4", "#f0a83a");
  text(runPoints() + " × " + modMult().toFixed(2) + (modCount() ? "  (модификаторов: " + modCount() + ")" : ""),
       VW/2, 236, 12, "rgba(220,235,255,.7)", "center", 600);
  text(r[0], VW/2, 278, 22, r[1], "center");
  if(G.record) text("★ новый рекорд ★", VW/2, 302, 14, "#ffd166", "center", 600);
  else if(G.best && G.best.score) text("рекорд: " + G.best.score + " очков", VW/2, 302, 13,
                                       "rgba(200,220,255,.7)", "center", 600);
  if(curSrc === "seed") text("сид " + curSeed, VW/2, 322, 13, "#9fd8ff", "center", 600);
  endButtons(344);
}

function drawOver(){
  ctx.fillStyle = "rgba(40,6,14,.68)"; ctx.fillRect(0,0,VW,VH);
  panel(620, 380);
  var dead = G.overReason === "dead";
  gradText(dead ? "ПОПАЛСЯ!" : "ДЗЫНЬ!", VW/2, 140, 46, "#ffd9d9", "#e05050");
  text(dead ? "В хардкоре жизнь одна — забег окончен."
            : "Перемена кончилась, а ты посреди коридора.",
       VW/2, 172, 15, "#ffd9d9", "center", 600);
  text(curDiff.endless ? "Этажей пройдено: " + ((G.floor || 1) - 1) + " · пирожков " + G.coins
                       : "Дошёл до уровня " + (G.levelIndex+1) + " · пирожков " + G.coins,
       VW/2, 206, 16, "#ffd98a", "center");
  text(runScore() + " очков", VW/2, 232, 20, "#ffd166", "center");
  if(curSrc === "seed") text("сид " + curSeed, VW/2, 238, 13, "rgba(200,220,255,.7)", "center", 600);
  endButtons(268);
}

function drawPaused(){
  ctx.fillStyle = "rgba(4,10,22,.66)"; ctx.fillRect(0,0,VW,VH);
  panel(520, 320);
  gradText("ПАУЗА", VW/2, 174, 40, "#e4f3ff", "#5aa8e0");
  uiButton("resume", 250, 200, 300, 62, "ПРОДОЛЖИТЬ", null, { size:22, sel:true });
  uiButton("restart", 250, 274, 142, 54, "СНАЧАЛА", null, { size:17 });
  uiButton("menu", 408, 274, 142, 54, "В МЕНЮ", null, { size:17 });
}

/* ================== КАДР ================== */
function render(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0,0,VW,VH);
  G.buttons = [];                       // кнопки собираются заново каждый кадр
  G.uiHover = false;

  var cam = G.level ? G.cam : 0;
  drawBackground(cam);

  if(G.level){
    ctx.save();
    var sh = G.shake;
    ctx.translate(-Math.round(cam) + (sh>0.4?rnd(-sh,sh):0), (sh>0.4?rnd(-sh,sh):0));
    drawTiles(cam);
    drawMovers();
    drawSpikes();
    if(G.state === "hub") drawStands();
    drawBells();
    drawLockers();
    drawBalls();
    drawPads();
    drawCoins();
    drawKey();
    drawDoor();
    for(var i=0;i<G.level.enemies.length;i++) drawEnemy(G.level.enemies[i]);
    drawParts();
    if(G.player) drawPlayer();
    ctx.restore();
  }

  if(mod("dark") && G.player && (G.state === "play" || G.state === "clear" || G.state === "paused")){
    var lx = G.player.x + G.player.w/2 - G.cam, ly = G.player.y + G.player.h/2;
    var lg = ctx.createRadialGradient(lx, ly, 30, lx, ly, 200);
    lg.addColorStop(0, "rgba(5,9,18,0)");
    lg.addColorStop(0.5, "rgba(5,9,18,.55)");
    lg.addColorStop(1, "rgba(5,9,18,.94)");
    ctx.fillStyle = lg; ctx.fillRect(0, 0, VW, VH);
  }
  drawWipe();
  if(G.flash > 0){
    ctx.fillStyle = "rgba(255,240,180," + (G.flash/12*0.35) + ")";
    ctx.fillRect(0,0,VW,VH);
  }

  syncPad();
  if(G.state === "lesson"){
    drawLesson(); drawVignette(); drawToast(); drawWipe(); drawCursor();
    return;
  }
  drawVignette();
  if(G.state === "menu"){ drawMenu(); drawToast(); drawCursor(); return; }
  if(G.state === "mods"){ if(G.back === "hub"){ drawHubHUD(); } else drawMenu(); drawMods(); return; }
  if(G.state === "skins"){ drawHubHUD(); drawSkins(); drawToast(); return; }
  if(G.state === "iteminfo"){ drawHubHUD(); drawItemInfo(); return; }
  if(G.state === "records"){ drawHubHUD(); drawRecords(); return; }
  if(G.state === "hub"){ drawHubHUD(); drawToast(); return; }
  drawHUD();
  drawCursor();
  if(G.state === "clear") drawBanner();
  else if(G.state === "win") drawWin();
  else if(G.state === "over") drawOver();
  else if(G.state === "paused") drawPaused();
}

/* ================== ЗАПУСК ================== */
function resize(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = VW*dpr; cv.height = VH*dpr;
  cv.style.width = ""; cv.style.height = "";
}
window.addEventListener("resize", resize);

var padShown = null, itemShown = null;
var itemBtn = document.querySelector(".btn.item");
function syncItemBtn(){
  var k = G.item || "";
  if(k === itemShown) return;
  itemShown = k;
  if(!itemBtn) return;
  itemBtn.classList.toggle("has", !!k);
  itemBtn.textContent = k ? ITEMS[k].n.toUpperCase() : "ПРЕДМЕТ";
}
function syncPad(){
  syncItemBtn();                              // джойстик нужен в игре, на уроке и в холле
  var show = (G.state === "play" || G.state === "clear" ||
              G.state === "lesson" || G.state === "hub");
  if(show === padShown) return;
  padShown = show;
  document.body.classList.toggle("hidepad", !show);
}
var mqPortrait = window.matchMedia ? window.matchMedia("(orientation: portrait)") : null;
function orientCheck(){
  if(isTouch && mqPortrait && mqPortrait.matches && G && G.state === "play") G.state = "paused";
}
if(mqPortrait){
  if(mqPortrait.addEventListener) mqPortrait.addEventListener("change", orientCheck);
  else if(mqPortrait.addListener) mqPortrait.addListener(orientCheck);
}
document.addEventListener("fullscreenchange", function(){
  document.body.classList.toggle("fs", isFullscreen());
  resize();
});
document.addEventListener("visibilitychange", function(){
  if(document.hidden && G && G.state === "play") G.state = "paused";
});

var last = 0, acc = 0, STEP = 1/60;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last = ts;
  var dt = Math.min(0.1, (ts - last)/1000);
  last = ts;
  acc += dt * (mod("fastgame") ? 1.2 : 1);
  var guard = 0;
  while(acc >= STEP && guard < 5){ update(STEP); acc -= STEP; guard++; }
  if(guard >= 5) acc = 0;
  render();
}

window.PEREMENA_DEBUG = {
  get: function(){ return G; },
  goto: function(i){ G.state = "play"; loadLevel(i); },
  start: startRun,
  input: input,
  levels: function(){ return LEVELS; },
  gen: function(seed){ return genLevels(seed); },
  seed: function(){ return { src: curSrc, seed: curSeed }; },
  setSeed: setSeed,
  mods: function(){ return modOn; },
  mult: modMult, points: runPoints, score: runScore,
  jumpV: jumpV, runMax: runMax, doorOpen: doorOpen, useItem: useItem,
  stats: function(){ return STATS; }, skin: function(){ return curSkin; },
  near: function(){ return hubNear(); }, hub: enterHub, ring: ringBell,
  lesson: startLesson, answer: lessonAnswer, quiz: function(){ return QUIZ; },
  end: lessonEnd
};

modLoad();
statLoad();
(function initSeed(){
  var h = "";
  try{ h = (location.hash || "").replace(/^#/, ""); }catch(e){}
  if(/^s=/i.test(h)){ curSeed = cleanSeed(h.slice(2)); curSrc = "seed"; }
  else {
    try{
      curSeed = cleanSeed(localStorage.getItem("peremena_seed"));
      if(!/^classic$/i.test(h)) curSrc = localStorage.getItem("peremena_src") || "classic";
    }catch(e){}
  }
  if(!curSeed) curSeed = randomSeed();
  LEVELS = (curSrc === "seed") ? genLevels(curSeed) : CAMPAIGN;
})();

G = newGame();
G.coinsMax = 0;
for(var li=0; li<LEVELS.length; li++) G.coinsMax += buildLevel(LEVELS[li]).coinTotal;
G.level = buildLevel(LEVELS[0]);
G.player = null;
try{ G.pick = localStorage.getItem("peremena_mode") || "normal"; }catch(e){}
resize();
requestAnimationFrame(frame);
})();
</script>
